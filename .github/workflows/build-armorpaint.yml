name: Build ArmorPaint Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ArmorPaint Windows x64
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout ArmorPaint
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: main
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 2. SUBMODULES
      # ============================================================
      - name: Initialize submodules
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INITIALIZING SUBMODULES"
          Write-Host "=========================================="

          git submodule sync --recursive

          if ($LASTEXITCODE -ne 0) {
              throw "git submodule sync failed."
          }

          git submodule update --init --recursive

          if ($LASTEXITCODE -ne 0) {
              throw "git submodule update failed."
          }

          Write-Host ""
          git submodule status --recursive

      # ============================================================
      # 3. VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify Visual Studio and Clang
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING TOOLCHAIN"
          Write-Host "=========================================="

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
              throw "vswhere.exe was not found."
          }

          $vsInstall = & $vswhere `
              -latest `
              -products "*" `
              -property installationPath

          if (-not $vsInstall) {
              throw "Visual Studio installation was not found."
          }

          Write-Host "Visual Studio:"
          Write-Host $vsInstall

          $vcvars = & $vswhere `
              -latest `
              -products "*" `
              -find "VC\Auxiliary\Build\vcvars64.bat"

          if (-not $vcvars) {
              throw "vcvars64.bat was not found."
          }

          Write-Host ""
          Write-Host "vcvars64:"
          Write-Host $vcvars

          $clang = & $vswhere `
              -latest `
              -products "*" `
              -find "VC\Tools\Llvm\x64\bin\clang-cl.exe"

          if (-not $clang) {
              throw "clang-cl.exe was not found."
          }

          Write-Host ""
          Write-Host "clang-cl:"
          Write-Host $clang

          & $clang --version

      # ============================================================
      # 4. VERIFY SOURCE TREE
      # ============================================================
      - name: Verify ArmorPaint source tree
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING SOURCE TREE"
          Write-Host "=========================================="

          $required = @(
              "base\make.bat",
              "base\tools\make.js",
              "base\tools\bin\windows_x64\amake.exe",
              "paint"
          )

          foreach ($item in $required) {

              if (-not (Test-Path $item)) {
                  throw "Required path not found: $item"
              }

              Write-Host "OK: $item"
          }

      # ============================================================
      # 5. CLEAN OLD BUILD
      # ============================================================
      - name: Clean previous build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CLEANING BUILD DIRECTORY"
          Write-Host "=========================================="

          $build = Join-Path $env:GITHUB_WORKSPACE "paint\build"

          if (Test-Path $build) {
              Remove-Item $build -Recurse -Force
          }

          Write-Host "Build directory cleaned."

      # ============================================================
      # 6. GENERATE + BUILD
      #
      # IMPORTANTE:
      # Não usamos direct3d11.
      #
      # O ArmorPaint atual escolhe Direct3D12 por padrão no Windows.
      #
      # --compile faz o próprio make.js chamar o MSBuild.
      # ============================================================
      - name: Build ArmorPaint Release
        shell: cmd
        working-directory: paint
        run: |
          echo ==========================================
          echo BUILDING ARMORPAINT
          echo ==========================================

          ..\base\make.bat --target windows --graphics direct3d12 --compile

          if errorlevel 1 (
            echo.
            echo ARMORPAINT BUILD FAILED
            exit /b 1
          )

      # ============================================================
      # 7. VERIFY EXECUTABLE
      # ============================================================
      - name: Verify executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING EXECUTABLE"
          Write-Host "=========================================="

          $out = Join-Path `
              $env:GITHUB_WORKSPACE `
              "paint\build\out"

          $exe = Join-Path $out "ArmorPaint.exe"

          if (-not (Test-Path $out)) {
              throw "paint\build\out was not generated."
          }

          if (-not (Test-Path $exe)) {
              throw "ArmorPaint.exe was not generated."
          }

          $file = Get-Item $exe

          Write-Host ""
          Write-Host "Executable:"
          Write-Host $file.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($file.Length) bytes"

          Write-Host ""
          Write-Host "Output contents:"
          Get-ChildItem `
              $out `
              -Recurse `
              -File |
              Select-Object FullName, Length

      # ============================================================
      # 8. BASIC EXECUTABLE TEST
      #
      # NÃO inicializa o renderer.
      #
      # --help serve apenas para confirmar que o executável
      # consegue carregar e responder.
      # ============================================================
      - name: Test executable loading
        shell: powershell
        working-directory: paint\build\out
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "TESTING EXECUTABLE LOADING"
          Write-Host "=========================================="

          $exe = Join-Path (Get-Location) "ArmorPaint.exe"

          $process = Start-Process `
              -FilePath $exe `
              -ArgumentList "--help" `
              -WorkingDirectory (Get-Location) `
              -PassThru `
              -Wait

          Write-Host ""
          Write-Host "Exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
              throw "ArmorPaint.exe failed the basic loading test."
          }

          Write-Host ""
          Write-Host "Executable loading test passed."

      # ============================================================
      # 9. CREATE PORTABLE PACKAGE
      #
      # Copiamos TODO o conteúdo de build/out.
      # Nada é selecionado manualmente.
      # ============================================================
      - name: Create portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING PORTABLE PACKAGE"
          Write-Host "=========================================="

          $source = Join-Path `
              $env:GITHUB_WORKSPACE `
              "paint\build\out"

          $artifact = Join-Path `
              $env:GITHUB_WORKSPACE `
              "artifact"

          if (-not (Test-Path $source)) {
              throw "Build output not found: $source"
          }

          if (Test-Path $artifact) {
              Remove-Item $artifact -Recurse -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $artifact `
              -Force |
              Out-Null

          Copy-Item `
              -Path (Join-Path $source "*") `
              -Destination $artifact `
              -Recurse `
              -Force

          $finalExe = Join-Path $artifact "ArmorPaint.exe"

          if (-not (Test-Path $finalExe)) {
              throw "ArmorPaint.exe missing from final package."
          }

          Write-Host ""
          Write-Host "Package created successfully."

          Write-Host ""
          Write-Host "Final package contents:"

          Get-ChildItem `
              $artifact `
              -Recurse `
              -File |
              Select-Object FullName, Length

      # ============================================================
      # 10. ZIP
      # ============================================================
      - name: Create ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $artifact = Join-Path `
              $env:GITHUB_WORKSPACE `
              "artifact"

          $zip = Join-Path `
              $env:GITHUB_WORKSPACE `
              "ArmorPaint-Windows-x64.zip"

          if (Test-Path $zip) {
              Remove-Item $zip -Force
          }

          Compress-Archive `
              -Path (Join-Path $artifact "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "ZIP creation failed."
          }

          Write-Host "ZIP created:"
          Write-Host $zip

      # ============================================================
      # 11. UPLOAD DIRECTORY
      # ============================================================
      - name: Upload ArmorPaint package
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: artifact
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 12. UPLOAD ZIP
      # ============================================================
      - name: Upload ArmorPaint ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-ZIP
          path: ArmorPaint-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
