name: Build ArmorPaint for Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout ArmorPaint
        uses: actions/checkout@v5
        with:
          repository: armory3d/armorpaint
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check environment
        shell: pwsh
        run: |
          msbuild -version
          clang-cl --version
          git --version
          node --version

      - name: Verify ArmorPaint tools
        shell: pwsh
        working-directory: paint
        run: |
          $amake = "..\base\tools\bin\windows_x64\amake.exe"

          if (!(Test-Path $amake)) {
            throw "amake.exe not found: $amake"
          }

          Write-Host "amake found:"
          Get-Item $amake

      - name: Generate Visual Studio project
        shell: cmd
        working-directory: paint
        run: |
          call ..\base\make.bat
          if errorlevel 1 exit /b %errorlevel%

      - name: Find generated project
        shell: pwsh
        working-directory: paint
        run: |
          $projects = Get-ChildItem . -Recurse -File |
            Where-Object {
              $_.Extension -in @(".sln", ".slnx", ".vcxproj") -and
              $_.Name -match "ArmorPaint"
            }

          if (!$projects) {
            Write-Host "=== ALL GENERATED FILES ==="
            Get-ChildItem build -Recurse -Force -ErrorAction SilentlyContinue |
              Select-Object FullName

            throw "No ArmorPaint Visual Studio project found."
          }

          $project = $projects | Select-Object -First 1

          Write-Host "Using:"
          Write-Host $project.FullName

          "ARMORPAINT_PROJECT=$($project.FullName)" |
            Out-File $env:GITHUB_ENV -Append

      - name: Build Release x64
        shell: pwsh
        working-directory: paint
        run: |
          msbuild "$env:ARMORPAINT_PROJECT" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

      # ------------------------------------------------------------
      # IMPORTANT:
      # Do NOT construct a package by guessing which files are needed.
      # Find the actual executable and preserve its complete output folder.
      # ------------------------------------------------------------

      - name: Find executable and output directory
        shell: pwsh
        working-directory: paint
        run: |
          $exe = Get-ChildItem . -Recurse -Filter "ArmorPaint.exe" -File |
            Where-Object {
              $_.FullName -match "\\build\\"
            } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (!$exe) {
            Write-Host "=== BUILD FILES ==="
            Get-ChildItem build -Recurse -Force |
              Select-Object FullName, Length

            throw "ArmorPaint.exe not found."
          }

          Write-Host "ArmorPaint.exe:"
          Write-Host $exe.FullName

          Write-Host ""
          Write-Host "Executable directory:"
          Write-Host $exe.Directory.FullName

          "ARMORPAINT_EXE=$($exe.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          "ARMORPAINT_OUTPUT=$($exe.Directory.FullName)" |
            Out-File $env:GITHUB_ENV -Append

      - name: Inspect complete runtime directory
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "COMPLETE ARMORPAINT OUTPUT"
          Write-Host "======================================"

          Get-ChildItem "$env:ARMORPAINT_OUTPUT" -Recurse -Force |
            Select-Object FullName, Length

      # ------------------------------------------------------------
      # Test the executable BEFORE packaging.
      # If it exits here, the problem is the build/runtime itself.
      # ------------------------------------------------------------

      - name: Test ArmorPaint executable
        shell: pwsh
        run: |
          Write-Host "Starting ArmorPaint..."

          $process = Start-Process `
            -FilePath $env:ARMORPAINT_EXE `
            -WorkingDirectory $env:ARMORPAINT_OUTPUT `
            -PassThru `
            -Wait

          Write-Host "Exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            Write-Host "ArmorPaint exited with code $($process.ExitCode)."
          }

      # ------------------------------------------------------------
      # Copy EVERYTHING from the real output directory.
      # ------------------------------------------------------------

      - name: Package complete runtime
        shell: pwsh
        run: |
          $package = Join-Path `
            $env:GITHUB_WORKSPACE `
            "ArmorPaint-Windows-x64"

          if (Test-Path $package) {
            Remove-Item $package -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $package | Out-Null

          Write-Host "Copying complete output directory..."

          Copy-Item `
            "$env:ARMORPAINT_OUTPUT\*" `
            $package `
            -Recurse `
            -Force

          $info = @"
          ArmorPaint Windows x64
          Source: https://github.com/armory3d/armorpaint
          Branch: main
          Configuration: Release
          Platform: x64

          The package contains the complete generated runtime directory.
          "@

          Set-Content `
            (Join-Path $package "BUILD-INFO.txt") `
            $info

          Write-Host "======================================"
          Write-Host "PACKAGE CONTENTS"
          Write-Host "======================================"

          Get-ChildItem $package -Recurse -Force |
            Select-Object FullName, Length

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\ArmorPaint-Windows-x64.zip" `
            -Force

      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: ArmorPaint-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
