name: Build ArmorPaint 0.9 Windows x64 D3D11

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_TERMINAL_PROMPT: "0"
  GCM_INTERACTIVE: "Never"

jobs:
  build:
    name: ArmorPaint 0.9 - Windows x64 - Direct3D11
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. ARMORPAINT 0.9 / 23.08
      #
      # NÃO usamos submodules: recursive.
      # A árvore antiga referencia repositórios históricos que já
      # não estão disponíveis nos URLs originais.
      # ============================================================
      - name: Checkout ArmorPaint 23.08
        uses: actions/checkout@v5
        with:
          repository: armory3d/armorpaint
          ref: 23.08
          fetch-depth: 1
          submodules: false

      # ============================================================
      # 2. NODE.JS
      # ============================================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      # ============================================================
      # 3. MSBUILD
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 4. MSVC
      # ============================================================
      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 5. 7-ZIP
      # ============================================================
      - name: Ensure 7-Zip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING 7-ZIP"
          Write-Host "=========================================="

          $paths = @(
              "${env:ProgramFiles}\7-Zip\7z.exe",
              "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          )

          $sevenZip = $null

          foreach ($path in $paths) {
              if (Test-Path $path) {
                  $sevenZip = $path
                  break
              }
          }

          if (-not $sevenZip) {
              $cmd = Get-Command 7z.exe -ErrorAction SilentlyContinue

              if ($cmd) {
                  $sevenZip = $cmd.Source
              }
          }

          if (-not $sevenZip) {
              Write-Host "7-Zip not found. Installing..."
              choco install 7zip -y --no-progress

              foreach ($path in $paths) {
                  if (Test-Path $path) {
                      $sevenZip = $path
                      break
                  }
              }
          }

          if (-not $sevenZip) {
              throw "7-Zip could not be located."
          }

          Write-Host "Using:"
          Write-Host $sevenZip

          "SEVEN_ZIP=$sevenZip" >> $env:GITHUB_ENV

      # ============================================================
      # 6. VERIFICAR AMBIENTE
      # ============================================================
      - name: Verify build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILD ENVIRONMENT"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Node:"
          node --version

          Write-Host ""
          Write-Host "npm:"
          npm --version

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "MSBuild:"
          msbuild.exe -version

          Write-Host ""
          Write-Host "ArmorPaint commit:"
          git rev-parse HEAD

          Write-Host ""
          Write-Host "ArmorPaint tag:"
          git describe --tags --always

      # ============================================================
      # 7. OBTER SHA DO ARMORCORE
      # ============================================================
      - name: Determine ArmorCore revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ARMORCORE REVISION"
          Write-Host "=========================================="

          $entry = git ls-tree HEAD armorcore

          if (-not $entry) {
              throw "ArmorCore gitlink not found in ArmorPaint 23.08."
          }

          $sha = $entry.Split("`t")[0].Split(" ")[2]

          if (-not $sha) {
              throw "Could not determine ArmorCore SHA."
          }

          Write-Host ""
          Write-Host "ArmorCore SHA:"
          Write-Host $sha

          "ARMORCORE_SHA=$sha" >> $env:GITHUB_ENV

      # ============================================================
      # 8. CHECKOUT ARMORCORE EXATO
      # ============================================================
      - name: Checkout exact ArmorCore
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING OUT ARMORCORE"
          Write-Host "=========================================="

          $path = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          git clone `
              --filter=blob:none `
              --no-checkout `
              https://github.com/armory3d/armorcore.git `
              $path

          if ($LASTEXITCODE -ne 0) {
              throw "ArmorCore clone failed."
          }

          Push-Location $path

          try {
              git checkout $env:ARMORCORE_SHA

              if ($LASTEXITCODE -ne 0) {
                  throw "ArmorCore checkout failed."
              }
          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "ArmorCore revision:"
          git -C $path rev-parse HEAD

      # ============================================================
      # 9. OBTER SHA DO KINC
      # ============================================================
      - name: Determine exact Kinc revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "KINC REVISION"
          Write-Host "=========================================="

          $armorcore = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $entry = git -C $armorcore ls-tree HEAD Kinc

          if (-not $entry) {
              throw "Kinc gitlink not found in ArmorCore."
          }

          $sha = $entry.Split("`t")[0].Split(" ")[2]

          if (-not $sha) {
              throw "Could not determine Kinc SHA."
          }

          Write-Host ""
          Write-Host "Kinc SHA:"
          Write-Host $sha

          "KINC_SHA=$sha" >> $env:GITHUB_ENV

      # ============================================================
      # 10. BAIXAR KINC HISTÓRICO
      #
      # O commit histórico está atualmente no repositório
      # Kode/Kore.
      #
      # Usamos o SHA EXATO em vez de main.
      # ============================================================
      - name: Download exact historical Kinc
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DOWNLOADING HISTORICAL KINC"
          Write-Host "=========================================="

          $destination = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc"

          $zip = Join-Path `
              $env:RUNNER_TEMP `
              "Kinc.zip"

          $extract = Join-Path `
              $env:RUNNER_TEMP `
              "KincExtract"

          $url = "https://github.com/Kode/Kore/archive/$env:KINC_SHA.zip"

          Write-Host ""
          Write-Host "Kinc commit:"
          Write-Host $env:KINC_SHA

          Write-Host ""
          Write-Host "Download:"
          Write-Host $url

          if (Test-Path $destination) {
              Remove-Item `
                  $destination `
                  -Recurse `
                  -Force
          }

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          if (Test-Path $extract) {
              Remove-Item `
                  $extract `
                  -Recurse `
                  -Force
          }

          Invoke-WebRequest `
              -Uri $url `
              -OutFile $zip `
              -UseBasicParsing

          if (-not (Test-Path $zip)) {
              throw "Kinc archive was not downloaded."
          }

          New-Item `
              -ItemType Directory `
              -Path $extract `
              -Force |
              Out-Null

          Expand-Archive `
              -Path $zip `
              -DestinationPath $extract `
              -Force

          $root = Get-ChildItem `
              $extract `
              -Directory |
              Select-Object -First 1

          if (-not $root) {
              throw "Kinc archive extraction failed."
          }

          New-Item `
              -ItemType Directory `
              -Path $destination `
              -Force |
              Out-Null

          Copy-Item `
              -Path (Join-Path $root.FullName "*") `
              -Destination $destination `
              -Recurse `
              -Force

          Write-Host ""
          Write-Host "Kinc installed at:"
          Write-Host $destination

      # ============================================================
      # 11. OBTER SHA DO KINC TOOLS WINDOWS
      # ============================================================
      - name: Determine Kinc Windows tools revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "KINC WINDOWS TOOLS REVISION"
          Write-Host "=========================================="

          $kinc = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc"

          $entry = git -C $kinc ls-tree HEAD Tools/windows_x64

          if (-not $entry) {
              throw "Kinc Tools/windows_x64 gitlink was not found."
          }

          $sha = $entry.Split("`t")[0].Split(" ")[2]

          if (-not $sha) {
              throw "Could not determine KincTools Windows SHA."
          }

          Write-Host ""
          Write-Host "KincTools Windows SHA:"
          Write-Host $sha

          "KINC_TOOLS_SHA=$sha" >> $env:GITHUB_ENV

      # ============================================================
      # 12. RESOLVER REPOSITÓRIO KINC TOOLS
      #
      # Usamos a API para obter a branch atual.
      # Não assumimos que seja "main".
      #
      # A existência do repositório é verificada antes de baixar.
      # ============================================================
      - name: Resolve KincTools repository
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "RESOLVING KINC TOOLS REPOSITORY"
          Write-Host "=========================================="

          $repoApi = "https://api.github.com/repos/armory3d/KincTools_windows_x64"

          $headers = @{
              "Accept" = "application/vnd.github+json"
              "User-Agent" = "ArmorPaint-Build"
          }

          try {
              $repo = Invoke-RestMethod `
                  -Uri $repoApi `
                  -Headers $headers `
                  -Method Get
          }
          catch {
              throw "KincTools_windows_x64 repository is not accessible: $($_.Exception.Message)"
          }

          if (-not $repo.default_branch) {
              throw "KincTools repository has no default branch."
          }

          Write-Host ""
          Write-Host "Repository:"
          Write-Host $repo.full_name

          Write-Host ""
          Write-Host "Default branch:"
          Write-Host $repo.default_branch

          "KINC_TOOLS_DEFAULT_BRANCH=$($repo.default_branch)" >> $env:GITHUB_ENV

      # ============================================================
      # 13. VERIFICAR SE O SHA EXATO EXISTE
      # ============================================================
      - name: Verify KincTools exact revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING KINC TOOLS COMMIT"
          Write-Host "=========================================="

          $url = "https://api.github.com/repos/armory3d/KincTools_windows_x64/commits/$env:KINC_TOOLS_SHA"

          $headers = @{
              "Accept" = "application/vnd.github+json"
              "User-Agent" = "ArmorPaint-Build"
          }

          try {
              $commit = Invoke-RestMethod `
                  -Uri $url `
                  -Headers $headers `
                  -Method Get
          }
          catch {
              throw "The exact KincTools commit $env:KINC_TOOLS_SHA is not accessible."
          }

          Write-Host ""
          Write-Host "Requested:"
          Write-Host $env:KINC_TOOLS_SHA

          Write-Host ""
          Write-Host "Resolved:"
          Write-Host $commit.sha

          if ($commit.sha -ne $env:KINC_TOOLS_SHA) {
              throw "KincTools SHA mismatch."
          }

      # ============================================================
      # 14. BAIXAR KINC TOOLS NO COMMIT EXATO
      #
      # ZIP via GitHub API.
      # Nenhum git clone.
      # ============================================================
      - name: Download exact KincTools Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DOWNLOADING EXACT KINC TOOLS"
          Write-Host "=========================================="

          $destination = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc\Tools\windows_x64"

          $zip = Join-Path `
              $env:RUNNER_TEMP `
              "KincTools.zip"

          $extract = Join-Path `
              $env:RUNNER_TEMP `
              "KincToolsExtract"

          $url = "https://github.com/armory3d/KincTools_windows_x64/archive/$env:KINC_TOOLS_SHA.zip"

          Write-Host ""
          Write-Host "Commit:"
          Write-Host $env:KINC_TOOLS_SHA

          Write-Host ""
          Write-Host "URL:"
          Write-Host $url

          if (Test-Path $destination) {
              Remove-Item `
                  $destination `
                  -Recurse `
                  -Force
          }

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          if (Test-Path $extract) {
              Remove-Item `
                  $extract `
                  -Recurse `
                  -Force
          }

          Invoke-WebRequest `
              -Uri $url `
              -OutFile $zip `
              -UseBasicParsing

          if (-not (Test-Path $zip)) {
              throw "KincTools ZIP was not downloaded."
          }

          New-Item `
              -ItemType Directory `
              -Path $extract `
              -Force |
              Out-Null

          Expand-Archive `
              -Path $zip `
              -DestinationPath $extract `
              -Force

          $root = Get-ChildItem `
              $extract `
              -Directory |
              Select-Object -First 1

          if (-not $root) {
              throw "KincTools archive extraction failed."
          }

          New-Item `
              -ItemType Directory `
              -Path $destination `
              -Force |
              Out-Null

          Copy-Item `
              -Path (Join-Path $root.FullName "*") `
              -Destination $destination `
              -Recurse `
              -Force

          Write-Host ""
          Write-Host "KincTools installed:"
          Write-Host $destination

      # ============================================================
      # 15. VERIFICAR KINC TOOLS
      # ============================================================
      - name: Verify KincTools binaries
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING KINC TOOLS"
          Write-Host "=========================================="

          $tools = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc\Tools\windows_x64"

          if (-not (Test-Path $tools)) {
              throw "KincTools directory does not exist."
          }

          $files = Get-ChildItem `
              $tools `
              -Recurse `
              -File

          if (-not $files) {
              throw "KincTools directory is empty."
          }

          Write-Host ""
          Write-Host "KincTools files:"

          foreach ($file in $files) {
              Write-Host "$($file.FullName) [$($file.Length) bytes]"
          }

          $kmake = Get-ChildItem `
              $tools `
              -Filter "kmake.exe" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

          if (-not $kmake) {
              throw "kmake.exe was not found in KincTools."
          }

          Write-Host ""
          Write-Host "kmake.exe:"
          Write-Host $kmake.FullName

          $kraffiti = Get-ChildItem `
              $tools `
              -Filter "kraffiti.exe" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

          if ($kraffiti) {
              Write-Host ""
              Write-Host "kraffiti.exe:"
              Write-Host $kraffiti.FullName
          }

          $krafix = Get-ChildItem `
              $tools `
              -Filter "krafix.exe" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

          if ($krafix) {
              Write-Host ""
              Write-Host "krafix.exe:"
              Write-Host $krafix.FullName
          }

      # ============================================================
      # 16. OBTER SHA DO V8
      # ============================================================
      - name: Determine exact V8 revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "V8 REVISION"
          Write-Host "=========================================="

          $armorcore = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $entry = git -C $armorcore ls-tree HEAD v8

          if (-not $entry) {
              throw "V8 gitlink not found in ArmorCore."
          }

          $sha = $entry.Split("`t")[0].Split(" ")[2]

          if (-not $sha) {
              throw "Could not determine V8 SHA."
          }

          Write-Host ""
          Write-Host "V8 SHA:"
          Write-Host $sha

          "V8_SHA=$sha" >> $env:GITHUB_ENV

      # ============================================================
      # 17. DOWNLOAD V8 EXACTO
      # ============================================================
      - name: Download exact V8
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DOWNLOADING V8"
          Write-Host "=========================================="

          $destination = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8"

          $zip = Join-Path `
              $env:RUNNER_TEMP `
              "v8.zip"

          $extract = Join-Path `
              $env:RUNNER_TEMP `
              "v8Extract"

          $url = "https://github.com/armory3d/v8_bin/archive/$env:V8_SHA.zip"

          Write-Host ""
          Write-Host "V8 SHA:"
          Write-Host $env:V8_SHA

          Write-Host ""
          Write-Host "URL:"
          Write-Host $url

          if (Test-Path $destination) {
              Remove-Item `
                  $destination `
                  -Recurse `
                  -Force
          }

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          if (Test-Path $extract) {
              Remove-Item `
                  $extract `
                  -Recurse `
                  -Force
          }

          Invoke-WebRequest `
              -Uri $url `
              -OutFile $zip `
              -UseBasicParsing

          if (-not (Test-Path $zip)) {
              throw "V8 archive was not downloaded."
          }

          New-Item `
              -ItemType Directory `
              -Path $extract `
              -Force |
              Out-Null

          Expand-Archive `
              -Path $zip `
              -DestinationPath $extract `
              -Force

          $root = Get-ChildItem `
              $extract `
              -Directory |
              Select-Object -First 1

          if (-not $root) {
              throw "V8 archive extraction failed."
          }

          New-Item `
              -ItemType Directory `
              -Path $destination `
              -Force |
              Out-Null

          Copy-Item `
              -Path (Join-Path $root.FullName "*") `
              -Destination $destination `
              -Recurse `
              -Force

          Write-Host ""
          Write-Host "V8 installed:"
          Write-Host $destination

      # ============================================================
      # 18. VERIFICAR V8 MONOLITH
      # ============================================================
      - name: Verify V8 monolith
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING V8 MONOLITH"
          Write-Host "=========================================="

          $releaseDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release"

          $archive = Join-Path `
              $releaseDir `
              "v8_monolith.7z"

          if (-not (Test-Path $archive)) {

              Write-Host ""
              Write-Host "Available files under V8 release directory:"

              if (Test-Path $releaseDir) {
                  Get-ChildItem `
                      $releaseDir `
                      -Recurse |
                      Select-Object FullName, Length
              }

              throw "v8_monolith.7z was not found."
          }

          Write-Host ""
          Write-Host "Found:"
          Write-Host $archive

      # ============================================================
      # 19. EXTRAIR V8 MONOLITH
      # ============================================================
      - name: Extract V8 monolith
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "EXTRACTING V8 MONOLITH"
          Write-Host "=========================================="

          $releaseDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release"

          $archive = Join-Path `
              $releaseDir `
              "v8_monolith.7z"

          $lib = Join-Path `
              $releaseDir `
              "v8_monolith.lib"

          if (-not (Test-Path $lib)) {

              & $env:SEVEN_ZIP `
                  x `
                  $archive `
                  "-o$releaseDir" `
                  "-y" `
                  "-aoa"

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to extract V8 monolith."
              }
          }

          if (-not (Test-Path $lib)) {
              throw "v8_monolith.lib was not extracted."
          }

          $info = Get-Item $lib

          Write-Host ""
          Write-Host "Library:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 20. ONNX
      #
      # A configuração desta geração não precisa de ONNX para o build
      # normal do ArmorPaint.
      #
      # Não inicializamos o submodule removido/antigo.
      # ============================================================
      - name: Verify ONNX is not required
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "ONNX CHECK"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Skipping deprecated ONNX submodule."

      # ============================================================
      # 21. PATCH WINDOW HANDLING
      # ============================================================
      - name: Apply window handling patch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "APPLYING WINDOW HANDLING PATCH"
          Write-Host "=========================================="

          $armorcore = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $patch = Join-Path `
              $armorcore `
              "patch\window_handling.diff"

          if (-not (Test-Path $patch)) {
              throw "window_handling.diff was not found."
          }

          Push-Location $armorcore

          try {

              git apply `
                  --check `
                  "patch/window_handling.diff" `
                  --directory=Kinc

              if ($LASTEXITCODE -ne 0) {
                  throw "window_handling.diff does not apply to the exact Kinc revision."
              }

              git apply `
                  "patch/window_handling.diff" `
                  --directory=Kinc

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to apply window_handling.diff."
              }

          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "Patch applied successfully."

      # ============================================================
      # 22. VERIFICAÇÃO COMPLETA ANTES DO BUILD
      # ============================================================
      - name: Verify complete build tree
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING COMPLETE BUILD TREE"
          Write-Host "=========================================="

          $required = @(
              "armorcore\make",
              "armorcore\Kinc",
              "armorcore\Kinc\make",
              "armorcore\Kinc\Tools\windows_x64",
              "armorcore\v8",
              "armorcore\v8\libraries\win32\release\v8_monolith.lib",
              "armorcore\patch\window_handling.diff",
              "paint"
          )

          foreach ($path in $required) {

              if (-not (Test-Path $path)) {
                  throw "Required path missing: $path"
              }

              Write-Host "OK: $path"
          }

      # ============================================================
      # 23. GERAR ARMORPAINT / KROM D3D11
      #
      # Este é o comando histórico usado pela geração 0.9.
      # ============================================================
      - name: Generate ArmorPaint D3D11 project
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          echo ==========================================
          echo GENERATING ARMORPAINT D3D11 PROJECT
          echo ==========================================

          armorcore\Kinc\make --from armorcore -g direct3d11

          if errorlevel 1 (
              echo.
              echo ==========================================
              echo KINC MAKE FAILED
              echo ==========================================
              exit /b 1
          )

          echo.
          echo Kinc make completed successfully.

      # ============================================================
      # 24. VERIFICAR SOLUTION
      # ============================================================
      - name: Verify generated solution
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING GENERATED SOLUTION"
          Write-Host "=========================================="

          $solution = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\ArmorPaint.sln"

          if (-not (Test-Path $solution)) {

              Write-Host ""
              Write-Host "Searching for .sln files..."

              Get-ChildItem `
                  $env:GITHUB_WORKSPACE `
                  -Include "*.sln","*.slnx" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object FullName

              throw "build\ArmorPaint.sln was not generated."
          }

          Write-Host ""
          Write-Host "Solution:"
          Write-Host $solution

          "ARMORPAINT_SOLUTION=$solution" >> $env:GITHUB_ENV

      # ============================================================
      # 25. COMPILAR RELEASE X64
      # ============================================================
      - name: Build ArmorPaint Release x64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILDING ARMORPAINT RELEASE X64"
          Write-Host "=========================================="

          & msbuild.exe `
              $env:ARMORPAINT_SOLUTION `
              /m `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE."
          }

          Write-Host ""
          Write-Host "MSBuild completed successfully."

      # ============================================================
      # 26. LOCALIZAR EXE
      # ============================================================
      - name: Verify compiled executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING ARMORPAINT.EXE"
          Write-Host "=========================================="

          $expected = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\x64\Release\ArmorPaint.exe"

          if (Test-Path $expected) {

              $exe = Get-Item $expected

          }
          else {

              Write-Host ""
              Write-Host "Expected executable not found."
              Write-Host ""
              Write-Host "Searching..."

              $matches = Get-ChildItem `
                  (Join-Path $env:GITHUB_WORKSPACE "build") `
                  -Filter "ArmorPaint.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue

              if (-not $matches) {
                  throw "ArmorPaint.exe was not generated."
              }

              $exe = $matches |
                  Sort-Object FullName |
                  Select-Object -Last 1
          }

          Write-Host ""
          Write-Host "Executable:"
          Write-Host $exe.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($exe.Length) bytes"

          if ($exe.Length -lt 1000000) {
              throw "ArmorPaint.exe is suspiciously small."
          }

          "ARMORPAINT_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 27. MONTAR build/krom
      #
      # O runtime gerado pela ferramenta fica em build/krom.
      # Copiamos os arquivos Release para lá.
      # ============================================================
      - name: Assemble portable build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ASSEMBLING PORTABLE BUILD"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $release = Split-Path `
              $env:ARMORPAINT_EXE `
              -Parent

          if (-not (Test-Path $krom)) {
              throw "build\krom does not exist."
          }

          Write-Host ""
          Write-Host "Runtime:"
          Write-Host $krom

          Write-Host ""
          Write-Host "Release:"
          Write-Host $release

          Copy-Item `
              -Path (Join-Path $release "*") `
              -Destination $krom `
              -Recurse `
              -Force

          $finalExe = Join-Path `
              $krom `
              "ArmorPaint.exe"

          if (-not (Test-Path $finalExe)) {
              throw "ArmorPaint.exe is missing from build\krom."
          }

          Write-Host ""
          Write-Host "Final executable:"
          Write-Host $finalExe

      # ============================================================
      # 28. VERIFICAÇÃO FINAL
      # ============================================================
      - name: Verify final package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "FINAL PACKAGE"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $exe = Join-Path `
              $krom `
              "ArmorPaint.exe"

          if (-not (Test-Path $exe)) {
              throw "Final ArmorPaint.exe not found."
          }

          $files = Get-ChildItem `
              $krom `
              -Recurse `
              -File

          if (-not $files) {
              throw "Final package is empty."
          }

          Write-Host ""
          Write-Host "Executable:"
          Write-Host $exe

          Write-Host ""
          Write-Host "Executable size:"
          Write-Host "$((Get-Item $exe).Length) bytes"

          Write-Host ""
          Write-Host "File count:"
          Write-Host $files.Count

          Write-Host ""
          Write-Host "Package contents:"

          foreach ($file in $files) {
              $relative = $file.FullName.Substring($krom.Length).TrimStart("\")
              Write-Host "$relative [$($file.Length) bytes]"
          }

      # ============================================================
      # 29. ZIP
      # ============================================================
      - name: Create ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING ZIP"
          Write-Host "=========================================="

          $source = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $zip = Join-Path `
              $env:GITHUB_WORKSPACE `
              "ArmorPaint-0.9-23.08-Windows-x64-D3D11.zip"

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          Compress-Archive `
              -Path (Join-Path $source "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "ZIP creation failed."
          }

          $info = Get-Item $zip

          Write-Host ""
          Write-Host "ZIP:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "ZIP size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 30. UPLOAD DO PACOTE
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11
          path: build/krom
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 31. UPLOAD DO ZIP
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11 ZIP
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11-ZIP
          path: ArmorPaint-0.9-23.08-Windows-x64-D3D11.zip
          if-no-files-found: error
          compression-level: 0
