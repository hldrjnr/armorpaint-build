name: Build ArmorPaint 0.9 Windows x64 D3D11

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_TERMINAL_PROMPT: "0"
  GCM_INTERACTIVE: "Never"

jobs:
  build:
    name: ArmorPaint 0.9 / 23.08 / Windows x64 / D3D11
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. CHECKOUT ARMORPAINT 0.9
      #
      # A release 0.9-armorpaint corresponde à tag 23.08.
      # Não usamos submodules: recursive porque os URLs históricos
      # de vários submódulos já não funcionam.
      # ============================================================
      - name: Checkout ArmorPaint 23.08
        uses: actions/checkout@v5
        with:
          repository: armory3d/armorpaint
          ref: 23.08
          fetch-depth: 1
          submodules: false

      # ============================================================
      # 2. NODE.JS
      # ============================================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      # ============================================================
      # 3. MSBUILD
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 4. MSVC X64
      # ============================================================
      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 5. VERIFICAR FERRAMENTAS
      # ============================================================
      - name: Verify build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILD ENVIRONMENT"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Node:"
          node --version

          Write-Host ""
          Write-Host "npm:"
          npm --version

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "MSBuild:"
          msbuild.exe -version

          Write-Host ""
          Write-Host "ArmorPaint commit:"
          git rev-parse HEAD

          Write-Host ""
          Write-Host "ArmorPaint tag:"
          git describe --tags --always

      # ============================================================
      # 6. 7-ZIP
      # ============================================================
      - name: Ensure 7-Zip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING 7-ZIP"
          Write-Host "=========================================="

          $paths = @(
              "${env:ProgramFiles}\7-Zip\7z.exe",
              "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          )

          $sevenZip = $null

          foreach ($path in $paths) {
              if (Test-Path $path) {
                  $sevenZip = $path
                  break
              }
          }

          if (-not $sevenZip) {
              $command = Get-Command 7z.exe -ErrorAction SilentlyContinue
              if ($command) {
                  $sevenZip = $command.Source
              }
          }

          if (-not $sevenZip) {
              Write-Host "7-Zip not found. Installing..."
              choco install 7zip -y --no-progress

              foreach ($path in $paths) {
                  if (Test-Path $path) {
                      $sevenZip = $path
                      break
                  }
              }
          }

          if (-not $sevenZip) {
              throw "7-Zip could not be located."
          }

          Write-Host ""
          Write-Host "7-Zip:"
          Write-Host $sevenZip

          "SEVEN_ZIP=$sevenZip" >> $env:GITHUB_ENV

      # ============================================================
      # 7. OBTER SHA EXATO DO ARMORCORE
      # ============================================================
      - name: Determine ArmorCore revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DETERMINING ARMORCORE REVISION"
          Write-Host "=========================================="

          $entry = git ls-tree HEAD armorcore

          if (-not $entry) {
              throw "ArmorCore gitlink was not found."
          }

          $armorcoreSha = $entry.Split("`t")[0].Split(" ")[2]

          if (-not $armorcoreSha) {
              throw "Could not determine ArmorCore SHA."
          }

          Write-Host ""
          Write-Host "ArmorCore SHA:"
          Write-Host $armorcoreSha

          "ARMORCORE_SHA=$armorcoreSha" >> $env:GITHUB_ENV

      # ============================================================
      # 8. DOWNLOAD ARMORCORE NO COMMIT EXATO
      #
      # Mantemos o ArmorCore como repositório Git para podermos
      # consultar os gitlinks históricos antes de substituir apenas
      # as dependências que foram removidas.
      # ============================================================
      - name: Checkout exact ArmorCore
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING OUT ARMORCORE"
          Write-Host "=========================================="

          $armorcore = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          if (Test-Path $armorcore) {
              Remove-Item `
                  $armorcore `
                  -Recurse `
                  -Force
          }

          git clone `
              --filter=blob:none `
              --no-checkout `
              https://github.com/armory3d/armorcore.git `
              $armorcore

          if ($LASTEXITCODE -ne 0) {
              throw "ArmorCore clone failed."
          }

          Push-Location $armorcore

          try {
              git checkout $env:ARMORCORE_SHA

              if ($LASTEXITCODE -ne 0) {
                  throw "ArmorCore checkout failed."
              }
          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "ArmorCore:"
          git -C $armorcore rev-parse HEAD

      # ============================================================
      # 9. VERIFICAR ESTRUTURA REAL DO ARMORCORE
      #
      # IMPORTANTE:
      # NÃO verificamos armorcore\make.
      #
      # A revisão antiga possui:
      #
      #   armorcore\make.js
      #
      # O comando de build é:
      #
      #   armorcore\Kinc\make.bat
      # ============================================================
      - name: Verify historical ArmorCore structure
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING HISTORICAL ARMORCORE"
          Write-Host "=========================================="

          $required = @(
              "armorcore\make.js",
              "armorcore\kfile.js",
              "armorcore\project.js",
              "armorcore\patch\window_handling.diff",
              "paint"
          )

          foreach ($path in $required) {

              if (-not (Test-Path $path)) {
                  throw "Required path missing: $path"
              }

              Write-Host "OK: $path"
          }

      # ============================================================
      # 10. BAIXAR KINC HISTÓRICO
      #
      # O ArmorCore 0.9 referencia o commit:
      #
      # 60e0062139e027a59774155bdb03731beac579e7
      #
      # O histórico desse commit está em Kode/Kore.
      # ============================================================
      - name: Checkout historical Kinc
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING HISTORICAL KINC"
          Write-Host "=========================================="

          $kincSha = "60e0062139e027a59774155bdb03731beac579e7"

          $kinc = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc"

          if (Test-Path $kinc) {
              Remove-Item `
                  $kinc `
                  -Recurse `
                  -Force
          }

          Write-Host ""
          Write-Host "Kinc SHA:"
          Write-Host $kincSha

          git clone `
              --filter=blob:none `
              --no-checkout `
              https://github.com/Kode/Kore.git `
              $kinc

          if ($LASTEXITCODE -ne 0) {
              throw "Historical Kinc clone failed."
          }

          Push-Location $kinc

          try {

              git fetch `
                  origin `
                  $kincSha

              if ($LASTEXITCODE -ne 0) {
                  throw "Could not fetch historical Kinc commit."
              }

              git checkout $kincSha

              if ($LASTEXITCODE -ne 0) {
                  throw "Could not checkout historical Kinc commit."
              }

          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "Kinc revision:"
          git -C $kinc rev-parse HEAD

          if ((git -C $kinc rev-parse HEAD) -ne $kincSha) {
              throw "Kinc revision verification failed."
          }

      # ============================================================
      # 11. VERIFICAR MAKE.BAT DO KINC
      #
      # O Kinc histórico possui make.bat.
      # Ele chama:
      #
      # Tools/windows_x64/kmake.exe
      # ============================================================
      - name: Verify historical Kinc structure
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING HISTORICAL KINC"
          Write-Host "=========================================="

          $required = @(
              "armorcore\Kinc\make.bat",
              "armorcore\Kinc\get_dlc.bat",
              "armorcore\Kinc\.gitmodules"
          )

          foreach ($path in $required) {

              if (-not (Test-Path $path)) {
                  throw "Required Kinc path missing: $path"
              }

              Write-Host "OK: $path"
          }

      # ============================================================
      # 12. INSTALAR KINC WINDOWS TOOLS
      #
      # O repositório histórico original dos tools deixou de estar
      # acessível. Kode/KoreTools_windows_x64 mantém atualmente os
      # binários Windows necessários.
      #
      # NÃO utilizamos git clone.
      # ============================================================
      - name: Download Kinc Windows tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INSTALLING KINC WINDOWS TOOLS"
          Write-Host "=========================================="

          $tools = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc\Tools\windows_x64"

          $archive = Join-Path `
              $env:RUNNER_TEMP `
              "KoreTools_windows_x64.zip"

          $extract = Join-Path `
              $env:RUNNER_TEMP `
              "KoreTools_windows_x64_extract"

          $url = "https://github.com/Kode/KoreTools_windows_x64/archive/refs/heads/main.zip"

          if (Test-Path $tools) {
              Remove-Item `
                  $tools `
                  -Recurse `
                  -Force
          }

          if (Test-Path $archive) {
              Remove-Item `
                  $archive `
                  -Force
          }

          if (Test-Path $extract) {
              Remove-Item `
                  $extract `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $extract `
              -Force |
              Out-Null

          Write-Host ""
          Write-Host "Downloading:"
          Write-Host $url

          Invoke-WebRequest `
              -Uri $url `
              -OutFile $archive `
              -UseBasicParsing

          if (-not (Test-Path $archive)) {
              throw "KoreTools archive was not downloaded."
          }

          Write-Host ""
          Write-Host "Archive size:"
          Write-Host "$((Get-Item $archive).Length) bytes"

          Expand-Archive `
              -Path $archive `
              -DestinationPath $extract `
              -Force

          $root = Get-ChildItem `
              $extract `
              -Directory |
              Select-Object -First 1

          if (-not $root) {
              throw "KoreTools archive has no root directory."
          }

          New-Item `
              -ItemType Directory `
              -Path $tools `
              -Force |
              Out-Null

          Copy-Item `
              -Path (Join-Path $root.FullName "*") `
              -Destination $tools `
              -Recurse `
              -Force

          Write-Host ""
          Write-Host "Kinc tools installed at:"
          Write-Host $tools

      # ============================================================
      # 13. VALIDAR KINC TOOLS
      # ============================================================
      - name: Verify Kinc Windows tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING KINC WINDOWS TOOLS"
          Write-Host "=========================================="

          $tools = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc\Tools\windows_x64"

          $required = @(
              "kmake.exe",
              "kraffiti.exe",
              "krafix.exe",
              "D3DCompiler_47.dll",
              "dxcompiler.dll",
              "dxil.dll"
          )

          foreach ($name in $required) {

              $path = Join-Path `
                  $tools `
                  $name

              if (-not (Test-Path $path)) {
                  throw "Required Kinc tool missing: $name"
              }

              $info = Get-Item $path

              if ($info.Length -eq 0) {
                  throw "Required Kinc tool is empty: $name"
              }

              Write-Host "OK: $name [$($info.Length) bytes]"
          }

      # ============================================================
      # 14. V8
      #
      # Descobrimos a revisão ainda pelo gitlink do ArmorCore.
      # ============================================================
      - name: Determine V8 revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DETERMINING V8 REVISION"
          Write-Host "=========================================="

          $armorcore = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $entry = git -C $armorcore ls-tree HEAD v8

          if (-not $entry) {
              throw "V8 gitlink was not found."
          }

          $v8Sha = $entry.Split("`t")[0].Split(" ")[2]

          if (-not $v8Sha) {
              throw "Could not determine V8 SHA."
          }

          Write-Host ""
          Write-Host "V8 SHA:"
          Write-Host $v8Sha

          "V8_SHA=$v8Sha" >> $env:GITHUB_ENV

      # ============================================================
      # 15. CHECKOUT V8 EXATO
      # ============================================================
      - name: Checkout exact V8
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING OUT V8"
          Write-Host "=========================================="

          $v8 = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8"

          if (Test-Path $v8) {
              Remove-Item `
                  $v8 `
                  -Recurse `
                  -Force
          }

          git clone `
              --filter=blob:none `
              --no-checkout `
              https://github.com/armory3d/v8_bin.git `
              $v8

          if ($LASTEXITCODE -ne 0) {
              throw "V8 clone failed."
          }

          Push-Location $v8

          try {

              git fetch `
                  origin `
                  $env:V8_SHA

              if ($LASTEXITCODE -ne 0) {
                  throw "Could not fetch exact V8 revision."
              }

              git checkout $env:V8_SHA

              if ($LASTEXITCODE -ne 0) {
                  throw "Could not checkout exact V8 revision."
              }

          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "V8 revision:"
          git -C $v8 rev-parse HEAD

          if ((git -C $v8 rev-parse HEAD) -ne $env:V8_SHA) {
              throw "V8 revision verification failed."
          }

      # ============================================================
      # 16. VERIFICAR V8 MONOLITH
      # ============================================================
      - name: Verify V8 monolith archive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING V8 MONOLITH"
          Write-Host "=========================================="

          $release = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release"

          $archive = Join-Path `
              $release `
              "v8_monolith.7z"

          if (-not (Test-Path $archive)) {

              Write-Host ""
              Write-Host "Available release files:"

              if (Test-Path $release) {
                  Get-ChildItem `
                      $release `
                      -Recurse |
                      Select-Object FullName, Length
              }

              throw "v8_monolith.7z was not found."
          }

          Write-Host ""
          Write-Host "Found:"
          Write-Host $archive

      # ============================================================
      # 17. EXTRAIR V8
      # ============================================================
      - name: Extract V8 monolith
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "EXTRACTING V8 MONOLITH"
          Write-Host "=========================================="

          $release = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release"

          $archive = Join-Path `
              $release `
              "v8_monolith.7z"

          $lib = Join-Path `
              $release `
              "v8_monolith.lib"

          if (-not (Test-Path $lib)) {

              & $env:SEVEN_ZIP `
                  x `
                  $archive `
                  "-o$release" `
                  "-y" `
                  "-aoa"

              if ($LASTEXITCODE -ne 0) {
                  throw "V8 extraction failed."
              }
          }

          if (-not (Test-Path $lib)) {
              throw "v8_monolith.lib was not extracted."
          }

          $info = Get-Item $lib

          Write-Host ""
          Write-Host "V8 library:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 18. VERIFICAR PATCH
      # ============================================================
      - name: Verify window handling patch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING WINDOW HANDLING PATCH"
          Write-Host "=========================================="

          $patch = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\patch\window_handling.diff"

          if (-not (Test-Path $patch)) {
              throw "window_handling.diff not found."
          }

          Write-Host ""
          Write-Host "Patch:"
          Write-Host $patch

      # ============================================================
      # 19. APLICAR PATCH
      # ============================================================
      - name: Apply window handling patch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "APPLYING WINDOW HANDLING PATCH"
          Write-Host "=========================================="

          Push-Location `
              (Join-Path $env:GITHUB_WORKSPACE "armorcore")

          try {

              git apply `
                  --check `
                  "patch/window_handling.diff" `
                  --directory=Kinc

              if ($LASTEXITCODE -ne 0) {
                  throw "window_handling.diff does not apply cleanly to the selected Kinc revision."
              }

              git apply `
                  "patch/window_handling.diff" `
                  --directory=Kinc

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to apply window_handling.diff."
              }

          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "Patch applied successfully."

      # ============================================================
      # 20. VERIFICAÇÃO PRÉ-BUILD
      #
      # NÃO existe armorcore\make.
      # O arquivo correto nesta geração é armorcore\make.js.
      #
      # O compilador Windows correto é:
      #
      # armorcore\Kinc\make.bat
      # ============================================================
      - name: Verify final build tree
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING FINAL BUILD TREE"
          Write-Host "=========================================="

          $required = @(
              "armorcore\make.js",
              "armorcore\kfile.js",
              "armorcore\project.js",
              "armorcore\Kinc\make.bat",
              "armorcore\Kinc\Tools\windows_x64\kmake.exe",
              "armorcore\Kinc\Tools\windows_x64\kraffiti.exe",
              "armorcore\Kinc\Tools\windows_x64\krafix.exe",
              "armorcore\v8\include",
              "armorcore\v8\libraries\win32\release\v8_monolith.lib",
              "armorcore\patch\window_handling.diff",
              "paint"
          )

          foreach ($path in $required) {

              if (-not (Test-Path $path)) {
                  throw "Required build path missing: $path"
              }

              Write-Host "OK: $path"
          }

          Write-Host ""
          Write-Host "No armorcore\make check is performed because this historical revision uses make.js."

      # ============================================================
      # 21. GERAR PROJETO D3D11
      #
      # make.bat -> Tools/windows_x64/kmake.exe
      #
      # O fluxo histórico usa:
      #   Kinc\make --from armorcore -g direct3d11
      # ============================================================
      - name: Generate ArmorPaint D3D11 project
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          echo ==========================================
          echo GENERATING ARMORPAINT D3D11 PROJECT
          echo ==========================================

          call armorcore\Kinc\make.bat --from armorcore -g direct3d11

          if errorlevel 1 (
              echo.
              echo ==========================================
              echo KINC MAKE FAILED
              echo ==========================================
              exit /b 1
          )

          echo.
          echo Kinc make completed successfully.

      # ============================================================
      # 22. VERIFICAR SOLUTION
      # ============================================================
      - name: Verify generated solution
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING GENERATED SOLUTION"
          Write-Host "=========================================="

          $expected = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\ArmorPaint.sln"

          if (Test-Path $expected) {

              Write-Host ""
              Write-Host "Found:"
              Write-Host $expected

              "ARMORPAINT_SOLUTION=$expected" >> $env:GITHUB_ENV
              exit 0
          }

          Write-Host ""
          Write-Host "ArmorPaint.sln not found."

          Write-Host ""
          Write-Host "Searching all Visual Studio solutions..."

          $solutions = Get-ChildItem `
              $env:GITHUB_WORKSPACE `
              -Include "*.sln","*.slnx" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

          if (-not $solutions) {

              Write-Host ""
              Write-Host "Generated build tree:"

              $build = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "build"

              if (Test-Path $build) {
                  Get-ChildItem `
                      $build `
                      -Recurse |
                      Select-Object FullName
              }

              throw "No Visual Studio solution was generated."
          }

          foreach ($solution in $solutions) {
              Write-Host $solution.FullName
          }

          $selected = $solutions |
              Where-Object {
                  $_.Name -eq "ArmorPaint.sln"
              } |
              Select-Object -First 1

          if (-not $selected) {
              $selected = $solutions |
                  Where-Object {
                      $_.Name -eq "Krom.sln"
                  } |
                  Select-Object -First 1
          }

          if (-not $selected) {
              $selected = $solutions | Select-Object -First 1
          }

          Write-Host ""
          Write-Host "Selected:"
          Write-Host $selected.FullName

          "ARMORPAINT_SOLUTION=$($selected.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 23. COMPILAR RELEASE X64
      # ============================================================
      - name: Build ArmorPaint Release x64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILDING ARMORPAINT RELEASE X64"
          Write-Host "=========================================="

          if (-not $env:ARMORPAINT_SOLUTION) {
              throw "ARMORPAINT_SOLUTION is not defined."
          }

          Write-Host ""
          Write-Host "Solution:"
          Write-Host $env:ARMORPAINT_SOLUTION

          Write-Host ""
          Write-Host "Configuration: Release"
          Write-Host "Platform: x64"

          & msbuild.exe `
              $env:ARMORPAINT_SOLUTION `
              /m `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE."
          }

          Write-Host ""
          Write-Host "MSBuild completed successfully."

      # ============================================================
      # 24. LOCALIZAR ARMORPAINT.EXE
      # ============================================================
      - name: Find ArmorPaint executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SEARCHING FOR ARMORPAINT.EXE"
          Write-Host "=========================================="

          $build = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build"

          $matches = @(
              Get-ChildItem `
                  $build `
                  -Filter "ArmorPaint.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue
          )

          if ($matches.Count -eq 0) {

              Write-Host ""
              Write-Host "All executable files found:"

              Get-ChildItem `
                  $build `
                  -Filter "*.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object FullName, Length

              throw "ArmorPaint.exe was not generated."
          }

          Write-Host ""
          Write-Host "Candidates:"

          foreach ($match in $matches) {
              Write-Host "$($match.FullName) [$($match.Length) bytes]"
          }

          $selected = $matches |
              Where-Object {
                  $_.FullName -match "\\x64\\Release\\ArmorPaint\.exe$"
              } |
              Select-Object -First 1

          if (-not $selected) {
              $selected = $matches | Select-Object -First 1
          }

          if ($selected.Length -lt 1000000) {
              throw "ArmorPaint.exe is suspiciously small."
          }

          Write-Host ""
          Write-Host "Selected:"
          Write-Host $selected.FullName

          "ARMORPAINT_EXE=$($selected.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 25. MONTAR build/krom
      # ============================================================
      - name: Assemble portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ASSEMBLING PORTABLE PACKAGE"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $release = Split-Path `
              $env:ARMORPAINT_EXE `
              -Parent

          if (-not (Test-Path $krom)) {
              throw "build\krom does not exist."
          }

          if (-not (Test-Path $release)) {
              throw "Release directory does not exist."
          }

          Write-Host ""
          Write-Host "Release:"
          Write-Host $release

          Write-Host ""
          Write-Host "Runtime:"
          Write-Host $krom

          Copy-Item `
              -Path (Join-Path $release "*") `
              -Destination $krom `
              -Recurse `
              -Force

          $finalExe = Join-Path `
              $krom `
              "ArmorPaint.exe"

          if (-not (Test-Path $finalExe)) {
              Copy-Item `
                  $env:ARMORPAINT_EXE `
                  $finalExe `
                  -Force
          }

          if (-not (Test-Path $finalExe)) {
              throw "ArmorPaint.exe was not copied to build\krom."
          }

          Write-Host ""
          Write-Host "Final executable:"
          Write-Host $finalExe

      # ============================================================
      # 26. VERIFICAÇÃO FINAL
      # ============================================================
      - name: Verify final package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "FINAL PACKAGE VERIFICATION"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $exe = Join-Path `
              $krom `
              "ArmorPaint.exe"

          if (-not (Test-Path $krom)) {
              throw "build\krom does not exist."
          }

          if (-not (Test-Path $exe)) {
              throw "ArmorPaint.exe does not exist."
          }

          $info = Get-Item $exe

          if ($info.Length -lt 1000000) {
              throw "Final ArmorPaint.exe is suspiciously small."
          }

          $files = @(
              Get-ChildItem `
                  $krom `
                  -Recurse `
                  -File
          )

          if ($files.Count -eq 0) {
              throw "Final package is empty."
          }

          Write-Host ""
          Write-Host "ArmorPaint.exe:"
          Write-Host $exe

          Write-Host ""
          Write-Host "Executable size:"
          Write-Host "$($info.Length) bytes"

          Write-Host ""
          Write-Host "File count:"
          Write-Host $files.Count

      # ============================================================
      # 27. ZIP
      # ============================================================
      - name: Create ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING ZIP"
          Write-Host "=========================================="

          $source = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $zip = Join-Path `
              $env:GITHUB_WORKSPACE `
              "ArmorPaint-0.9-23.08-Windows-x64-D3D11.zip"

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          Compress-Archive `
              -Path (Join-Path $source "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "ZIP creation failed."
          }

          $info = Get-Item $zip

          Write-Host ""
          Write-Host "ZIP:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "ZIP size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 28. UPLOAD FOLDER
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11
          path: build/krom
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 29. UPLOAD ZIP
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11 ZIP
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11-ZIP
          path: ArmorPaint-0.9-23.08-Windows-x64-D3D11.zip
          if-no-files-found: error
          compression-level: 0
