name: Build ArmorPaint Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ArmorPaint
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. BAIXAR O CÓDIGO OFICIAL DO ARMORPAINT
      # ============================================================

      - name: Checkout official ArmorPaint
        uses: actions/checkout@v5
        with:
          repository: armory3d/armorpaint
          ref: main
          submodules: recursive
          fetch-depth: 1


      # ============================================================
      # 2. VERIFICAR SE O CÓDIGO FOI BAIXADO
      # ============================================================

      - name: Verify source
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "ARMORPAINT SOURCE"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Current directory:"
          Get-Location

          Write-Host ""
          Write-Host "Repository contents:"
          Get-ChildItem -Force

          Write-Host ""
          Write-Host "Checking required directories..."

          if (-not (Test-Path ".\base")) {
              Write-Error "Pasta base não encontrada."
              exit 1
          }

          if (-not (Test-Path ".\paint")) {
              Write-Error "Pasta paint não encontrada."
              exit 1
          }

          if (-not (Test-Path ".\base\make.bat")) {
              Write-Error "base\make.bat não encontrado."
              exit 1
          }

          Write-Host ""
          Write-Host "OK - ArmorPaint source encontrado."


      # ============================================================
      # 3. VISUAL STUDIO / MSBUILD
      # ============================================================

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      # ============================================================
      # 4. GERAR PROJETO VISUAL STUDIO
      #
      # O README oficial manda:
      #
      # cd armorpaint/paint
      # ..\base\make
      # ============================================================

      - name: Generate Visual Studio project
        shell: cmd
        working-directory: paint
        run: |

          echo ==========================================
          echo GENERATING ARMORPAINT PROJECT
          echo ==========================================

          echo Current directory:
          cd

          echo.
          echo Running:
          echo ..\base\make.bat

          call ..\base\make.bat

          if errorlevel 1 (
              echo.
              echo ==========================================
              echo MAKE FAILED
              echo ==========================================
              exit /b 1
          )

          echo.
          echo Make completed successfully.


      # ============================================================
      # 5. VERIFICAR SOLUTION
      # ============================================================

      - name: Find ArmorPaint solution
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "SEARCHING FOR ArmorPaint.sln"
          Write-Host "=========================================="


          $solution = Get-ChildItem `
              -Path . `
              -Filter "ArmorPaint.sln" `
              -Recurse `
              -File |
              Select-Object -First 1


          if (-not $solution) {

              Write-Error "ArmorPaint.sln não foi encontrado."

              Write-Host ""
              Write-Host "Solutions encontradas:"

              Get-ChildItem `
                  -Path . `
                  -Filter "*.sln" `
                  -Recurse `
                  -File |
                  Select-Object FullName

              exit 1
          }


          Write-Host ""
          Write-Host "Solution encontrada:"
          Write-Host $solution.FullName


      # ============================================================
      # 6. COMPILAR RELEASE X64
      # ============================================================

      - name: Build Release x64
        shell: powershell
        run: |

          $solution = Get-ChildItem `
              -Path . `
              -Filter "ArmorPaint.sln" `
              -Recurse `
              -File |
              Select-Object -First 1


          if (-not $solution) {
              Write-Error "ArmorPaint.sln não encontrado."
              exit 1
          }


          Write-Host "=========================================="
          Write-Host "BUILDING ARMORPAINT"
          Write-Host "=========================================="


          Write-Host "Solution:"
          Write-Host $solution.FullName


          & msbuild `
              $solution.FullName `
              /m `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /verbosity:minimal


          if ($LASTEXITCODE -ne 0) {
              Write-Error "MSBuild falhou."
              exit $LASTEXITCODE
          }


          Write-Host ""
          Write-Host "Build concluído."


      # ============================================================
      # 7. LOCALIZAR EXECUTÁVEL
      # ============================================================

      - name: Find ArmorPaint.exe
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "SEARCHING FOR ArmorPaint.exe"
          Write-Host "=========================================="


          $executables = Get-ChildItem `
              -Path . `
              -Filter "ArmorPaint.exe" `
              -Recurse `
              -File


          if ($executables.Count -eq 0) {
              Write-Error "ArmorPaint.exe não encontrado."
              exit 1
          }


          foreach ($exe in $executables) {

              Write-Host ""
              Write-Host $exe.FullName

              Write-Host (
                  "Size: {0:N2} MB" -f ($exe.Length / 1MB)
              )
          }


      # ============================================================
      # 8. LOCALIZAR build\krom
      # ============================================================

      - name: Find krom directory
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "SEARCHING FOR build\krom"
          Write-Host "=========================================="


          $krom = Get-ChildItem `
              -Path . `
              -Directory `
              -Filter "krom" `
              -Recurse |
              Where-Object {
                  Test-Path (Join-Path $_.FullName "krom.js")
              } |
              Select-Object -First 1


          if (-not $krom) {

              Write-Error `
                  "Pasta build\krom com krom.js não encontrada."

              Write-Host ""
              Write-Host "Pastas krom encontradas:"

              Get-ChildItem `
                  -Path . `
                  -Directory `
                  -Filter "krom" `
                  -Recurse |
                  Select-Object FullName

              exit 1
          }


          Write-Host ""
          Write-Host "krom encontrado:"
          Write-Host $krom.FullName


      # ============================================================
      # 9. COPIAR EXECUTÁVEL PARA build\krom
      # ============================================================

      - name: Prepare complete ArmorPaint package
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "PREPARING COMPLETE PACKAGE"
          Write-Host "=========================================="


          # Encontrar krom que contém krom.js
          $krom = Get-ChildItem `
              -Path . `
              -Directory `
              -Filter "krom" `
              -Recurse |
              Where-Object {
                  Test-Path (Join-Path $_.FullName "krom.js")
              } |
              Select-Object -First 1


          if (-not $krom) {
              Write-Error "build\krom não encontrado."
              exit 1
          }


          # Encontrar ArmorPaint.exe compilado
          $exe = Get-ChildItem `
              -Path . `
              -Filter "ArmorPaint.exe" `
              -Recurse `
              -File |
              Where-Object {
                  $_.FullName -notlike "*\krom\ArmorPaint.exe"
              } |
              Select-Object -First 1


          if (-not $exe) {
              Write-Error "ArmorPaint.exe compilado não encontrado."
              exit 1
          }


          Write-Host ""
          Write-Host "Executable:"
          Write-Host $exe.FullName


          Write-Host ""
          Write-Host "Krom:"
          Write-Host $krom.FullName


          # Copiar executável
          Copy-Item `
              $exe.FullName `
              (Join-Path $krom.FullName "ArmorPaint.exe") `
              -Force


          Write-Host ""
          Write-Host "ArmorPaint.exe copiado para build\krom."


      # ============================================================
      # 10. MOSTRAR CONTEÚDO DO PACOTE
      # ============================================================

      - name: Inspect complete package
        shell: powershell
        run: |

          $krom = Get-ChildItem `
              -Path . `
              -Directory `
              -Filter "krom" `
              -Recurse |
              Where-Object {
                  Test-Path (Join-Path $_.FullName "krom.js")
              } |
              Select-Object -First 1


          Write-Host "=========================================="
          Write-Host "COMPLETE ARMORPAINT PACKAGE"
          Write-Host "=========================================="


          Get-ChildItem `
              $krom.FullName `
              -Recurse `
              -Force |
              Select-Object FullName, Length


          $files = Get-ChildItem `
              $krom.FullName `
              -Recurse `
              -File


          $size = (
              $files |
              Measure-Object Length -Sum
          ).Sum


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "TOTAL SIZE"
          Write-Host "=========================================="


          Write-Host (
              "Total: {0:N2} MB" -f ($size / 1MB)
          )


      # ============================================================
      # 11. CRIAR ARTIFACT
      # ============================================================

      - name: Create artifact
        shell: powershell
        run: |

          $krom = Get-ChildItem `
              -Path . `
              -Directory `
              -Filter "krom" `
              -Recurse |
              Where-Object {
                  Test-Path (Join-Path $_.FullName "krom.js")
              } |
              Select-Object -First 1


          if (Test-Path ".\artifact") {
              Remove-Item `
                  ".\artifact" `
                  -Recurse `
                  -Force
          }


          New-Item `
              -ItemType Directory `
              -Path ".\artifact" `
              -Force |
              Out-Null


          Copy-Item `
              (Join-Path $krom.FullName "*") `
              ".\artifact\" `
              -Recurse `
              -Force


          Write-Host ""
          Write-Host "Artifact criado."


      # ============================================================
      # 12. VERIFICAÇÃO FINAL
      # ============================================================

      - name: Verify final artifact
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "FINAL ARTIFACT"
          Write-Host "=========================================="


          if (-not (Test-Path ".\artifact\ArmorPaint.exe")) {
              Write-Error "ArmorPaint.exe não está no artifact."
              exit 1
          }


          if (-not (Test-Path ".\artifact\krom.js")) {
              Write-Error "krom.js não está no artifact."
              exit 1
          }


          $files = Get-ChildItem `
              ".\artifact" `
              -Recurse `
              -File


          $size = (
              $files |
              Measure-Object Length -Sum
          ).Sum


          Write-Host ""
          Write-Host "ArmorPaint.exe:"
          Write-Host (
              "{0:N2} MB" -f (
                  (Get-Item ".\artifact\ArmorPaint.exe").Length / 1MB
              )
          )


          Write-Host ""
          Write-Host "Package:"
          Write-Host (
              "{0:N2} MB" -f ($size / 1MB)
          )


          Write-Host ""
          Write-Host "Files:"
          Write-Host $files.Count


      # ============================================================
      # 13. UPLOAD
      # ============================================================

      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-complete
          path: artifact
          compression-level: 0
          if-no-files-found: error          Select-Object FullName

            exit 1

          }


          foreach ($krom in $kroms) {

            Write-Host ""
            Write-Host "Krom:"
            Write-Host $krom.FullName

          }


      # ============================================================
      # 9. Montar pacote completo
      # ============================================================

      - name: Create complete package
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "CREATING COMPLETE PACKAGE"
          Write-Host "=========================================="


          # ----------------------------------------------------------
          # Procurar krom
          # ----------------------------------------------------------

          $krom = Get-ChildItem `
            -Path $PWD `
            -Directory `
            -Filter "krom" `
            -Recurse |
            Where-Object {
              Test-Path (Join-Path $_.FullName "krom.js")
            } |
            Select-Object -First 1


          if (-not $krom) {

            Write-Error `
              "Pasta krom contendo krom.js não encontrada."

            exit 1

          }


          Write-Host ""
          Write-Host "Krom selecionado:"
          Write-Host $krom.FullName


          # ----------------------------------------------------------
          # Procurar executável Release
          # ----------------------------------------------------------

          $exe = Get-ChildItem `
            -Path $PWD `
            -Filter "ArmorPaint.exe" `
            -Recurse |
            Where-Object {
              $_.FullName -notlike "*\krom\ArmorPaint.exe"
            } |
            Sort-Object FullName |
            Select-Object -First 1


          if (-not $exe) {

            Write-Error "ArmorPaint.exe compilado não encontrado."
            exit 1

          }


          Write-Host ""
          Write-Host "Executável:"
          Write-Host $exe.FullName


          # ----------------------------------------------------------
          # Copiar para krom
          # ----------------------------------------------------------

          Copy-Item `
            $exe.FullName `
            (Join-Path $krom.FullName "ArmorPaint.exe") `
            -Force


          # ----------------------------------------------------------
          # Criar artifact
          # ----------------------------------------------------------

          if (Test-Path ".\artifact") {

            Remove-Item `
              ".\artifact" `
              -Recurse `
              -Force

          }


          New-Item `
            -ItemType Directory `
            -Path ".\artifact" `
            -Force |
            Out-Null


          # ----------------------------------------------------------
          # Copiar TODO krom
          # ----------------------------------------------------------

          Copy-Item `
            (Join-Path $krom.FullName "*") `
            ".\artifact\" `
            -Recurse `
            -Force


      # ============================================================
      # 10. Verificar tamanho
      # ============================================================

      - name: Verify package
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "FINAL PACKAGE"
          Write-Host "=========================================="


          $files = Get-ChildItem `
            ".\artifact" `
            -Recurse `
            -File


          foreach ($file in $files) {

            Write-Host $file.FullName

          }


          $size = (
            $files |
            Measure-Object Length -Sum
          ).Sum


          Write-Host ""
          Write-Host (
            "TOTAL SIZE: {0:N2} MB" -f ($size / 1MB)
          )


          if (-not (Test-Path ".\artifact\ArmorPaint.exe")) {

            Write-Error `
              "ArmorPaint.exe não está no pacote."

            exit 1

          }


          if (-not (Test-Path ".\artifact\krom.js")) {

            Write-Error `
              "krom.js não está no pacote."

            exit 1

          }


      # ============================================================
      # 11. Upload
      # ============================================================

      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-complete
          path: artifact
          compression-level: 0
          if-no-files-found: error
