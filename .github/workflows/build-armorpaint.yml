name: Build ArmorPaint 0.9 Windows x64 D3D11

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_TERMINAL_PROMPT: "0"
  GCM_INTERACTIVE: "Never"

jobs:
  build:
    name: ArmorPaint 0.9 - Windows x64 - Direct3D11
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. CHECKOUT ARMORPAINT 0.9
      # ============================================================
      - name: Checkout ArmorPaint 23.08
        uses: actions/checkout@v5
        with:
          repository: armory3d/armorpaint
          ref: 23.08
          fetch-depth: 1
          submodules: false

      # ============================================================
      # 2. NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      # ============================================================
      # 3. MSBUILD
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 4. MSVC
      # ============================================================
      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 5. 7-ZIP
      # ============================================================
      - name: Ensure 7-Zip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING 7-ZIP"
          Write-Host "=========================================="

          $candidates = @(
              "${env:ProgramFiles}\7-Zip\7z.exe",
              "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          )

          $sevenZip = $null

          foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                  $sevenZip = $candidate
                  break
              }
          }

          if (-not $sevenZip) {
              Write-Host "7-Zip not found. Installing..."
              choco install 7zip -y --no-progress

              foreach ($candidate in $candidates) {
                  if (Test-Path $candidate) {
                      $sevenZip = $candidate
                      break
                  }
              }
          }

          if (-not $sevenZip) {
              throw "7-Zip could not be located."
          }

          Write-Host "7-Zip:"
          Write-Host $sevenZip

          "SEVEN_ZIP=$sevenZip" >> $env:GITHUB_ENV

      # ============================================================
      # 6. MOSTRAR VERSÕES
      # ============================================================
      - name: Show build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILD ENVIRONMENT"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Node:"
          node --version

          Write-Host ""
          Write-Host "npm:"
          npm --version

          Write-Host ""
          Write-Host "MSBuild:"
          msbuild.exe -version

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "ArmorPaint:"
          git rev-parse HEAD

          Write-Host ""
          Write-Host "ArmorPaint tag:"
          git describe --tags --always

      # ============================================================
      # 7. LER O SHA DO ARMORCORE
      # ============================================================
      - name: Determine ArmorCore revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ARMORCORE REVISION"
          Write-Host "=========================================="

          $entry = git ls-tree HEAD armorcore

          if (-not $entry) {
              throw "ArmorCore gitlink not found."
          }

          $armorcoreSha = $entry.Split("`t")[0].Split(" ")[2]

          if (-not $armorcoreSha) {
              throw "Could not determine ArmorCore SHA."
          }

          Write-Host ""
          Write-Host "ArmorCore SHA:"
          Write-Host $armorcoreSha

          "ARMORCORE_SHA=$armorcoreSha" >> $env:GITHUB_ENV

      # ============================================================
      # 8. BAIXAR ARMORCORE NO COMMIT EXATO
      #
      # Usamos Git para o repositório principal porque é pequeno.
      # ============================================================
      - name: Checkout ArmorCore exact revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $path = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          Write-Host "=========================================="
          Write-Host "CHECKOUT ARMORCORE"
          Write-Host "=========================================="

          git clone `
              --filter=blob:none `
              --no-checkout `
              https://github.com/armory3d/armorcore.git `
              $path

          if ($LASTEXITCODE -ne 0) {
              throw "ArmorCore clone failed."
          }

          Push-Location $path

          try {
              git checkout $env:ARMORCORE_SHA

              if ($LASTEXITCODE -ne 0) {
                  throw "ArmorCore checkout failed."
              }
          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "ArmorCore revision:"
          git -C $path rev-parse HEAD

      # ============================================================
      # 9. OBTER SHA DO KINC
      # ============================================================
      - name: Determine Kinc revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "KINC REVISION"
          Write-Host "=========================================="

          $armorcore = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $entry = git -C $armorcore ls-tree HEAD Kinc

          if (-not $entry) {
              throw "Kinc gitlink not found."
          }

          $kincSha = $entry.Split("`t")[0].Split(" ")[2]

          if (-not $kincSha) {
              throw "Could not determine Kinc SHA."
          }

          Write-Host ""
          Write-Host "Kinc SHA:"
          Write-Host $kincSha

          "KINC_SHA=$kincSha" >> $env:GITHUB_ENV

      # ============================================================
      # 10. BAIXAR KINC/KORE NO COMMIT HISTÓRICO EXATO
      #
      # O commit 60e0062... pertence a Kode/Kore.
      # Fazemos download como ZIP para evitar submodules Git.
      # ============================================================
      - name: Download historical Kinc
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DOWNLOADING HISTORICAL KINC"
          Write-Host "=========================================="

          $destination = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc"

          $zip = Join-Path `
              $env:RUNNER_TEMP `
              "kinc.zip"

          $url = "https://codeload.github.com/Kode/Kore/zip/$env:KINC_SHA"

          Write-Host ""
          Write-Host "Source:"
          Write-Host $url

          if (Test-Path $destination) {
              Remove-Item `
                  $destination `
                  -Recurse `
                  -Force
          }

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          Invoke-WebRequest `
              -Uri $url `
              -OutFile $zip `
              -UseBasicParsing

          if (-not (Test-Path $zip)) {
              throw "Kinc ZIP was not downloaded."
          }

          $extract = Join-Path `
              $env:RUNNER_TEMP `
              "kinc_extract"

          if (Test-Path $extract) {
              Remove-Item `
                  $extract `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $extract `
              -Force |
              Out-Null

          Expand-Archive `
              -Path $zip `
              -DestinationPath $extract `
              -Force

          $root = Get-ChildItem `
              $extract `
              -Directory |
              Select-Object -First 1

          if (-not $root) {
              throw "Kinc ZIP did not contain a root directory."
          }

          New-Item `
              -ItemType Directory `
              -Path $destination `
              -Force |
              Out-Null

          Copy-Item `
              -Path (Join-Path $root.FullName "*") `
              -Destination $destination `
              -Recurse `
              -Force

          Write-Host ""
          Write-Host "Kinc extracted to:"
          Write-Host $destination

          Write-Host ""
          Write-Host "Kinc contents:"
          Get-ChildItem `
              $destination |
              Select-Object Name

      # ============================================================
      # 11. BAIXAR KINC TOOLS COMO ZIP
      #
      # NÃO usamos git clone.
      #
      # O .gitmodules histórico especifica:
      #
      # https://github.com/armory3d/KincTools_windows_x64.git
      # branch = main
      # shallow = true
      #
      # Portanto baixamos diretamente main.
      # ============================================================
      - name: Download Kinc Windows tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DOWNLOADING KINC WINDOWS TOOLS"
          Write-Host "=========================================="

          $destination = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc\Tools\windows_x64"

          $zip = Join-Path `
              $env:RUNNER_TEMP `
              "kinc_tools_windows_x64.zip"

          $extract = Join-Path `
              $env:RUNNER_TEMP `
              "kinc_tools_extract"

          # GitHub repository is public and currently exists.
          $url = "https://codeload.github.com/armory3d/KincTools_windows_x64/zip/refs/heads/main"

          Write-Host ""
          Write-Host "Source:"
          Write-Host $url

          if (Test-Path $destination) {
              Remove-Item `
                  $destination `
                  -Recurse `
                  -Force
          }

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          if (Test-Path $extract) {
              Remove-Item `
                  $extract `
                  -Recurse `
                  -Force
          }

          Invoke-WebRequest `
              -Uri $url `
              -OutFile $zip `
              -UseBasicParsing

          if (-not (Test-Path $zip)) {
              throw "KincTools ZIP was not downloaded."
          }

          New-Item `
              -ItemType Directory `
              -Path $extract `
              -Force |
              Out-Null

          Expand-Archive `
              -Path $zip `
              -DestinationPath $extract `
              -Force

          $root = Get-ChildItem `
              $extract `
              -Directory |
              Select-Object -First 1

          if (-not $root) {
              throw "KincTools ZIP did not contain a root directory."
          }

          New-Item `
              -ItemType Directory `
              -Path $destination `
              -Force |
              Out-Null

          Copy-Item `
              -Path (Join-Path $root.FullName "*") `
              -Destination $destination `
              -Recurse `
              -Force

          Write-Host ""
          Write-Host "KincTools extracted to:"
          Write-Host $destination

          Write-Host ""
          Write-Host "KincTools contents:"
          Get-ChildItem `
              $destination `
              -Recurse `
              -File |
              Select-Object FullName, Length

      # ============================================================
      # 12. V8
      #
      # O v8_bin é baixado do repositório público.
      # ============================================================
      - name: Determine V8 revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "V8 REVISION"
          Write-Host "=========================================="

          $armorcore = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $entry = git -C $armorcore ls-tree HEAD v8

          if (-not $entry) {
              throw "V8 gitlink not found."
          }

          $v8Sha = $entry.Split("`t")[0].Split(" ")[2]

          if (-not $v8Sha) {
              throw "Could not determine V8 SHA."
          }

          Write-Host ""
          Write-Host "V8 SHA:"
          Write-Host $v8Sha

          "V8_SHA=$v8Sha" >> $env:GITHUB_ENV

      # ============================================================
      # 13. CHECKOUT V8
      # ============================================================
      - name: Checkout exact V8 revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING V8"
          Write-Host "=========================================="

          $path = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8"

          if (Test-Path $path) {
              Remove-Item `
                  $path `
                  -Recurse `
                  -Force
          }

          git clone `
              --filter=blob:none `
              --no-checkout `
              https://github.com/armory3d/v8_bin.git `
              $path

          if ($LASTEXITCODE -ne 0) {
              throw "V8 clone failed."
          }

          Push-Location $path

          try {
              git checkout $env:V8_SHA

              if ($LASTEXITCODE -ne 0) {
                  throw "V8 checkout failed."
              }

          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "V8 revision:"
          git -C $path rev-parse HEAD

      # ============================================================
      # 14. VERIFICAR V8 MONOLITH
      # ============================================================
      - name: Verify V8 monolith archive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING V8 MONOLITH"
          Write-Host "=========================================="

          $archive = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release\v8_monolith.7z"

          if (-not (Test-Path $archive)) {

              Write-Host ""
              Write-Host "Expected archive:"
              Write-Host $archive

              Write-Host ""
              Write-Host "Available V8 release files:"

              $release = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "armorcore\v8\libraries\win32\release"

              if (Test-Path $release) {
                  Get-ChildItem `
                      $release `
                      -Recurse |
                      Select-Object FullName, Length
              }

              throw "v8_monolith.7z was not found."
          }

          $info = Get-Item $archive

          Write-Host ""
          Write-Host "Archive found:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 15. EXTRAIR V8 MONOLITH
      # ============================================================
      - name: Extract V8 monolith
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "EXTRACTING V8 MONOLITH"
          Write-Host "=========================================="

          $release = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release"

          $archive = Join-Path `
              $release `
              "v8_monolith.7z"

          $lib = Join-Path `
              $release `
              "v8_monolith.lib"

          if (-not (Test-Path $lib)) {

              & $env:SEVEN_ZIP `
                  x `
                  $archive `
                  "-o$release" `
                  "-y" `
                  "-aoa"

              if ($LASTEXITCODE -ne 0) {
                  throw "7-Zip failed to extract V8 monolith."
              }
          }

          if (-not (Test-Path $lib)) {
              throw "v8_monolith.lib was not produced."
          }

          $info = Get-Item $lib

          Write-Host ""
          Write-Host "V8 library:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 16. VERIFICAR ARMORCORE + KINC
      # ============================================================
      - name: Verify complete source tree
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING COMPLETE SOURCE TREE"
          Write-Host "=========================================="

          $required = @(
              "armorcore\make",
              "armorcore\Kinc",
              "armorcore\Kinc\make",
              "armorcore\Kinc\Tools\windows_x64",
              "armorcore\v8",
              "armorcore\v8\libraries\win32\release\v8_monolith.lib",
              "paint"
          )

          foreach ($item in $required) {

              if (-not (Test-Path $item)) {
                  throw "Required path missing: $item"
              }

              Write-Host "OK: $item"
          }

      # ============================================================
      # 17. APLICAR WINDOW HANDLING PATCH
      # ============================================================
      - name: Apply window handling patch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "APPLYING WINDOW HANDLING PATCH"
          Write-Host "=========================================="

          $patch = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\patch\window_handling.diff"

          if (-not (Test-Path $patch)) {
              throw "window_handling.diff not found."
          }

          Push-Location `
              (Join-Path $env:GITHUB_WORKSPACE "armorcore")

          try {

              git apply --check `
                  "patch/window_handling.diff" `
                  --directory=Kinc

              if ($LASTEXITCODE -ne 0) {
                  throw "window_handling.diff does not apply cleanly to the historical Kinc revision."
              }

              git apply `
                  "patch/window_handling.diff" `
                  --directory=Kinc

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to apply window_handling.diff."
              }

          }
          finally {
              Pop-Location
          }

          Write-Host "Window handling patch applied."

      # ============================================================
      # 18. GERAR PROJETO VISUAL STUDIO D3D11
      # ============================================================
      - name: Generate ArmorPaint D3D11 project
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          echo ==========================================
          echo GENERATING ARMORPAINT D3D11 PROJECT
          echo ==========================================

          armorcore\Kinc\make --from armorcore -g direct3d11

          if errorlevel 1 (
              echo.
              echo ==========================================
              echo KINC MAKE FAILED
              echo ==========================================
              exit /b 1
          )

          echo.
          echo Project generated successfully.

      # ============================================================
      # 19. VERIFICAR SOLUTION
      # ============================================================
      - name: Verify generated solution
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING GENERATED SOLUTION"
          Write-Host "=========================================="

          $expected = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\ArmorPaint.sln"

          if (Test-Path $expected) {
              Write-Host ""
              Write-Host "Found:"
              Write-Host $expected

              "ARMORPAINT_SOLUTION=$expected" >> $env:GITHUB_ENV
              exit 0
          }

          Write-Host ""
          Write-Host "ArmorPaint.sln not found."
          Write-Host ""
          Write-Host "Searching all solutions..."

          $solutions = Get-ChildItem `
              $env:GITHUB_WORKSPACE `
              -Include "*.sln","*.slnx" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

          if (-not $solutions) {

              Write-Host ""
              Write-Host "Generated build contents:"

              $build = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "build"

              if (Test-Path $build) {
                  Get-ChildItem `
                      $build `
                      -Recurse |
                      Select-Object FullName
              }

              throw "No Visual Studio solution was generated."
          }

          foreach ($solution in $solutions) {
              Write-Host $solution.FullName
          }

          $selected = $solutions |
              Where-Object {
                  $_.Name -eq "ArmorPaint.sln"
              } |
              Select-Object -First 1

          if (-not $selected) {
              $selected = $solutions | Select-Object -First 1
          }

          Write-Host ""
          Write-Host "Using:"
          Write-Host $selected.FullName

          "ARMORPAINT_SOLUTION=$($selected.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 20. COMPILAR RELEASE X64
      # ============================================================
      - name: Build ArmorPaint Release x64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILDING RELEASE X64"
          Write-Host "=========================================="

          if (-not $env:ARMORPAINT_SOLUTION) {
              throw "ARMORPAINT_SOLUTION is not set."
          }

          Write-Host ""
          Write-Host "Solution:"
          Write-Host $env:ARMORPAINT_SOLUTION

          & msbuild.exe `
              $env:ARMORPAINT_SOLUTION `
              /m `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE."
          }

          Write-Host ""
          Write-Host "MSBuild completed successfully."

      # ============================================================
      # 21. VERIFICAR ARMORPAINT.EXE
      # ============================================================
      - name: Verify ArmorPaint executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING ARMORPAINT.EXE"
          Write-Host "=========================================="

          $exe = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\x64\Release\ArmorPaint.exe"

          if (-not (Test-Path $exe)) {

              Write-Host ""
              Write-Host "Expected executable not found."

              Write-Host ""
              Write-Host "Searching for ArmorPaint.exe:"

              $matches = Get-ChildItem `
                  (Join-Path $env:GITHUB_WORKSPACE "build") `
                  -Filter "ArmorPaint.exe" `
                  -Recurse `
                  -File `
                  -ErrorAction SilentlyContinue

              if ($matches) {
                  foreach ($match in $matches) {
                      Write-Host $match.FullName
                  }
              }

              throw "ArmorPaint.exe was not generated."
          }

          $info = Get-Item $exe

          Write-Host ""
          Write-Host "ArmorPaint.exe:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

          "ARMORPAINT_EXE=$($info.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 22. MONTAR BUILD/KROM
      # ============================================================
      - name: Assemble portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ASSEMBLING PORTABLE PACKAGE"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $release = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\x64\Release"

          if (-not (Test-Path $release)) {
              throw "Release directory does not exist."
          }

          if (-not (Test-Path $krom)) {
              New-Item `
                  -ItemType Directory `
                  -Path $krom `
                  -Force |
                  Out-Null
          }

          Write-Host ""
          Write-Host "Copying Release files..."

          Copy-Item `
              -Path (Join-Path $release "*") `
              -Destination $krom `
              -Recurse `
              -Force

          $finalExe = Join-Path `
              $krom `
              "ArmorPaint.exe"

          if (-not (Test-Path $finalExe)) {
              Copy-Item `
                  $env:ARMORPAINT_EXE `
                  $finalExe `
                  -Force
          }

          if (-not (Test-Path $finalExe)) {
              throw "ArmorPaint.exe is missing from build/krom."
          }

          Write-Host ""
          Write-Host "Final executable:"
          Write-Host $finalExe

      # ============================================================
      # 23. VERIFICAÇÃO FINAL
      # ============================================================
      - name: Verify final package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING FINAL PACKAGE"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $exe = Join-Path `
              $krom `
              "ArmorPaint.exe"

          if (-not (Test-Path $krom)) {
              throw "build/krom does not exist."
          }

          if (-not (Test-Path $exe)) {
              throw "ArmorPaint.exe does not exist."
          }

          $files = Get-ChildItem `
              $krom `
              -Recurse `
              -File

          if (-not $files) {
              throw "Final package is empty."
          }

          $info = Get-Item $exe

          Write-Host ""
          Write-Host "ArmorPaint.exe:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

          Write-Host ""
          Write-Host "Number of files:"
          Write-Host $files.Count

      # ============================================================
      # 24. ZIP
      # ============================================================
      - name: Create ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING ZIP"
          Write-Host "=========================================="

          $source = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $zip = Join-Path `
              $env:GITHUB_WORKSPACE `
              "ArmorPaint-0.9-23.08-Windows-x64-D3D11.zip"

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          Compress-Archive `
              -Path (Join-Path $source "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "ZIP was not created."
          }

