name: Build ArmorPaint Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ArmorPaint Windows x64
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      ARMORPAINT_REPO: armory3d/armorpaint
      ARMORPAINT_REF: main
      ARMORCORE_REPO: armory3d/armorcore
      ARMORCORE_REF: main

    steps:
      # ============================================================
      # 1. Checkout do projeto principal
      # ============================================================
      - name: Checkout ArmorPaint
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMORPAINT_REPO }}
          ref: ${{ env.ARMORPAINT_REF }}
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 2. Clonar ArmorCore (dependência do projeto)
      # ============================================================
      - name: Clone ArmorCore dependency
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $armorcoreDir = Join-Path $env:GITHUB_WORKSPACE "armorcore"
          $armorcoreUrl = "https://github.com/${{ env.ARMORCORE_REPO }}.git"

          if (Test-Path $armorcoreDir) {
              Remove-Item $armorcoreDir -Recurse -Force
          }

          Write-Host "Cloning ArmorCore from: $armorcoreUrl"
          git clone --recursive $armorcoreUrl $armorcoreDir
          if ($LASTEXITCODE -ne 0) {
              throw "ArmorCore clone failed."
          }

          Push-Location $armorcoreDir
          try {
              git checkout ${{ env.ARMORCORE_REF }}
              if ($LASTEXITCODE -ne 0) {
                  throw "ArmorCore checkout failed."
              }

              git submodule sync --recursive
              if ($LASTEXITCODE -ne 0) {
                  throw "ArmorCore submodule sync failed."
              }

              git submodule update --init --recursive
              if ($LASTEXITCODE -ne 0) {
                  throw "ArmorCore submodule update failed."
              }
          }
          finally {
              Pop-Location
          }

      # ============================================================
      # 3. Aplicar patch opcional de compatibilidade, se existir
      # ============================================================
      - name: Apply optional ArmorCore patch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $patchSource = Join-Path $env:GITHUB_WORKSPACE "patch\window_handling.diff"
          $patchTargetDir = Join-Path $env:GITHUB_WORKSPACE "armorcore\patch"
          $patchTarget = Join-Path $patchTargetDir "window_handling.diff"

          if (Test-Path $patchSource) {
              Write-Host "Found optional ArmorCore patch at: $patchSource"

              New-Item -ItemType Directory -Path $patchTargetDir -Force | Out-Null
              Copy-Item $patchSource $patchTarget -Force

              if (-not (Test-Path $patchTarget)) {
                  throw "Patch was not copied to ArmorCore: $patchTarget"
              }
          }
          else {
              Write-Host "Optional ArmorCore patch not present. Skipping patch application."
          }

      # ============================================================
      # 4. Verificar ferramentas do Visual Studio
      # ============================================================
      - name: Verify Visual Studio
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
              throw "vswhere.exe not found."
          }

          $vsInstall = & $vswhere `
              -latest `
              -products "*" `
              -property installationPath

          if (-not $vsInstall) {
              throw "Visual Studio installation not found."
          }

          Write-Host "Visual Studio:"
          Write-Host $vsInstall

          $vcvars = & $vswhere `
              -latest `
              -products "*" `
              -find "VC\Auxiliary\Build\vcvars64.bat"

          if (-not $vcvars) {
              throw "vcvars64.bat not found."
          }

          Write-Host ""
          Write-Host "vcvars64:"
          Write-Host $vcvars

          $clang = & $vswhere `
              -latest `
              -products "*" `
              -find "VC\Tools\Llvm\x64\bin\clang-cl.exe"

          if (-not $clang) {
              throw "clang-cl.exe not found."
          }

          Write-Host ""
          Write-Host "clang-cl:"
          Write-Host $clang

          & $clang --version

      # ============================================================
      # 5. Verificar estrutura do source tree
      # ============================================================
      - name: Verify source tree
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
              "base\make.bat",
              "base\tools\make.js",
              "base\tools\bin\windows_x64\amake.exe",
              "paint"
          )

          foreach ($path in $required) {
              if (-not (Test-Path $path)) {
                  throw "Missing required path: $path"
              }

              Write-Host "OK: $path"
          }

          $patchFile = Join-Path $env:GITHUB_WORKSPACE "armorcore\patch\window_handling.diff"
          if (Test-Path $patchFile) {
              Write-Host "Optional patch file found: $patchFile"
          }

      # ============================================================
      # 6. Gerar + compilar
      # ============================================================
      - name: Build ArmorPaint
        shell: cmd
        working-directory: paint
        run: |
          echo ==========================================
          echo BUILDING ARMORPAINT WINDOWS X64
          echo ==========================================

          ..\base\make.bat --target windows --graphics direct3d11 --compile

          if errorlevel 1 (
            echo ArmorPaint build failed.
            exit /b 1
          )

      # ============================================================
      # 7. Verificar output oficial do build
      # ============================================================
      - name: Verify official build output
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $out = Join-Path $env:GITHUB_WORKSPACE "paint\build\out"
          $exe = Join-Path $out "ArmorPaint.exe"

          Write-Host "=========================================="
          Write-Host "VERIFYING PAINT/BUILD/OUT"
          Write-Host "=========================================="

          if (-not (Test-Path $out)) {
              throw "paint\build\out was not generated."
          }

          if (-not (Test-Path $exe)) {
              throw "ArmorPaint.exe not found at expected location."
          }

          Write-Host ""
          Write-Host "ArmorPaint.exe:"
          Write-Host $exe

          $file = Get-Item $exe

          Write-Host ""
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "Created: $($file.CreationTime)"

          Write-Host ""
          Write-Host "Contents of paint\build\out:"
          Get-ChildItem $out -Recurse |
              Select-Object FullName, Length

      # ============================================================
      # 8. Teste real de inicialização (somente em runner com GPU/desktop)
      # ============================================================
      - name: Test ArmorPaint startup
        if: ${{ runner.environment == 'self-hosted' }}
        shell: powershell
        working-directory: paint\build\out
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "TESTING ARMORPAINT STARTUP"
          Write-Host "=========================================="

          $exe = Join-Path (Get-Location) "ArmorPaint.exe"

          if (-not (Test-Path $exe)) {
              throw "ArmorPaint.exe not found."
          }

          Write-Host "Launching:"
          Write-Host $exe

          $process = Start-Process `
              -FilePath $exe `
              -ArgumentList "--background" `
              -WorkingDirectory (Get-Location) `
              -PassThru `
              -WindowStyle Hidden

          Write-Host ""
          Write-Host "Process ID: $($process.Id)"

          try {
              Start-Sleep -Seconds 15

              $running = Get-Process -Id $process.Id -ErrorAction SilentlyContinue

              if ($running) {
                  Write-Host ""
                  Write-Host "ArmorPaint remained running for 15 seconds."
                  Write-Host "Startup test passed."
              }
              else {
                  $process.Refresh()

                  Write-Host ""
                  Write-Host "ArmorPaint exited during startup."

                  if ($null -ne $process.ExitCode) {
                      Write-Host "Exit code: $($process.ExitCode)"
                  }

                  throw "ArmorPaint failed to stay running."
              }
          }
          finally {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      # ============================================================
      # 9. Criar pacote portátil
      # ============================================================
      - name: Create portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING PORTABLE PACKAGE"
          Write-Host "=========================================="

          $source = Join-Path $env:GITHUB_WORKSPACE "paint\build\out"
          $artifact = Join-Path $env:GITHUB_WORKSPACE "artifact"

          if (-not (Test-Path $source)) {
              throw "Source output does not exist: $source"
          }

          if (Test-Path $artifact) {
              Remove-Item $artifact -Recurse -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $artifact `
              -Force |
              Out-Null

          Write-Host "Copying:"
          Write-Host $source
          Write-Host ""
          Write-Host "To:"
          Write-Host $artifact

          Copy-Item `
              -Path (Join-Path $source "*") `
              -Destination $artifact `
              -Recurse `
              -Force

          $finalExe = Join-Path $artifact "ArmorPaint.exe"

          if (-not (Test-Path $finalExe)) {
              throw "Final artifact does not contain ArmorPaint.exe."
          }

          Write-Host ""
          Write-Host "Testing final package..."

          Push-Location $artifact

          try {
              $process = Start-Process `
                  -FilePath ".\ArmorPaint.exe" `
                  -ArgumentList "--background" `
                  -WorkingDirectory $artifact `
                  -PassThru `
                  -WindowStyle Hidden

              Start-Sleep -Seconds 10

              $running = Get-Process `
                  -Id $process.Id `
                  -ErrorAction SilentlyContinue

              if (-not $running) {
                  $process.Refresh()

                  Write-Host "Final packaged application exited."
                  Write-Host "Exit code: $($process.ExitCode)"

                  throw "Final package failed startup test."
              }

              Write-Host "Final package startup test passed."

              Stop-Process `
                  -Id $process.Id `
                  -Force `
                  -ErrorAction SilentlyContinue
          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FINAL PACKAGE CONTENT"
          Write-Host "=========================================="

          Get-ChildItem $artifact -Recurse |
              Select-Object FullName, Length

      # ============================================================
      # 10. Criar ZIP
      # ============================================================
      - name: Create ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $artifact = Join-Path $env:GITHUB_WORKSPACE "artifact"
          $zip = Join-Path $env:GITHUB_WORKSPACE "ArmorPaint-Windows-x64.zip"

          if (Test-Path $zip) {
              Remove-Item $zip -Force
          }

          Compress-Archive `
              -Path (Join-Path $artifact "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "ZIP was not created."
          }

          Write-Host "ZIP created:"
          Write-Host $zip

      # ============================================================
      # 11. Upload do diretório portátil
      # ============================================================
      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: artifact
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 12. Upload do ZIP
      # ============================================================
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-ZIP
          path: ArmorPaint-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
