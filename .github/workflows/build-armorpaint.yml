name: Build ArmorPaint 0.9 Windows x64 D3D11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ArmorPaint 0.9 - Windows x64 - Direct3D11
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. CHECKOUT ARMORPAINT 0.9
      #
      # A release é "0.9-armorpaint"
      # A tag correspondente no Git é 23.08
      # ============================================================
      - name: Checkout ArmorPaint 0.9
        uses: actions/checkout@v5
        with:
          repository: armory3d/armorpaint
          ref: 23.08
          fetch-depth: 1
          submodules: false

      # ============================================================
      # 2. NODE.JS
      #
      # O código de build desta geração utiliza Node.js.
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      # ============================================================
      # 3. MSBUILD
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 4. MSVC x64
      # ============================================================
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 5. VERIFICAR FERRAMENTAS
      # ============================================================
      - name: Verify build tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING BUILD TOOLS"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Node:"
          node --version

          Write-Host ""
          Write-Host "npm:"
          npm --version

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "MSBuild:"
          msbuild.exe -version

          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
              throw "git.exe not found."
          }

          if (-not (Get-Command node.exe -ErrorAction SilentlyContinue)) {
              throw "node.exe not found."
          }

          if (-not (Get-Command msbuild.exe -ErrorAction SilentlyContinue)) {
              throw "msbuild.exe not found."
          }

      # ============================================================
      # 6. 7-ZIP
      #
      # O runner normalmente já possui 7-Zip.
      # Caso não possua, instala.
      # ============================================================
      - name: Ensure 7-Zip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING 7-ZIP"
          Write-Host "=========================================="

          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue

          if ($sevenZip) {
              Write-Host "7-Zip found:"
              Write-Host $sevenZip.Source
              "SEVEN_ZIP=$($sevenZip.Source)" >> $env:GITHUB_ENV
              exit 0
          }

          $candidates = @(
              "${env:ProgramFiles}\7-Zip\7z.exe",
              "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          )

          foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                  Write-Host "7-Zip found:"
                  Write-Host $candidate
                  "SEVEN_ZIP=$candidate" >> $env:GITHUB_ENV
                  exit 0
              }
          }

          Write-Host "7-Zip not found. Installing..."

          choco install 7zip -y --no-progress

          foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                  Write-Host "7-Zip installed:"
                  Write-Host $candidate
                  "SEVEN_ZIP=$candidate" >> $env:GITHUB_ENV
                  exit 0
              }
          }

          throw "Unable to locate 7-Zip after installation."

      # ============================================================
      # 7. MOSTRAR COMMIT ARMORPAINT
      # ============================================================
      - name: Verify ArmorPaint revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ARMORPAINT REVISION"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Commit:"
          git rev-parse HEAD

          Write-Host ""
          Write-Host "Tag:"
          git describe --tags --always

          Write-Host ""
          Write-Host "ArmorCore gitlink:"
          git ls-tree HEAD armorcore

      # ============================================================
      # 8. CLONAR ARMORCORE NO SHA EXATO REGISTRADO PELO ARMORPAINT
      # ============================================================
      - name: Checkout exact ArmorCore revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING ARMORCORE"
          Write-Host "=========================================="

          $armorcorePath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $armorcoreSha = (
              git ls-tree HEAD armorcore
          ).Split("`t")[0].Split(" ")[2]

          if (-not $armorcoreSha) {
              throw "Unable to determine ArmorCore gitlink SHA."
          }

          Write-Host ""
          Write-Host "ArmorCore SHA:"
          Write-Host $armorcoreSha

          git clone `
              --filter=blob:none `
              --no-checkout `
              https://github.com/armory3d/armorcore.git `
              $armorcorePath

          Push-Location $armorcorePath

          try {
              git checkout $armorcoreSha

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to checkout ArmorCore SHA $armorcoreSha."
              }
          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "ArmorCore checked out at:"
          git -C $armorcorePath rev-parse HEAD

      # ============================================================
      # 9. LER O SHA EXATO DO KINC
      #
      # O ArmorCore antigo registra:
      #
      # 60e0062139e027a59774155bdb03731beac579e7
      #
      # Esse commit vive no repositório renomeado Kode/Kore.
      # ============================================================
      - name: Determine exact Kinc revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DETERMINING EXACT KINC REVISION"
          Write-Host "=========================================="

          $armorcorePath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $kincSha = (
              git -C $armorcorePath ls-tree HEAD Kinc
          ).Split("`t")[0].Split(" ")[2]

          if (-not $kincSha) {
              throw "Unable to determine Kinc gitlink SHA."
          }

          Write-Host ""
          Write-Host "Kinc SHA recorded by ArmorCore:"
          Write-Host $kincSha

          if ($kincSha -ne "60e0062139e027a59774155bdb03731beac579e7") {
              Write-Warning "ArmorCore contains a different Kinc SHA."
              Write-Warning "Using the SHA recorded by the checked-out ArmorCore."
          }

          "KINC_SHA=$kincSha" >> $env:GITHUB_ENV

      # ============================================================
      # 10. CLONAR KINC/KORE NO SHA EXATO
      #
      # O antigo github.com/armory3d/Kinc desapareceu.
      # O histórico está em Kode/Kore.
      # ============================================================
      - name: Checkout exact historical Kinc
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING HISTORICAL KINC"
          Write-Host "=========================================="

          $kincPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc"

          if (Test-Path $kincPath) {
              Remove-Item `
                  $kincPath `
                  -Recurse `
                  -Force
          }

          Write-Host ""
          Write-Host "Cloning historical Kinc repository:"
          Write-Host "https://github.com/Kode/Kore.git"

          git clone `
              --filter=blob:none `
              --no-checkout `
              https://github.com/Kode/Kore.git `
              $kincPath

          Push-Location $kincPath

          try {

              Write-Host ""
              Write-Host "Checking exact commit:"
              Write-Host $env:KINC_SHA

              git cat-file -e "$env:KINC_SHA^{commit}"

              if ($LASTEXITCODE -ne 0) {
                  throw "The required Kinc commit does not exist in Kode/Kore."
              }

              git checkout $env:KINC_SHA

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to checkout exact Kinc commit."
              }

          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "Kinc/Kore checked out at:"
          git -C $kincPath rev-parse HEAD

      # ============================================================
      # 11. LER SHA DA FERRAMENTA WINDOWS
      # ============================================================
      - name: Determine Kinc Windows tools revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DETERMINING KINC WINDOWS TOOL REVISION"
          Write-Host "=========================================="

          $kincPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc"

          $toolsSha = (
              git -C $kincPath ls-tree HEAD Tools/windows_x64
          ).Split("`t")[0].Split(" ")[2]

          if (-not $toolsSha) {
              throw "Unable to determine Tools/windows_x64 gitlink SHA."
          }

          Write-Host ""
          Write-Host "Windows tools SHA:"
          Write-Host $toolsSha

          "KINC_TOOLS_SHA=$toolsSha" >> $env:GITHUB_ENV

      # ============================================================
      # 12. CLONAR KINC TOOLS WINDOWS
      #
      # Só precisamos do submódulo Windows.
      # ============================================================
      - name: Checkout Kinc Windows tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING KINC WINDOWS TOOLS"
          Write-Host "=========================================="

          $toolsPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc\Tools\windows_x64"

          $toolsParent = Split-Path `
              $toolsPath `
              -Parent

          if (-not (Test-Path $toolsParent)) {
              New-Item `
                  -ItemType Directory `
                  -Path $toolsParent `
                  -Force |
                  Out-Null
          }

          if (Test-Path $toolsPath) {
              Remove-Item `
                  $toolsPath `
                  -Recurse `
                  -Force
          }

          git clone `
              --filter=blob:none `
              --no-checkout `
              https://github.com/armory3d/KincTools_windows_x64.git `
              $toolsPath

          Push-Location $toolsPath

          try {

              git cat-file -e "$env:KINC_TOOLS_SHA^{commit}"

              if ($LASTEXITCODE -ne 0) {
                  throw "Required KincTools Windows commit is not available."
              }

              git checkout $env:KINC_TOOLS_SHA

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to checkout KincTools Windows revision."
              }

          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "KincTools revision:"
          git -C $toolsPath rev-parse HEAD

      # ============================================================
      # 13. LER SHA DO V8
      # ============================================================
      - name: Determine exact V8 revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DETERMINING V8 REVISION"
          Write-Host "=========================================="

          $armorcorePath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $v8Sha = (
              git -C $armorcorePath ls-tree HEAD v8
          ).Split("`t")[0].Split(" ")[2]

          if (-not $v8Sha) {
              throw "Unable to determine V8 gitlink SHA."
          }

          Write-Host ""
          Write-Host "V8 SHA:"
          Write-Host $v8Sha

          "V8_SHA=$v8Sha" >> $env:GITHUB_ENV

      # ============================================================
      # 14. CLONAR V8 BIN EXATO
      # ============================================================
      - name: Checkout exact V8 binary revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING V8"
          Write-Host "=========================================="

          $v8Path = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8"

          if (Test-Path $v8Path) {
              Remove-Item `
                  $v8Path `
                  -Recurse `
                  -Force
          }

          git clone `
              --filter=blob:none `
              --no-checkout `
              https://github.com/armory3d/v8_bin.git `
              $v8Path

          Push-Location $v8Path

          try {

              git checkout $env:V8_SHA

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to checkout V8 SHA $env:V8_SHA."
              }

              # O v8_bin pode utilizar Git LFS.
              if (Get-Command git-lfs.exe -ErrorAction SilentlyContinue) {

                  git lfs install --local

                  if ($LASTEXITCODE -ne 0) {
                      throw "git lfs install failed."
                  }

                  git lfs pull

                  if ($LASTEXITCODE -ne 0) {
                      throw "git lfs pull failed."
                  }
              }

          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "V8 revision:"
          git -C $v8Path rev-parse HEAD

      # ============================================================
      # 15. VERIFICAR V8 MONOLITH
      # ============================================================
      - name: Verify V8 monolith archive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING V8 MONOLITH"
          Write-Host "=========================================="

          $archive = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release\v8_monolith.7z"

          if (-not (Test-Path $archive)) {

              Write-Host ""
              Write-Host "Files inside V8 release directory:"

              $releaseDir = Split-Path `
                  $archive `
                  -Parent

              if (Test-Path $releaseDir) {
                  Get-ChildItem `
                      $releaseDir `
                      -Recurse |
                      Select-Object FullName, Length
              }

              throw "v8_monolith.7z was not found."
          }

          $archiveInfo = Get-Item $archive

          Write-Host ""
          Write-Host "Archive:"
          Write-Host $archiveInfo.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($archiveInfo.Length) bytes"

      # ============================================================
      # 16. EXTRAIR V8 MONOLITH
      # ============================================================
      - name: Extract V8 monolith
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "EXTRACTING V8 MONOLITH"
          Write-Host "=========================================="

          $releaseDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release"

          $archive = Join-Path `
              $releaseDir `
              "v8_monolith.7z"

          $lib = Join-Path `
              $releaseDir `
              "v8_monolith.lib"

          if (-not (Test-Path $lib)) {

              & $env:SEVEN_ZIP `
                  x `
                  $archive `
                  "-o$releaseDir" `
                  "-y" `
                  "-aoa"

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to extract v8_monolith.7z."
              }
          }

          if (-not (Test-Path $lib)) {
              throw "v8_monolith.lib was not produced."
          }

          $info = Get-Item $lib

          Write-Host ""
          Write-Host "v8_monolith.lib:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 17. VERIFICAR PATCH
      # ============================================================
      - name: Verify window handling patch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING WINDOW HANDLING PATCH"
          Write-Host "=========================================="

          $patch = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\patch\window_handling.diff"

          if (-not (Test-Path $patch)) {
              throw "window_handling.diff not found."
          }

          Write-Host ""
          Write-Host "Patch:"
          Write-Host $patch

      # ============================================================
      # 18. APLICAR PATCH
      #
      # O patch pertence à mesma geração do ArmorCore/Kinc.
      # ============================================================
      - name: Apply window handling patch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "APPLYING WINDOW HANDLING PATCH"
          Write-Host "=========================================="

          Push-Location `
              (Join-Path $env:GITHUB_WORKSPACE "armorcore")

          try {

              git apply --check `
                  "patch/window_handling.diff" `
                  --directory=Kinc

              if ($LASTEXITCODE -ne 0) {
                  throw "window_handling.diff cannot be applied to the exact Kinc revision."
              }

              git apply `
                  "patch/window_handling.diff" `
                  --directory=Kinc

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to apply window_handling.diff."
              }

          }
          finally {
              Pop-Location
          }

          Write-Host "Patch applied successfully."

      # ============================================================
      # 19. VERIFICAR ESTRUTURA FINAL ANTES DO BUILD
      # ============================================================
      - name: Verify build tree
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING BUILD TREE"
          Write-Host "=========================================="

          $required = @(
              "armorcore",
              "armorcore\Kinc",
              "armorcore\Kinc\make",
              "armorcore\Kinc\Tools\windows_x64",
              "armorcore\v8",
              "armorcore\v8\libraries\win32\release\v8_monolith.lib",
              "armorcore\patch\window_handling.diff",
              "paint"
          )

          foreach ($item in $required) {

              if (-not (Test-Path $item)) {
                  throw "Required build path missing: $item"
              }

              Write-Host "OK: $item"
          }

      # ============================================================
      # 20. GERAR PROJETO ARMORPAINT D3D11
      #
      # Este é o comando histórico:
      #
      # armorcore\Kinc\make --from armorcore -g direct3d11
      #
      # ============================================================
      - name: Generate ArmorPaint D3D11 project
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          echo ==========================================
          echo GENERATING ARMORPAINT D3D11 PROJECT
          echo ==========================================

          armorcore\Kinc\make --from armorcore -g direct3d11

          if errorlevel 1 (
              echo.
              echo ==========================================
              echo KINC MAKE FAILED
              echo ==========================================
              exit /b 1
          )

          echo.
          echo Kinc make completed successfully.

      # ============================================================
      # 21. VERIFICAR SOLUTION GERADA
      #
      # A documentação histórica usa:
      #
      # build\ArmorPaint.sln
      #
      # ============================================================
      - name: Verify generated solution
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING GENERATED SOLUTION"
          Write-Host "=========================================="

          $solution = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\ArmorPaint.sln"

          if (-not (Test-Path $solution)) {

              Write-Host ""
              Write-Host "Expected solution was not found."

              Write-Host ""
              Write-Host "Searching for all Visual Studio solutions..."

              $solutions = Get-ChildItem `
                  -Path $env:GITHUB_WORKSPACE `
                  -Include "*.sln","*.slnx" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue

              if ($solutions) {
                  foreach ($item in $solutions) {
                      Write-Host $item.FullName
                  }
              }

              Write-Host ""
              Write-Host "Build tree:"

              if (Test-Path (Join-Path $env:GITHUB_WORKSPACE "build")) {
                  Get-ChildItem `
                      (Join-Path $env:GITHUB_WORKSPACE "build") `
                      -Recurse |
                      Select-Object FullName
              }

              throw "build\ArmorPaint.sln was not generated."
          }

          Write-Host ""
          Write-Host "Solution found:"
          Write-Host $solution

          "ARMORPAINT_SOLUTION=$solution" >> $env:GITHUB_ENV

      # ============================================================
      # 22. BUILD RELEASE X64
      # ============================================================
      - name: Build ArmorPaint Release x64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILDING ARMORPAINT RELEASE X64"
          Write-Host "=========================================="

          if (-not $env:ARMORPAINT_SOLUTION) {
              throw "ARMORPAINT_SOLUTION is not set."
          }

          Write-Host ""
          Write-Host "Solution:"
          Write-Host $env:ARMORPAINT_SOLUTION

          Write-Host ""
          Write-Host "Configuration: Release"
          Write-Host "Platform: x64"

          & msbuild.exe `
              $env:ARMORPAINT_SOLUTION `
              /m `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "MSBUILD COMPLETED"
          Write-Host "=========================================="

      # ============================================================
      # 23. VERIFICAR EXE
      # ============================================================
      - name: Verify compiled executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING COMPILED EXECUTABLE"
          Write-Host "=========================================="

          $exe = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\x64\Release\ArmorPaint.exe"

          if (-not (Test-Path $exe)) {

              Write-Host ""
              Write-Host "Expected executable not found."

              Write-Host ""
              Write-Host "Searching build directory..."

              Get-ChildItem `
                  (Join-Path $env:GITHUB_WORKSPACE "build") `
                  -Recurse `
                  -File |
                  Select-Object FullName, Length

              throw "build\x64\Release\ArmorPaint.exe was not generated."
          }

          $info = Get-Item $exe

          Write-Host ""
          Write-Host "ArmorPaint.exe:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

          "ARMORPAINT_EXE=$($info.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 24. COPIAR O BUILD COMPLETO PARA build/krom
      #
      # O script histórico copia todo Release para build/krom.
      # ============================================================
      - name: Assemble ArmorPaint portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ASSEMBLING PORTABLE PACKAGE"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $release = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\x64\Release"

          if (-not (Test-Path $release)) {
              throw "Release directory does not exist."
          }

          if (-not (Test-Path $krom)) {
              New-Item `
                  -ItemType Directory `
                  -Path $krom `
                  -Force |
                  Out-Null
          }

          Write-Host ""
          Write-Host "Copying Release files:"
          Write-Host $release

          Copy-Item `
              -Path (Join-Path $release "*") `
              -Destination $krom `
              -Recurse `
              -Force

          # ----------------------------------------------------------
          # Garantir ArmorPaint.exe com o nome correto
          # ----------------------------------------------------------
          $finalExe = Join-Path `
              $krom `
              "ArmorPaint.exe"

          if (-not (Test-Path $finalExe)) {
              Copy-Item `
                  $env:ARMORPAINT_EXE `
                  $finalExe `
                  -Force
          }

          # ----------------------------------------------------------
          # Copiar fonte CJK se existir
          # ----------------------------------------------------------
          $font = Join-Path `
              $env:GITHUB_WORKSPACE `
              "Assets\common\extra\font_cjk.ttc"

          $dataDir = Join-Path `
              $krom `
              "data"

          if (Test-Path $font) {

              if (-not (Test-Path $dataDir)) {
                  New-Item `
                      -ItemType Directory `
                      -Path $dataDir `
                      -Force |
                      Out-Null
              }

              Copy-Item `
                  $font `
                  (Join-Path $dataDir "font_cjk.ttc") `
                  -Force
          }

          if (-not (Test-Path $finalExe)) {
              throw "ArmorPaint.exe was not copied into build\krom."
          }

          Write-Host ""
          Write-Host "Final executable:"
          Write-Host $finalExe

      # ============================================================
      # 25. VERIFICAÇÃO FINAL DO PACOTE
      # ============================================================
      - name: Verify final package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING FINAL PACKAGE"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $exe = Join-Path `
              $krom `
              "ArmorPaint.exe"

          if (-not (Test-Path $krom)) {
              throw "build\krom does not exist."
          }

          if (-not (Test-Path $exe)) {
              throw "ArmorPaint.exe does not exist inside build\krom."
          }

          $files = Get-ChildItem `
              $krom `
              -Recurse `
              -File

          if (-not $files) {
              throw "build\krom is empty."
          }

          $info = Get-Item $exe

          Write-Host ""
          Write-Host "ArmorPaint.exe:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Executable size:"
          Write-Host "$($info.Length) bytes"

          Write-Host ""
          Write-Host "Package file count:"
          Write-Host $files.Count

          Write-Host ""
          Write-Host "Package contents:"

          foreach ($file in $files) {
              $relative = $file.FullName.Substring($krom.Length).TrimStart("\")
              Write-Host "$relative [$($file.Length) bytes]"
          }

      # ============================================================
      # 26. CRIAR ZIP
      # ============================================================
      - name: Create ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING PORTABLE ZIP"
          Write-Host "=========================================="

          $source = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $zip = Join-Path `
              $env:GITHUB_WORKSPACE `
              "ArmorPaint-0.9-23.08-Windows-x64-D3D11.zip"

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          Compress-Archive `
              -Path (Join-Path $source "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "ZIP was not created."
          }

          $info = Get-Item $zip

          Write-Host ""
          Write-Host "ZIP:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "ZIP size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 27. UPLOAD DO DIRETÓRIO
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11
          path: build/krom
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 28. UPLOAD DO ZIP
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11 ZIP
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11-ZIP
          path: ArmorPaint-0.9-23.08-Windows-x64-D3D11.zip
          if-no-files-found: error
          compression-level: 0
