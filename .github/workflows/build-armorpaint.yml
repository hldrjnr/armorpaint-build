name: Build ArmorPaint 0.9 Windows x64 D3D11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ArmorPaint 0.9 - Windows x64 - Direct3D11
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. CHECKOUT DA RELEASE 0.9
      #
      # A release chama-se "0.9-armorpaint", mas a TAG real é 23.08.
      # ============================================================
      - name: Checkout ArmorPaint 0.9
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: 23.08
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 2. MOSTRAR VERSÃO
      # ============================================================
      - name: Show ArmorPaint revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ARMORPAINT REVISION"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Commit:"
          git rev-parse HEAD

          Write-Host ""
          Write-Host "Describe:"
          git describe --tags --always --dirty

          Write-Host ""
          Write-Host "Submodules:"
          git submodule status --recursive

      # ============================================================
      # 3. GARANTIR SUBMÓDULOS
      # ============================================================
      - name: Initialize submodules
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INITIALIZING SUBMODULES"
          Write-Host "=========================================="

          git submodule sync --recursive

          if ($LASTEXITCODE -ne 0) {
              throw "git submodule sync failed."
          }

          git submodule update --init --recursive

          if ($LASTEXITCODE -ne 0) {
              throw "git submodule update failed."
          }

          Write-Host ""
          Write-Host "Submodules after initialization:"
          git submodule status --recursive

      # ============================================================
      # 4. NODE.JS
      #
      # A versão 0.9 usa as ferramentas antigas do ArmorCore/Kinc.
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ============================================================
      # 5. MSBUILD
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 6. MSVC
      # ============================================================
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 7. VERIFICAR FERRAMENTAS
      # ============================================================
      - name: Verify Windows build tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING BUILD TOOLS"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Node:"
          node --version

          Write-Host ""
          Write-Host "npm:"
          npm --version

          Write-Host ""
          Write-Host "MSBuild:"
          msbuild.exe -version

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "Checking 7-Zip..."

          $sevenZipCandidates = @(
              "${env:ProgramFiles}\7-Zip\7z.exe",
              "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          )

          $sevenZip = $null

          foreach ($candidate in $sevenZipCandidates) {
              if (Test-Path $candidate) {
                  $sevenZip = $candidate
                  break
              }
          }

          if (-not $sevenZip) {
              throw "7-Zip was not found on the GitHub runner."
          }

          Write-Host "7-Zip:"
          Write-Host $sevenZip

          "SEVEN_ZIP=$sevenZip" >> $env:GITHUB_ENV

      # ============================================================
      # 8. VERIFICAR ESTRUTURA DO ARMORPAINT 0.9
      # ============================================================
      - name: Verify ArmorPaint 0.9 source tree
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING ARMORPAINT 0.9 SOURCE TREE"
          Write-Host "=========================================="

          $required = @(
              "armorcore",
              "armorcore\Kinc",
              "armorcore\v8",
              "armorcore\v8\libraries\win32\release",
              "armorcore\Kinc\make",
              "paint"
          )

          foreach ($item in $required) {

              if (-not (Test-Path $item)) {
                  throw "Required path not found: $item"
              }

              Write-Host "OK: $item"
          }

      # ============================================================
      # 9. LOCALIZAR V8 MONOLITH
      # ============================================================
      - name: Verify V8 monolith archive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING V8 MONOLITH"
          Write-Host "=========================================="

          $v8Dir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release"

          $v8Archive = Join-Path `
              $v8Dir `
              "v8_monolith.7z"

          if (-not (Test-Path $v8Archive)) {
              throw "v8_monolith.7z not found: $v8Archive"
          }

          Write-Host "Found:"
          Write-Host $v8Archive

      # ============================================================
      # 10. EXTRAIR V8 MONOLITH
      # ============================================================
      - name: Extract V8 monolith
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "EXTRACTING V8 MONOLITH"
          Write-Host "=========================================="

          $v8Dir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release"

          $v8Archive = Join-Path `
              $v8Dir `
              "v8_monolith.7z"

          $v8Lib = Join-Path `
              $v8Dir `
              "v8_monolith.lib"

          if (Test-Path $v8Lib) {
              Write-Host "v8_monolith.lib already exists."
          }
          else {

              Write-Host ""
              Write-Host "Extracting:"
              Write-Host $v8Archive

              & $env:SEVEN_ZIP x `
                  $v8Archive `
                  "-o$v8Dir" `
                  "-y" `
                  "-aoa"

              if ($LASTEXITCODE -ne 0) {
                  throw "7-Zip failed to extract v8_monolith.7z."
              }
          }

          if (-not (Test-Path $v8Lib)) {
              throw "v8_monolith.lib was not created."
          }

          $info = Get-Item $v8Lib

          Write-Host ""
          Write-Host "V8 library:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 11. GERAR BUILD/KROM
      #
      # Este é o fluxo da geração ArmorPaint 0.9.
      #
      # node armorcore/make -g direct3d11
      #
      # O resultado deve gerar o conteúdo inicial de build/krom.
      # ============================================================
      - name: Generate ArmorPaint runtime
        shell: cmd
        run: |
          echo ==========================================
          echo GENERATING ARMORPAINT 0.9 RUNTIME
          echo ==========================================

          node armorcore/make -g direct3d11

          if errorlevel 1 (
              echo.
              echo ARMORCORE MAKE FAILED
              exit /b 1
          )

          echo.
          echo Runtime generation completed.

      # ============================================================
      # 12. VERIFICAR BUILD/KROM
      # ============================================================
      - name: Verify generated runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING GENERATED RUNTIME"
          Write-Host "=========================================="

          $kromDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          if (-not (Test-Path $kromDir)) {
              throw "build\krom was not generated."
          }

          Write-Host ""
          Write-Host "build\krom contents:"

          Get-ChildItem `
              $kromDir `
              -Recurse `
              -File |
              ForEach-Object {
                  $relative = $_.FullName.Substring($kromDir.Length).TrimStart("\")
                  Write-Host "$relative [$($_.Length) bytes]"
              }

      # ============================================================
      # 13. GERAR PROJETO VISUAL STUDIO D3D11
      #
      # Fluxo documentado para a geração 0.9.
      # ============================================================
      - name: Generate Visual Studio project
        shell: cmd
        run: |
          echo ==========================================
          echo GENERATING VISUAL STUDIO PROJECT
          echo ==========================================

          armorcore\Kinc\make --from armorcore -g direct3d11

          if errorlevel 1 (
              echo.
              echo KINC MAKE FAILED
              exit /b 1
          )

          echo.
          echo Visual Studio project generated.

      # ============================================================
      # 14. PROCURAR ARMORPAINT.SLN
      # ============================================================
      - name: Find generated solution
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SEARCHING VISUAL STUDIO SOLUTION"
          Write-Host "=========================================="

          $buildDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build"

          if (-not (Test-Path $buildDir)) {
              throw "build directory was not generated."
          }

          $solutions = Get-ChildItem `
              -Path $buildDir `
              -Include "*.sln","*.slnx" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

          if (-not $solutions) {
              Write-Host ""
              Write-Host "Files inside build:"
              Get-ChildItem `
                  $buildDir `
                  -Recurse |
                  Select-Object FullName

              throw "No Visual Studio solution was generated."
          }

          Write-Host ""
          Write-Host "Found solution(s):"

          foreach ($solution in $solutions) {
              Write-Host $solution.FullName
          }

          $selected = $solutions |
              Where-Object {
                  $_.Name -eq "ArmorPaint.sln"
              } |
              Select-Object -First 1

          if (-not $selected) {
              $selected = $solutions |
                  Where-Object {
                      $_.Name -eq "Krom.sln"
                  } |
                  Select-Object -First 1
          }

          if (-not $selected) {
              $selected = $solutions |
                  Select-Object -First 1
          }

          Write-Host ""
          Write-Host "Selected solution:"
          Write-Host $selected.FullName

          "ARMORPAINT_SOLUTION=$($selected.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 15. COMPILAR RELEASE X64
      # ============================================================
      - name: Build Release x64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILDING RELEASE X64"
          Write-Host "=========================================="

          if (-not $env:ARMORPAINT_SOLUTION) {
              throw "ARMORPAINT_SOLUTION is not set."
          }

          Write-Host ""
          Write-Host "Solution:"
          Write-Host $env:ARMORPAINT_SOLUTION

          Write-Host ""
          Write-Host "Configuration: Release"
          Write-Host "Platform: x64"

          & msbuild.exe `
              $env:ARMORPAINT_SOLUTION `
              /m `
              /property:Configuration=Release `
              /property:Platform=x64 `
              /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "MSBUILD COMPLETED SUCCESSFULLY"
          Write-Host "=========================================="

      # ============================================================
      # 16. LOCALIZAR EXECUTÁVEL
      #
      # A geração antiga normalmente produz:
      #
      # build/x64/Release/ArmorPaint.exe
      #
      # Alguns estados da árvore usam Krom.exe.
      # ============================================================
      - name: Find compiled executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SEARCHING COMPILED EXECUTABLE"
          Write-Host "=========================================="

          $buildDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build"

          $candidates = Get-ChildItem `
              -Path $buildDir `
              -Include "ArmorPaint.exe","Krom.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

          if (-not $candidates) {
              Write-Host ""
              Write-Host "Build directory contents:"
              Get-ChildItem `
                  $buildDir `
                  -Recurse |
                  Select-Object FullName

              throw "No ArmorPaint.exe or Krom.exe was found."
          }

          Write-Host ""
          Write-Host "Executable candidates:"

          foreach ($candidate in $candidates) {
              Write-Host "$($candidate.FullName) [$($candidate.Length) bytes]"
          }

          $selected = $candidates |
              Where-Object {
                  $_.Name -eq "ArmorPaint.exe"
              } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

          if (-not $selected) {
              $selected = $candidates |
                  Where-Object {
                      $_.Name -eq "Krom.exe"
                  } |
                  Sort-Object FullName -Descending |
                  Select-Object -First 1
          }

          if (-not $selected) {
              throw "Unable to select compiled executable."
          }

          Write-Host ""
          Write-Host "Selected executable:"
          Write-Host $selected.FullName

          "COMPILED_EXE=$($selected.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 17. COPIAR EXECUTÁVEL PARA BUILD/KROM
      # ============================================================
      - name: Assemble portable runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ASSEMBLING PORTABLE RUNTIME"
          Write-Host "=========================================="

          $kromDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          if (-not (Test-Path $kromDir)) {
              throw "build\krom does not exist."
          }

          if (-not (Test-Path $env:COMPILED_EXE)) {
              throw "Compiled executable does not exist."
          }

          $releaseDir = Split-Path `
              $env:COMPILED_EXE `
              -Parent

          Write-Host ""
          Write-Host "Release directory:"
          Write-Host $releaseDir

          Write-Host ""
          Write-Host "Copying Release files to build/krom..."

          Copy-Item `
              -Path (Join-Path $releaseDir "*") `
              -Destination $kromDir `
              -Recurse `
              -Force

          # ----------------------------------------------------------
          # Garantir ArmorPaint.exe
          # ----------------------------------------------------------
          $armorPaintExe = Join-Path `
              $kromDir `
              "ArmorPaint.exe"

          $kromExe = Join-Path `
              $kromDir `
              "Krom.exe"

          if (-not (Test-Path $armorPaintExe)) {

              if (Test-Path $kromExe) {

                  Write-Host ""
                  Write-Host "Renaming Krom.exe -> ArmorPaint.exe"

                  Copy-Item `
                      $kromExe `
                      $armorPaintExe `
                      -Force
              }
          }

          if (-not (Test-Path $armorPaintExe)) {
              throw "ArmorPaint.exe was not found in build/krom."
          }

          Write-Host ""
          Write-Host "Final executable:"
          Write-Host $armorPaintExe

          Write-Host ""
          Write-Host "Portable runtime contents:"

          Get-ChildItem `
              $kromDir `
              -Recurse `
              -File |
              ForEach-Object {
                  $relative = $_.FullName.Substring($kromDir.Length).TrimStart("\")
                  Write-Host "$relative [$($_.Length) bytes]"
              }

      # ============================================================
      # 18. VERIFICAÇÃO FINAL
      # ============================================================
      - name: Verify final package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING FINAL PACKAGE"
          Write-Host "=========================================="

          $kromDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $exe = Join-Path `
              $kromDir `
              "ArmorPaint.exe"

          if (-not (Test-Path $exe)) {
              throw "Final ArmorPaint.exe does not exist."
          }

          $info = Get-Item $exe

          Write-Host ""
          Write-Host "ArmorPaint.exe:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

          $files = Get-ChildItem `
              $kromDir `
              -Recurse `
              -File

          Write-Host ""
          Write-Host "Total files:"
          Write-Host $files.Count

          if ($files.Count -eq 0) {
              throw "Portable package is empty."
          }

      # ============================================================
      # 19. CRIAR ZIP
      # ============================================================
      - name: Create ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING ZIP"
          Write-Host "=========================================="

          $source = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $zip = Join-Path `
              $env:GITHUB_WORKSPACE `
              "ArmorPaint-0.9-Windows-x64-D3D11.zip"

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          Compress-Archive `
              -Path (Join-Path $source "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "ZIP was not created."
          }

          $zipInfo = Get-Item $zip

          Write-Host ""
          Write-Host "ZIP:"
          Write-Host $zipInfo.FullName

          Write-Host ""
          Write-Host "ZIP size:"
          Write-Host "$($zipInfo.Length) bytes"

      # ============================================================
      # 20. UPLOAD DO DIRETÓRIO PORTÁTIL
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-0.9-Windows-x64-D3D11
          path: build/krom
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 21. UPLOAD DO ZIP
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-0.9-Windows-x64-D3D11-ZIP
          path: ArmorPaint-0.9-Windows-x64-D3D11.zip
          if-no-files-found: error
          compression-level: 0
