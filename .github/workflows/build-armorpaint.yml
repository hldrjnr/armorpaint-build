name: Build ArmorPaint for Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout ArmorPaint
        uses: actions/checkout@v5
        with:
          repository: armory3d/armorpaint
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check environment
        shell: pwsh
        run: |
          Write-Host "=== MSBuild ==="
          msbuild -version

          Write-Host "=== Clang ==="
          clang-cl --version

          Write-Host "=== Node ==="
          node --version

          Write-Host "=== Git ==="
          git --version

      - name: Generate ArmorPaint Visual Studio project
        shell: cmd
        working-directory: paint
        run: |
          call ..\base\make.bat

      - name: Verify generated project
        shell: pwsh
        working-directory: paint
        run: |
          Write-Host "=== Build directory ==="

          if (Test-Path "build") {
            Get-ChildItem "build" -Recurse -File |
              Select-Object FullName
          }

          $sln = Get-ChildItem "build" -Recurse -Filter "ArmorPaint.sln" -File |
            Select-Object -First 1

          if (-not $sln) {
            throw "ArmorPaint.sln was not generated."
          }

          Write-Host "Found solution:"
          Write-Host $sln.FullName

          "ARMORPAINT_SLN=$($sln.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build ArmorPaint Release x64
        shell: pwsh
        working-directory: paint
        run: |
          Write-Host "Building:"
          Write-Host $env:ARMORPAINT_SLN

          msbuild "$env:ARMORPAINT_SLN" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

      - name: Find ArmorPaint.exe
        shell: pwsh
        working-directory: paint
        run: |
          Write-Host "Searching for ArmorPaint.exe..."

          $exe = Get-ChildItem "build" -Recurse -Filter "ArmorPaint.exe" -File |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "=== Build contents ==="
            Get-ChildItem "build" -Recurse -File |
              Select-Object FullName, Length

            throw "ArmorPaint.exe was not found."
          }

          Write-Host "Found:"
          Write-Host $exe.FullName

          "ARMORPAINT_EXE=$($exe.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare portable package
        shell: pwsh
        working-directory: paint
        run: |
          $exe = Get-Item $env:ARMORPAINT_EXE

          $package = Join-Path `
            $env:GITHUB_WORKSPACE `
            "ArmorPaint-Windows-x64"

          if (Test-Path $package) {
            Remove-Item $package -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $package | Out-Null

          Write-Host "Copying executable..."

          Copy-Item `
            $exe.FullName `
            (Join-Path $package "ArmorPaint.exe") `
            -Force

          Write-Host "Searching for required DLLs..."

          Get-ChildItem `
            $exe.Directory.FullName `
            -Filter "*.dll" `
            -File `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Copy-Item `
                $_.FullName `
                $package `
                -Force
            }

          Write-Host "Searching for runtime/data files..."

          $possibleDirs = @(
            (Join-Path $exe.Directory.FullName "data"),
            (Join-Path $exe.Directory.FullName "krom"),
            (Join-Path $exe.Directory.FullName "assets")
          )

          foreach ($dir in $possibleDirs) {
            if (Test-Path $dir) {
              Copy-Item `
                $dir `
                $package `
                -Recurse `
                -Force
            }
          }

          $info = @"
          ArmorPaint Windows x64
          Built from:
          https://github.com/armory3d/armorpaint

          Configuration: Release
          Platform: x64

          This is a self-built development build.
          "@

          Set-Content `
            -Path (Join-Path $package "BUILD-INFO.txt") `
            -Value $info

          Write-Host "=== Final package ==="

          Get-ChildItem `
            $package `
            -Recurse |
            Select-Object FullName, Length

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\ArmorPaint-Windows-x64.zip" `
            -Force

      - name: Upload ArmorPaint build
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: ArmorPaint-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
