name: Build ArmorPaint 0.9 Windows x64 D3D11

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # GitHub Actions passou o runtime interno das actions para Node 24.
  # O ArmorPaint 0.9 continua usando Node 20 para as ferramentas do build.
  ACTIONS_ALLOW_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: ArmorPaint 0.9 - Windows x64 - Direct3D11
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. CHECKOUT DO ARMORPAINT 23.08
      #
      # NÃO usar submodules: recursive.
      # Os submódulos históricos da versão 0.9 apontam para
      # repositórios que já não existem nos URLs originais.
      # ============================================================
      - name: Checkout ArmorPaint 23.08
        uses: actions/checkout@v5
        with:
          repository: armory3d/armorpaint
          ref: 23.08
          fetch-depth: 1
          submodules: false

      # ============================================================
      # 2. SETUP NODE
      # ============================================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      # ============================================================
      # 3. SETUP MSBUILD
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 4. SETUP MSVC
      # ============================================================
      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 5. MOSTRAR VERSÃO
      # ============================================================
      - name: Show versions
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERSIONS"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Node:"
          node --version

          Write-Host ""
          Write-Host "npm:"
          npm --version

          Write-Host ""
          Write-Host "MSBuild:"
          msbuild.exe -version

          Write-Host ""
          Write-Host "ArmorPaint commit:"
          git rev-parse HEAD

          Write-Host ""
          Write-Host "ArmorPaint tag:"
          git describe --tags --always

      # ============================================================
      # 6. INICIALIZAR ARMORCORE
      #
      # O submodule direto armorcore ainda existe.
      # ============================================================
      - name: Checkout ArmorCore submodule
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING ARMORCORE SUBMODULE"
          Write-Host "=========================================="

          $armorcoreUrl = "https://github.com/armory3d/armorcore.git"
          $armorcorePath = Join-Path $env:GITHUB_WORKSPACE "armorcore"

          $armorcoreSha = (
              git ls-tree HEAD armorcore
          ).Split("`t")[0].Split(" ")[2]

          if (-not $armorcoreSha) {
              throw "Could not determine ArmorCore gitlink SHA."
          }

          Write-Host "ArmorCore SHA from ArmorPaint:"
          Write-Host $armorcoreSha

          git clone `
              --no-checkout `
              $armorcoreUrl `
              $armorcorePath

          Push-Location $armorcorePath

          try {
              git checkout $armorcoreSha

              if ($LASTEXITCODE -ne 0) {
                  throw "Could not checkout ArmorCore SHA $armorcoreSha."
              }
          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "ArmorCore:"
          git -C $armorcorePath rev-parse HEAD

      # ============================================================
      # 7. LER SHAs DOS SUBMÓDULOS ANTIGOS
      #
      # Pegamos os SHAs do próprio commit do ArmorCore.
      # ============================================================
      - name: Determine legacy submodule revisions
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $armorcore = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          Write-Host "=========================================="
          Write-Host "DETERMINING SUBMODULE REVISIONS"
          Write-Host "=========================================="

          $kincSha = (
              git -C $armorcore ls-tree HEAD Kinc
          ).Split("`t")[0].Split(" ")[2]

          $v8Sha = (
              git -C $armorcore ls-tree HEAD v8
          ).Split("`t")[0].Split(" ")[2]

          Write-Host ""
          Write-Host "Kinc SHA:"
          Write-Host $kincSha

          Write-Host ""
          Write-Host "V8 SHA:"
          Write-Host $v8Sha

          if (-not $kincSha) {
              throw "Could not determine Kinc SHA."
          }

          if (-not $v8Sha) {
              throw "Could not determine V8 SHA."
          }

          "KINC_SHA=$kincSha" >> $env:GITHUB_ENV
          "V8_SHA=$v8Sha" >> $env:GITHUB_ENV

      # ============================================================
      # 8. INSTALAR KINC
      #
      # O URL histórico armory3d/Kinc está morto.
      #
      # Foundry3D/Kinc continua acessível e mantém suporte a
      # Direct3D11.
      #
      # Primeiro tentamos exatamente o SHA que o ArmorCore espera.
      # Se a cópia moderna não tiver esse commit, usamos main.
      # ============================================================
      - name: Install Kinc for legacy ArmorCore
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INSTALLING KINC"
          Write-Host "=========================================="

          $armorcore = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $kinc = Join-Path `
              $armorcore `
              "Kinc"

          if (Test-Path $kinc) {
              Remove-Item `
                  $kinc `
                  -Recurse `
                  -Force
          }

          git clone `
              --no-checkout `
              https://github.com/Foundry3D/Kinc.git `
              $kinc

          Push-Location $kinc

          try {

              Write-Host ""
              Write-Host "Trying ArmorCore-recorded Kinc revision:"
              Write-Host $env:KINC_SHA

              git fetch `
                  --all `
                  --tags `
                  --prune `
                  --force

              git cat-file -e "$env:KINC_SHA^{commit}" 2>$null

              if ($LASTEXITCODE -eq 0) {

                  git checkout $env:KINC_SHA

                  if ($LASTEXITCODE -ne 0) {
                      throw "Failed to checkout the recorded Kinc revision."
                  }

                  Write-Host ""
                  Write-Host "Exact Kinc revision found."
              }
              else {

                  Write-Warning "The recorded Kinc revision is not present in Foundry3D/Kinc."
                  Write-Warning "Using Foundry3D/Kinc main as compatibility fallback."

                  git checkout main

                  if ($LASTEXITCODE -ne 0) {
                      throw "Could not checkout Kinc main."
                  }
              }

          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "Kinc revision in use:"
          git -C $kinc rev-parse HEAD

      # ============================================================
      # 9. INICIALIZAR KINC TOOLS
      #
      # A cópia atual do Kinc usa KincTools da organização Kode.
      # ============================================================
      - name: Initialize Kinc tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INITIALIZING KINC TOOLS"
          Write-Host "=========================================="

          $kinc = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc"

          Push-Location $kinc

          try {

              git submodule sync --recursive

              if ($LASTEXITCODE -ne 0) {
                  throw "Kinc submodule sync failed."
              }

              git submodule update `
                  --init `
                  --recursive

              if ($LASTEXITCODE -ne 0) {
                  throw "Kinc tools initialization failed."
              }

          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "Kinc tools status:"
          git -C $kinc submodule status --recursive

      # ============================================================
      # 10. INSTALAR V8
      #
      # v8_bin ainda existe como repositório arquivado.
      # ============================================================
      - name: Install V8 binary repository
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INSTALLING V8"
          Write-Host "=========================================="

          $armorcore = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $v8 = Join-Path `
              $armorcore `
              "v8"

          if (Test-Path $v8) {
              Remove-Item `
                  $v8 `
                  -Recurse `
                  -Force
          }

          git clone `
              --no-checkout `
              https://github.com/armory3d/v8_bin.git `
              $v8

          Push-Location $v8

          try {

              git fetch `
                  --all `
                  --tags `
                  --prune `
                  --force

              git cat-file -e "$env:V8_SHA^{commit}" 2>$null

              if ($LASTEXITCODE -ne 0) {
                  throw "The exact V8 revision required by ArmorCore is not present in armory3d/v8_bin."
              }

              git checkout $env:V8_SHA

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to checkout V8 revision."
              }

          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "V8 revision:"
          git -C $v8 rev-parse HEAD

      # ============================================================
      # 11. VERIFICAR ARQUIVO V8 MONOLITH
      # ============================================================
      - name: Verify V8 monolith
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING V8 MONOLITH"
          Write-Host "=========================================="

          $v8Archive = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release\v8_monolith.7z"

          if (-not (Test-Path $v8Archive)) {
              Write-Host ""
              Write-Host "Files in V8 release directory:"

              $release = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "armorcore\v8\libraries\win32\release"

              if (Test-Path $release) {
                  Get-ChildItem $release -Recurse |
                      Select-Object FullName, Length
              }

              throw "v8_monolith.7z was not found."
          }

          Write-Host ""
          Write-Host "Found:"
          Write-Host $v8Archive

      # ============================================================
      # 12. LOCALIZAR 7-ZIP
      # ============================================================
      - name: Locate 7-Zip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $candidates = @(
              "${env:ProgramFiles}\7-Zip\7z.exe",
              "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          )

          $sevenZip = $null

          foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                  $sevenZip = $candidate
                  break
              }
          }

          if (-not $sevenZip) {
              throw "7-Zip was not found on the GitHub runner."
          }

          Write-Host "7-Zip:"
          Write-Host $sevenZip

          "SEVEN_ZIP=$sevenZip" >> $env:GITHUB_ENV

      # ============================================================
      # 13. EXTRAIR V8
      # ============================================================
      - name: Extract V8 monolith
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "EXTRACTING V8 MONOLITH"
          Write-Host "=========================================="

          $v8Dir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release"

          $archive = Join-Path `
              $v8Dir `
              "v8_monolith.7z"

          Write-Host "Archive:"
          Write-Host $archive

          & $env:SEVEN_ZIP x `
              $archive `
              "-o$v8Dir" `
              "-y" `
              "-aoa"

          if ($LASTEXITCODE -ne 0) {
              throw "7-Zip failed extracting V8."
          }

          $lib = Join-Path `
              $v8Dir `
              "v8_monolith.lib"

          if (-not (Test-Path $lib)) {
              throw "v8_monolith.lib was not extracted."
          }

          $info = Get-Item $lib

          Write-Host ""
          Write-Host "V8 library:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 14. VERIFICAR ARMORCORE MAKE
      # ============================================================
      - name: Verify ArmorCore build tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING BUILD TOOLS"
          Write-Host "=========================================="

          $required = @(
              "armorcore\make",
              "armorcore\make.js",
              "armorcore\kfile.js",
              "armorcore\Kinc\make",
              "armorcore\v8\include",
              "armorcore\v8\libraries\win32\release\v8_monolith.lib"
          )

          foreach ($item in $required) {

              if (-not (Test-Path $item)) {
                  throw "Missing required path: $item"
              }

              Write-Host "OK: $item"
          }

      # ============================================================
      # 15. GERAR RUNTIME / KROM
      #
      # ESTA é a chamada histórica da geração D3D11.
      # ============================================================
      - name: Generate ArmorPaint runtime D3D11
        shell: cmd
        run: |
          echo ==========================================
          echo GENERATING ARMORPAINT RUNTIME
          echo ==========================================

          armorcore\Kinc\make --from armorcore -g direct3d11

          if errorlevel 1 (
              echo.
              echo ==========================================
              echo KINC MAKE FAILED
              echo ==========================================
              exit /b 1
          )

          echo.
          echo Runtime generation completed.

      # ============================================================
      # 16. VERIFICAR BUILD/KROM
      # ============================================================
      - name: Verify generated runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING GENERATED RUNTIME"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          if (-not (Test-Path $krom)) {
              Write-Host ""
              Write-Host "Workspace build directories:"

              Get-ChildItem `
                  $env:GITHUB_WORKSPACE `
                  -Directory `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Where-Object {
                      $_.Name -match "build|krom"
                  } |
                  Select-Object FullName

              throw "build\krom was not generated."
          }

          Write-Host ""
          Write-Host "build/krom:"
          Get-ChildItem `
              $krom `
              -Recurse `
              -File |
              Select-Object FullName, Length

      # ============================================================
      # 17. PROCURAR SOLUTION
      # ============================================================
      - name: Find generated Visual Studio solution
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SEARCHING VISUAL STUDIO SOLUTION"
          Write-Host "=========================================="

          $build = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build"

          $solutions = Get-ChildItem `
              $build `
              -Include "*.sln","*.slnx" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

          if (-not $solutions) {

              Write-Host ""
              Write-Host "No solution found."
              Write-Host ""
              Write-Host "Build directory contents:"

              Get-ChildItem `
                  $build `
                  -Recurse |
                  Select-Object FullName

              throw "Visual Studio solution was not generated."
          }

          Write-Host ""
          Write-Host "Solutions:"

          foreach ($solution in $solutions) {
              Write-Host $solution.FullName
          }

          $selected = $solutions |
              Where-Object {
                  $_.Name -eq "ArmorPaint.sln"
              } |
              Select-Object -First 1

          if (-not $selected) {
              $selected = $solutions |
                  Where-Object {
                      $_.Name -eq "Krom.sln"
                  } |
                  Select-Object -First 1
          }

          if (-not $selected) {
              $selected = $solutions |
                  Select-Object -First 1
          }

          Write-Host ""
          Write-Host "Selected:"
          Write-Host $selected.FullName

          "ARMORPAINT_SOLUTION=$($selected.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 18. COMPILAR RELEASE X64
      # ============================================================
      - name: Build ArmorPaint Release x64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILDING RELEASE X64"
          Write-Host "=========================================="

          & msbuild.exe `
              $env:ARMORPAINT_SOLUTION `
              /m `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE."
          }

          Write-Host ""
          Write-Host "MSBuild completed successfully."

      # ============================================================
      # 19. PROCURAR ARMORPAINT.EXE
      # ============================================================
      - name: Find compiled ArmorPaint executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SEARCHING ARMORPAINT.EXE"
          Write-Host "=========================================="

          $build = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build"

          $executables = Get-ChildItem `
              $build `
              -Filter "ArmorPaint.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

          if (-not $executables) {

              Write-Host ""
              Write-Host "Searching for Krom.exe..."

              $executables = Get-ChildItem `
                  $build `
                  -Filter "Krom.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue
          }

          if (-not $executables) {

              Write-Host ""
              Write-Host "Build contents:"
              
              Get-ChildItem `
                  $build `
                  -Recurse |
                  Select-Object FullName

              throw "No compiled executable was found."
          }

          Write-Host ""
          Write-Host "Executable candidates:"

          foreach ($exe in $executables) {
              Write-Host "$($exe.FullName) [$($exe.Length) bytes]"
          }

          $selected = $executables |
              Where-Object {
                  $_.Name -eq "ArmorPaint.exe"
              } |
              Select-Object -First 1

          if (-not $selected) {
              $selected = $executables |
                  Select-Object -First 1
          }

          Write-Host ""
          Write-Host "Selected executable:"
          Write-Host $selected.FullName

          "COMPILED_EXE=$($selected.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 20. COPIAR EXE PARA BUILD/KROM
      # ============================================================
      - name: Assemble portable ArmorPaint package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ASSEMBLING PORTABLE PACKAGE"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          if (-not (Test-Path $krom)) {
              throw "build\krom does not exist."
          }

          $releaseDir = Split-Path `
              $env:COMPILED_EXE `
              -Parent

          Write-Host "Compiled executable:"
          Write-Host $env:COMPILED_EXE

          Write-Host ""
          Write-Host "Release directory:"
          Write-Host $releaseDir

          # Copiar DLLs e restantes arquivos gerados pelo MSBuild.
          Copy-Item `
              -Path (Join-Path $releaseDir "*") `
              -Destination $krom `
              -Recurse `
              -Force

          $armorPaint = Join-Path `
              $krom `
              "ArmorPaint.exe"

          if (-not (Test-Path $armorPaint)) {

              $sourceName = Split-Path `
                  $env:COMPILED_EXE `
                  -Leaf

              $copiedSource = Join-Path `
                  $krom `
                  $sourceName

              if (-not (Test-Path $copiedSource)) {
                  throw "Compiled executable was not copied to build/krom."
              }

              Copy-Item `
                  $copiedSource `
                  $armorPaint `
                  -Force
          }

          if (-not (Test-Path $armorPaint)) {
              throw "ArmorPaint.exe is missing from final package."
          }

          Write-Host ""
          Write-Host "Final ArmorPaint executable:"
          Write-Host $armorPaint

      # ============================================================
      # 21. ZIP
      # ============================================================
      - name: Create portable ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING PORTABLE ZIP"
          Write-Host "=========================================="

          $source = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $zip = Join-Path `
              $env:GITHUB_WORKSPACE `
              "ArmorPaint-0.9-23.08-Windows-x64-D3D11.zip"

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          Compress-Archive `
              -Path (Join-Path $source "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "ZIP was not created."
          }

          $info = Get-Item $zip

          Write-Host ""
          Write-Host "ZIP:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "ZIP size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 22. UPLOAD DIRETÓRIO
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11
          path: build/krom
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 23. UPLOAD ZIP
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11 ZIP
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11-ZIP
          path: ArmorPaint-0.9-23.08-Windows-x64-D3D11.zip
          if-no-files-found: error
          compression-level: 0
