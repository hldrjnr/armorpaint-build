name: Build ArmorPaint 0.9 Windows x64 D3D11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ArmorPaint 0.9 - Windows x64 - Direct3D11
    runs-on: windows-latest

    steps:
      # ============================================================
      # 1. CHECKOUT DA VERSÃO 0.9
      # ============================================================
      - name: Checkout ArmorPaint 0.9
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: 0.9-armorpaint
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 2. VERIFICAR VERSÃO CHECKOUTADA
      # ============================================================
      - name: Show ArmorPaint revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ARMORPAINT VERSION"
          Write-Host "=========================================="

          git describe --tags --always --dirty

          Write-Host ""
          Write-Host "Commit:"
          git rev-parse HEAD

          Write-Host ""
          Write-Host "Submodules:"
          git submodule status --recursive

      # ============================================================
      # 3. GARANTIR SUBMÓDULOS
      # ============================================================
      - name: Initialize submodules
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INITIALIZING SUBMODULES"
          Write-Host "=========================================="

          git submodule sync --recursive

          if ($LASTEXITCODE -ne 0) {
              throw "git submodule sync failed."
          }

          git submodule update --init --recursive

          if ($LASTEXITCODE -ne 0) {
              throw "git submodule update failed."
          }

          Write-Host ""
          git submodule status --recursive

      # ============================================================
      # 4. NODE.JS
      #
      # A árvore 0.9 é antiga; Node 16 é uma escolha mais conservadora
      # do que Node 20/22 para as ferramentas daquela época.
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16"

      # ============================================================
      # 5. MSBUILD
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 6. MSVC ENVIRONMENT
      # ============================================================
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 7. VERIFICAR VISUAL STUDIO / CLANG
      # ============================================================
      - name: Verify Visual Studio toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING VISUAL STUDIO"
          Write-Host "=========================================="

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
              throw "vswhere.exe not found."
          }

          $vsInstall = & $vswhere `
              -latest `
              -products "*" `
              -property installationPath

          if (-not $vsInstall) {
              throw "Visual Studio installation not found."
          }

          Write-Host "Visual Studio:"
          Write-Host $vsInstall

          Write-Host ""
          Write-Host "MSBuild:"
          Get-Command msbuild.exe |
              Select-Object Source

          Write-Host ""
          Write-Host "Clang:"
          Get-Command clang-cl.exe -ErrorAction SilentlyContinue |
              Select-Object Source

      # ============================================================
      # 8. VERIFICAR ESTRUTURA DA VERSÃO 0.9
      # ============================================================
      - name: Verify ArmorPaint 0.9 source tree
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING SOURCE TREE"
          Write-Host "=========================================="

          $required = @(
              "armorcore",
              "armorcore\Kinc",
              "armorcore\v8",
              "armorcore\v8\libraries\win32\release",
              "armorcore\Kinc\make",
              "armorcore\make",
              "paint"
          )

          foreach ($item in $required) {
              if (-not (Test-Path $item)) {
                  throw "Required path not found: $item"
              }

              Write-Host "OK: $item"
          }

      # ============================================================
      # 9. VERIFICAR 7-ZIP
      # ============================================================
      - name: Ensure 7-Zip is available
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING 7-ZIP"
          Write-Host "=========================================="

          $sevenZip = $null

          $candidates = @(
              "${env:ProgramFiles}\7-Zip\7z.exe",
              "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          )

          foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                  $sevenZip = $candidate
                  break
              }
          }

          if (-not $sevenZip) {
              Write-Host "7-Zip not found. Installing with Chocolatey..."

              choco install 7zip -y --no-progress

              foreach ($candidate in $candidates) {
                  if (Test-Path $candidate) {
                      $sevenZip = $candidate
                      break
                  }
              }
          }

          if (-not $sevenZip) {
              throw "7-Zip could not be located."
          }

          Write-Host "7-Zip:"
          Write-Host $sevenZip

          & $sevenZip i |
              Select-Object -First 5

          "SEVEN_ZIP=$sevenZip" >> $env:GITHUB_ENV

      # ============================================================
      # 10. VERIFICAR V8 MONOLITH
      # ============================================================
      - name: Verify V8 monolith package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING V8 MONOLITH"
          Write-Host "=========================================="

          $v8Archive = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release\v8_monolith.7z"

          $v8Directory = Split-Path $v8Archive -Parent

          if (-not (Test-Path $v8Archive)) {
              throw "v8_monolith.7z not found: $v8Archive"
          }

          Write-Host "Archive:"
          Write-Host $v8Archive

          $existingLib = Join-Path `
              $v8Directory `
              "v8_monolith.lib"

          if (Test-Path $existingLib) {
              Write-Host ""
              Write-Host "v8_monolith.lib already exists."
          }
          else {
              Write-Host ""
              Write-Host "Extracting v8_monolith.7z..."

              & $env:SEVEN_ZIP x `
                  $v8Archive `
                  "-o$v8Directory" `
                  -y `
                  -aoa

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to extract v8_monolith.7z."
              }
          }

          if (-not (Test-Path $existingLib)) {
              throw "v8_monolith.lib was not extracted."
          }

          $libInfo = Get-Item $existingLib

          Write-Host ""
          Write-Host "V8 library:"
          Write-Host $libInfo.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($libInfo.Length) bytes"

      # ============================================================
      # 11. GERAR OS ASSETS / KROM
      #
      # Este é o primeiro make da arquitetura antiga.
      # ============================================================
      - name: Generate ArmorPaint 0.9 runtime
        shell: cmd
        run: |
          echo ==========================================
          echo GENERATING ARMORPAINT 0.9 RUNTIME
          echo ==========================================

          node armorcore/make -g direct3d11

          if errorlevel 1 (
            echo.
            echo ArmorPaint runtime generation failed.
            exit /b 1
          )

          echo.
          echo Runtime generation completed.

      # ============================================================
      # 12. APLICAR WINDOW HANDLING PATCH
      #
      # Se já estiver aplicado, não aplicamos novamente.
      # ============================================================
      - name: Apply window handling patch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "WINDOW HANDLING PATCH"
          Write-Host "=========================================="

          $patch = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\patch\window_handling.diff"

          if (-not (Test-Path $patch)) {
              Write-Warning "window_handling.diff not found."
              Write-Warning "Continuing without patch."
              exit 0
          }

          Write-Host "Patch:"
          Write-Host $patch

          # Verificar se ainda pode ser aplicado.
          git apply --check $patch --directory=armorcore/Kinc

          if ($LASTEXITCODE -eq 0) {
              Write-Host ""
              Write-Host "Patch is applicable. Applying..."

              git apply $patch --directory=armorcore/Kinc

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to apply window handling patch."
              }

              Write-Host "Patch applied."
              exit 0
          }

          # Se não pode ser aplicado, verificar se já está aplicado.
          git apply --reverse --check $patch --directory=armorcore/Kinc

          if ($LASTEXITCODE -eq 0) {
              Write-Host ""
              Write-Host "Patch already appears to be applied."
              exit 0
          }

          throw "window_handling.diff cannot be applied and does not appear to already be applied."

      # ============================================================
      # 13. GERAR PROJETO VISUAL STUDIO D3D11
      #
      # --from armorcore faz o Kinc gerar o projeto ArmorPaint.
      # ============================================================
      - name: Generate Visual Studio project
        shell: cmd
        run: |
          echo ==========================================
          echo GENERATING VISUAL STUDIO PROJECT
          echo ==========================================

          node armorcore/Kinc/make --from armorcore -g direct3d11

          if errorlevel 1 (
            echo.
            echo Visual Studio project generation failed.
            exit /b 1
          )

          echo.
          echo Visual Studio project generated.

      # ============================================================
      # 14. LOCALIZAR SOLUTION
      # ============================================================
      - name: Verify generated solution
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SEARCHING GENERATED SOLUTION"
          Write-Host "=========================================="

          $possibleSolutions = @(
              "build\ArmorPaint.sln",
              "build\Krom.sln",
              "build\ArmorPaint.slnx",
              "armorcore\build\Krom.sln",
              "armorcore\build\ArmorPaint.sln"
          )

          $found = @()

          foreach ($path in $possibleSolutions) {
              $full = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  $path

              if (Test-Path $full) {
                  $found += Get-Item $full
                  Write-Host "FOUND: $full"
              }
          }

          if ($found.Count -eq 0) {
              Write-Host ""
              Write-Host "Searching all solution files..."

              $found = Get-ChildItem `
                  -Path $env:GITHUB_WORKSPACE `
                  -Include "*.sln","*.slnx" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue
          }

          if ($found.Count -eq 0) {
              throw "No Visual Studio solution was generated."
          }

          Write-Host ""
          Write-Host "Solutions found:"

          foreach ($solution in $found) {
              Write-Host $solution.FullName
          }

          $selected = $found |
              Where-Object {
                  $_.Name -eq "ArmorPaint.sln"
              } |
              Select-Object -First 1

          if (-not $selected) {
              $selected = $found |
                  Where-Object {
                      $_.Name -eq "Krom.sln"
                  } |
                  Select-Object -First 1
          }

          if (-not $selected) {
              $selected = $found | Select-Object -First 1
          }

          Write-Host ""
          Write-Host "Selected solution:"
          Write-Host $selected.FullName

          "ARMORPAINT_SOLUTION=$($selected.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 15. BUILD RELEASE X64
      # ============================================================
      - name: Build Release x64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILDING RELEASE X64"
          Write-Host "=========================================="

          if (-not $env:ARMORPAINT_SOLUTION) {
              throw "ARMORPAINT_SOLUTION is not defined."
          }

          Write-Host "Solution:"
          Write-Host $env:ARMORPAINT_SOLUTION

          Write-Host ""
          Write-Host "Configuration: Release"
          Write-Host "Platform: x64"

          & msbuild.exe `
              $env:ARMORPAINT_SOLUTION `
              /m `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "BUILD COMPLETED"
          Write-Host "=========================================="

      # ============================================================
      # 16. LOCALIZAR EXECUTÁVEL
      # ============================================================
      - name: Find compiled executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SEARCHING COMPILED EXECUTABLE"
          Write-Host "=========================================="

          $candidates = Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Include "ArmorPaint.exe","Krom.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.FullName -match "\\(x64|x86)\\Release\\"
              }

          if ($candidates.Count -eq 0) {
              Write-Host ""
              Write-Host "Searching entire workspace..."

              $candidates = Get-ChildItem `
                  -Path $env:GITHUB_WORKSPACE `
                  -Include "ArmorPaint.exe","Krom.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue
          }

          if ($candidates.Count -eq 0) {
              throw "No compiled ArmorPaint.exe or Krom.exe was found."
          }

          Write-Host ""
          Write-Host "Candidates:"

          foreach ($candidate in $candidates) {
              Write-Host "$($candidate.FullName) [$($candidate.Length) bytes]"
          }

          $selected = $candidates |
              Where-Object {
                  $_.Name -eq "ArmorPaint.exe"
              } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

          if (-not $selected) {
              $selected = $candidates |
                  Where-Object {
                      $_.Name -eq "Krom.exe"
                  } |
                  Sort-Object FullName -Descending |
                  Select-Object -First 1
          }

          if (-not $selected) {
              throw "Unable to select compiled executable."
          }

          Write-Host ""
          Write-Host "Selected executable:"
          Write-Host $selected.FullName

          "COMPILED_EXE=$($selected.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 17. PREPARAR BUILD/KROM
      #
      # A própria documentação histórica manda colocar o exe
      # compilado dentro de build/krom.
      # ============================================================
      - name: Assemble build/krom
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ASSEMBLING BUILD/KROM"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          if (-not (Test-Path $krom)) {
              throw "build\krom was not generated by ArmorPaint."
          }

          if (-not (Test-Path $env:COMPILED_EXE)) {
              throw "Compiled executable not found."
          }

          Write-Host "Runtime directory:"
          Write-Host $krom

          Write-Host ""
          Write-Host "Compiled executable:"
          Write-Host $env:COMPILED_EXE

          # Copiar TODOS os artefatos da configuração Release.
          $releaseDir = Split-Path $env:COMPILED_EXE -Parent

          Write-Host ""
          Write-Host "Copying Release files from:"
          Write-Host $releaseDir

          Copy-Item `
              -Path (Join-Path $releaseDir "*") `
              -Destination $krom `
              -Recurse `
              -Force

          # Garantir um nome simples para o launcher.
          $armorPaintTarget = Join-Path `
              $krom `
              "ArmorPaint.exe"

          $compiledName = Split-Path `
              $env:COMPILED_EXE `
              -Leaf

          $compiledInKrom = Join-Path `
              $krom `
              $compiledName

          if ($compiledName -ne "ArmorPaint.exe") {

              if (-not (Test-Path $compiledInKrom)) {
                  throw "Compiled executable was not copied into build/krom."
              }

              Copy-Item `
                  $compiledInKrom `
                  $armorPaintTarget `
                  -Force
          }

          if (-not (Test-Path $armorPaintTarget)) {
              throw "ArmorPaint.exe was not placed in build/krom."
          }

          Write-Host ""
          Write-Host "Final executable:"
          Write-Host $armorPaintTarget

          Write-Host ""
          Write-Host "build/krom contents:"

          Get-ChildItem `
              $krom `
              -Recurse `
              -File |
              ForEach-Object {
                  $relative = $_.FullName.Substring($krom.Length).TrimStart("\")
                  Write-Host "$relative [$($_.Length) bytes]"
              }

      # ============================================================
      # 18. VERIFICAÇÃO FINAL DO PACOTE
      # ============================================================
      - name: Verify final package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING FINAL PACKAGE"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $exe = Join-Path `
              $krom `
              "ArmorPaint.exe"

          if (-not (Test-Path $krom)) {
              throw "build/krom does not exist."
          }

          if (-not (Test-Path $exe)) {
              throw "ArmorPaint.exe missing from build/krom."
          }

          $fileCount = (
              Get-ChildItem `
                  $krom `
                  -Recurse `
                  -File
          ).Count

          if ($fileCount -eq 0) {
              throw "build/krom is empty."
          }

          $exeInfo = Get-Item $exe

          Write-Host ""
          Write-Host "ArmorPaint.exe:"
          Write-Host $exeInfo.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($exeInfo.Length) bytes"

          Write-Host ""
          Write-Host "Total package files:"
          Write-Host $fileCount

      # ============================================================
      # 19. ZIP PORTÁTIL
      # ============================================================
      - name: Create portable ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING PORTABLE ZIP"
          Write-Host "=========================================="

          $source = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $zip = Join-Path `
              $env:GITHUB_WORKSPACE `
              "ArmorPaint-0.9-Windows-x64-D3D11.zip"

          if (Test-Path $zip) {
              Remove-Item $zip -Force
          }

          Compress-Archive `
              -Path (Join-Path $source "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "Failed to create ZIP."
          }

          $zipInfo = Get-Item $zip

          Write-Host ""
          Write-Host "ZIP:"
          Write-Host $zipInfo.FullName

          Write-Host ""
          Write-Host "ZIP size:"
          Write-Host "$($zipInfo.Length) bytes"

      # ============================================================
      # 20. UPLOAD DO PACOTE
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-0.9-Windows-x64-D3D11
          path: build/krom
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 21. UPLOAD DO ZIP
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-0.9-Windows-x64-D3D11-ZIP
          path: ArmorPaint-0.9-Windows-x64-D3D11.zip
          if-no-files-found: error
          compression-level: 0
