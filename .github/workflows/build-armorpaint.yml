name: Build ArmorPaint Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # ============================================================
      # 1. Baixar o Repositório Oficial do ArmorPaint
      # ============================================================
      - name: Checkout Official ArmorPaint
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          submodules: recursive

      # ============================================================
      # 2. Configurar Ferramentas (MSBuild + Compilador C++)
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 3. Gerar Arquivos da Solution (.sln)
      # ============================================================
      - name: Generate ArmorPaint project
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "GENERATING PROJECT (NEW STRUCTURE)"
          Write-Host "=========================================="
          
          if (-not (Test-Path "paint")) {
              Write-Error "A pasta 'paint' não existe no repositório baixado."
              exit 1
          }
          
          # Entra na pasta do aplicativo para rodar a engine base
          cd paint
          Write-Host "Diretório de trabalho atual: $(Get-Location)"
          
          # Usa cmd.exe para resolver o executável/batch do sistema de make da Armory
          cmd.exe /c "..\base\make"
          
          if ($LASTEXITCODE -ne 0) {
              Write-Error "O comando ..\base\make falhou."
              exit $LASTEXITCODE
          }
          
          cd ..

      # ============================================================
      # 4. Compilar
      # ============================================================
      - name: Build ArmorPaint Release x64
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "BUILDING SOLUTION"
          Write-Host "=========================================="
          
          # Procura a solution gerada dinamicamente
          $sln = Get-ChildItem -Path . -Filter "ArmorPaint.sln" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if (-not $sln) {
              Write-Error "ArmorPaint.sln não foi gerado."
              exit 1
          }
          
          Write-Host "Compilando: $($sln.FullName)"
          msbuild $sln.FullName /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      # ============================================================
      # 5. Montar Pacote Final
      # ============================================================
      - name: Create complete package
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "ASSEMBLING ARTIFACT"
          Write-Host "=========================================="
          
          New-Item -ItemType Directory -Path ".\artifact" -Force | Out-Null
          
          # A) Localizar e copiar a pasta krom
          $krom = Get-ChildItem -Path . -Directory -Filter "krom" -Recurse -ErrorAction SilentlyContinue | 
                  Where-Object { $_.FullName -match "build[\\/]krom" } | 
                  Select-Object -First 1
                  
          if (-not $krom) {
              # Fallback caso a pasta se chame krom, mas não esteja dentro de build
              $krom = Get-ChildItem -Path . -Directory -Filter "krom" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          
          if (-not $krom) {
              Write-Error "Pasta com os dados krom não encontrada."
              exit 1
          }
          Write-Host "Copiando arquivos de suporte de: $($krom.FullName)"
          Copy-Item "$($krom.FullName)\*" ".\artifact\" -Recurse -Force
          
          # B) Localizar o executável compilado ignorando pastas não relacionadas
          $exe = Get-ChildItem -Path . -Filter "ArmorPaint.exe" -Recurse -ErrorAction SilentlyContinue | 
                 Where-Object { $_.Directory.Name -ne "krom" } | 
                 Select-Object -First 1
                 
          if (-not $exe) {
              Write-Error "ArmorPaint.exe compilado não encontrado."
              exit 1
          }
          Write-Host "Copiando executável principal de: $($exe.FullName)"
          Copy-Item $exe.FullName ".\artifact\ArmorPaint.exe" -Force
          
          Write-Host "=========================================="
          Write-Host "FINAL PACKAGE CONTENT"
          Write-Host "=========================================="
          Get-ChildItem ".\artifact" | Select-Object Name

      # ============================================================
      # 6. Upload do Artefato
      # ============================================================
      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: artifact
          compression-level: 0
          if-no-files-found: error
          
