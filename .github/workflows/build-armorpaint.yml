name: Build ArmorPaint Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout ArmorPaint
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate ArmorPaint project
        shell: cmd
        working-directory: paint
        run: |
          call ..\base\make.bat

      - name: Find solution
        shell: powershell
        run: |
          $solution = Get-ChildItem -Path . -Filter "ArmorPaint.sln" -Recurse |
            Select-Object -First 1

          if (-not $solution) {
            Write-Error "ArmorPaint.sln não encontrado."
            exit 1
          }

          Write-Host "Solution encontrada:"
          Write-Host $solution.FullName

      - name: Build ArmorPaint
        shell: powershell
        working-directory: paint
        run: |
          $solution = Get-ChildItem -Path . -Filter "ArmorPaint.sln" -Recurse |
            Select-Object -First 1

          if (-not $solution) {
            Write-Error "ArmorPaint.sln não encontrado."
            exit 1
          }

          & msbuild $solution.FullName `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # ==========================================================
      # IMPORTANTE:
      # O ArmorPaint precisa ser executado dentro de build/krom.
      # Não vamos criar um pacote contendo apenas ArmorPaint.exe.
      # ==========================================================

      - name: Prepare complete ArmorPaint package
        shell: powershell
        working-directory: paint
        run: |

          Write-Host "=== Procurando build/krom ==="

          $krom = Join-Path $PWD "build\krom"

          if (-not (Test-Path $krom)) {
            Write-Error "A pasta build\krom não foi encontrada."
            Write-Host "Conteúdo de build:"
            Get-ChildItem ".\build" -Recurse | Select-Object FullName
            exit 1
          }

          Write-Host "krom encontrado:"
          Write-Host $krom

          Write-Host ""
          Write-Host "=== Procurando ArmorPaint.exe compilado ==="

          $exe = Get-ChildItem ".\build" `
            -Filter "ArmorPaint.exe" `
            -Recurse |
            Where-Object {
              $_.FullName -notlike "*\build\krom\ArmorPaint.exe"
            } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "ArmorPaint.exe compilado não encontrado."
            Get-ChildItem ".\build" -Recurse |
              Where-Object {$_.Extension -eq ".exe"} |
              Select-Object FullName
            exit 1
          }

          Write-Host "Executável encontrado:"
          Write-Host $exe.FullName

          Write-Host ""
          Write-Host "=== Copiando executável para build/krom ==="

          Copy-Item `
            $exe.FullName `
            "$krom\ArmorPaint.exe" `
            -Force

          Write-Host ""
          Write-Host "=== Conteúdo final de build/krom ==="

          Get-ChildItem $krom -Recurse |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "=== Tamanho do pacote ==="

          $size = (
            Get-ChildItem $krom -Recurse -File |
            Measure-Object Length -Sum
          ).Sum

          Write-Host ("Tamanho: {0:N2} MB" -f ($size / 1MB))

          if ($size -lt 15MB) {
            Write-Warning "O pacote parece pequeno demais."
          }

      - name: Test packaged ArmorPaint
        shell: powershell
        working-directory: paint
        run: |

          $krom = Join-Path $PWD "build\krom"
          $exe = Join-Path $krom "ArmorPaint.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "ArmorPaint.exe não está em build/krom."
            exit 1
          }

          Write-Host "Executando ArmorPaint a partir de:"
          Write-Host $krom

          Set-Location $krom

          $process = Start-Process `
            ".\ArmorPaint.exe" `
            -PassThru `
            -Wait

          Write-Host "Exit code:"
          Write-Host $process.ExitCode

      - name: Package complete build/krom
        shell: powershell
        working-directory: paint
        run: |

          if (-not (Test-Path ".\build\krom")) {
            Write-Error "build/krom não existe."
            exit 1
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "..\artifact" | Out-Null

          Copy-Item `
            ".\build\krom\*" `
            "..\artifact\" `
            -Recurse `
            -Force

          Write-Host "=== ARQUIVOS DO PACOTE ==="

          Get-ChildItem "..\artifact" -Recurse |
            Select-Object FullName, Length

      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-complete
          path: artifact/
          compression-level: 0
          if-no-files-found: error
