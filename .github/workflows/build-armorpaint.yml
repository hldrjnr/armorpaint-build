name: Build ArmorPaint Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # ============================================================
      # 1. Checkout com Submódulos Recursivos Obrigatórios
      # ============================================================
      - name: Checkout Official ArmorPaint
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 2. Configurar Ferramentas (Node.js + MSBuild + MSVC)
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 3. Gerar Arquivos da Solution (.sln) via Node.js na Raiz
      # ============================================================
      - name: Generate ArmorPaint project
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "GENERATING PROJECT VIA KINC/BASE MAKE"
          Write-Host "=========================================="
          
          # Validar se a pasta base e paint existem
          if (-not (Test-Path "base") -or -not (Test-Path "paint")) {
              Write-Error "Estrutura de pastas 'base' ou 'paint' não encontrada."
              exit 1
          }

          # O comando oficial de build do ArmorPaint moderno é executado chamando 
          # o make do Kinc localizado dentro de base/kinc, apontando para o app (paint)
          # ou executando o make do base passando o projeto.
          if (Test-Path "base\kinc\make.js") {
              Write-Host "Usando base\kinc\make.js..."
              node base/kinc/make --to paint -g direct3d11
          } elseif (Test-Path "base\make.js") {
              Write-Host "Usando base\make.js..."
              node base/make --to paint -g direct3d11
          } else {
              Write-Host "Procurando make.js recursivamente..."
              $makeJs = Get-ChildItem -Path "base" -Filter "make.js" -Recurse | Select-Object -First 1
              if ($makeJs) {
                  Write-Host "Encontrado em: $($makeJs.FullName)"
                  node $($makeJs.FullName) --to paint -g direct3d11
              } else {
                  Write-Error "Nenhum script make.js foi localizado na pasta base."
                  exit 1
              }
          }

          if ($LASTEXITCODE -ne 0) {
              Write-Error "A geração do projeto falhou."
              exit $LASTEXITCODE
          }

      # ============================================================
      # 4. Compilar a Solution Gerada
      # ============================================================
      - name: Build ArmorPaint Release x64
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "BUILDING SOLUTION"
          Write-Host "=========================================="
          
          # O arquivo .sln geralmente é gerado dentro de base/build ou na raiz/build
          $sln = Get-ChildItem -Path . -Filter "ArmorPaint.sln" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if (-not $sln) {
              Write-Error "ArmorPaint.sln não foi encontrado em nenhuma subpasta!"
              Write-Host "Listando arquivos de build encontrados para debug:"
              Get-ChildItem -Filter "*.sln" -Recurse
              exit 1
          }
          
          Write-Host "Solution encontrada em: $($sln.FullName)"
          msbuild $sln.FullName /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      # ============================================================
      # 5. Montar Pacote Final (Artefato)
      # ============================================================
      - name: Create complete package
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "ASSEMBLING ARTIFACT"
          Write-Host "=========================================="
          
          New-Item -ItemType Directory -Path ".\artifact" -Force | Out-Null
          
          # A) Localizar a pasta krom gerada (contém krom.js e shaders)
          $krom = Get-ChildItem -Path . -Directory -Filter "krom" -Recurse | 
                  Where-Object { Test-Path (Join-Path $_.FullName "krom.js") } | 
                  Select-Object -First 1
                  
          if (-not $krom) {
              Write-Error "Pasta krom com krom.js não foi encontrada."
              exit 1
          }
          
          Write-Host "Copiando arquivos krom de: $($krom.FullName)"
          Copy-Item "$($krom.FullName)\*" ".\artifact\" -Recurse -Force
          
          # B) Localizar o executável compilado (ArmorPaint.exe ou Krom.exe renomeado)
          $exe = Get-ChildItem -Path . -Filter "ArmorPaint.exe" -Recurse | 
                 Where-Object { $_.Directory.Name -ne "krom" } | 
                 Select-Object -First 1

          if (-not $exe) {
              # Fallback caso o executável venha com o nome padrão antigo do Kinc (Krom.exe)
              $exe = Get-ChildItem -Path . -Filter "Krom.exe" -Recurse | 
                     Where-Object { $_.Directory.Name -ne "krom" } | 
                     Select-Object -First 1
          }
                 
          if (-not $exe) {
              Write-Error "Executável compilado (.exe) não encontrado."
              exit 1
          }
          
          Write-Host "Copiando executável de: $($exe.FullName)"
          Copy-Item $exe.FullName ".\artifact\ArmorPaint.exe" -Force
          
          Write-Host "=========================================="
          Write-Host "FINAL PACKAGE CONTENT"
          Write-Host "=========================================="
          Get-ChildItem ".\artifact" | Select-Object Name

      # ============================================================
      # 6. Upload do Artefato
      # ============================================================
      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: artifact
          compression-level: 0
          if-no-files-found: error
          
