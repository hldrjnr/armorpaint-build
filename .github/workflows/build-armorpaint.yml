name: Build ArmorPaint Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ArmorPaint Windows x64
    runs-on: windows-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout ArmorPaint
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: main
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 2. Inicializar submódulos
      # ============================================================
      - name: Initialize submodules
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INITIALIZING SUBMODULES"
          Write-Host "=========================================="

          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) {
              throw "git submodule sync failed."
          }

          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) {
              throw "git submodule update failed."
          }

          Write-Host ""
          git submodule status --recursive

      # ============================================================
      # 3. Verificar ferramentas do Visual Studio
      # ============================================================
      - name: Verify Visual Studio
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
              throw "vswhere.exe not found."
          }

          $vsInstall = & $vswhere `
              -latest `
              -products "*" `
              -property installationPath

          if (-not $vsInstall) {
              throw "Visual Studio installation not found."
          }

          Write-Host "Visual Studio:"
          Write-Host $vsInstall

          $vcvars = & $vswhere `
              -latest `
              -products "*" `
              -find "VC\Auxiliary\Build\vcvars64.bat"

          if (-not $vcvars) {
              throw "vcvars64.bat not found."
          }

          Write-Host ""
          Write-Host "vcvars64:"
          Write-Host $vcvars

          $clang = & $vswhere `
              -latest `
              -products "*" `
              -find "VC\Tools\Llvm\x64\bin\clang-cl.exe"

          if (-not $clang) {
              throw "clang-cl.exe not found."
          }

          Write-Host ""
          Write-Host "clang-cl:"
          Write-Host $clang

          & $clang --version

      # ============================================================
      # 4. Verificar estrutura
      # ============================================================
      - name: Verify source tree
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
              "base\make.bat",
              "base\tools\make.js",
              "base\tools\bin\windows_x64\amake.exe",
              "paint"
          )

          foreach ($path in $required) {
              if (-not (Test-Path $path)) {
                  throw "Missing required path: $path"
              }

              Write-Host "OK: $path"
          }

      # ============================================================
      # 5. Gerar + compilar
      # ============================================================
      - name: Build ArmorPaint
        shell: cmd
        working-directory: paint
        run: |
          echo ==========================================
          echo BUILDING ARMORPAINT WINDOWS X64
          echo ==========================================

          ..\base\make.bat --target windows --graphics direct3d11 --compile

          if errorlevel 1 (
            echo ArmorPaint build failed.
            exit /b 1
          )

      # ============================================================
      # 6. Verificar exatamente o output oficial do build
      # ============================================================
      - name: Verify official build output
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $out = Join-Path $env:GITHUB_WORKSPACE "paint\build\out"
          $exe = Join-Path $out "ArmorPaint.exe"

          Write-Host "=========================================="
          Write-Host "VERIFYING PAINT/BUILD/OUT"
          Write-Host "=========================================="

          if (-not (Test-Path $out)) {
              throw "paint\build\out was not generated."
          }

          if (-not (Test-Path $exe)) {
              throw "ArmorPaint.exe not found at expected location."
          }

          Write-Host ""
          Write-Host "ArmorPaint.exe:"
          Write-Host $exe

          $file = Get-Item $exe

          Write-Host ""
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "Created: $($file.CreationTime)"

          Write-Host ""
          Write-Host "Contents of paint\build\out:"
          Get-ChildItem $out -Recurse |
              Select-Object FullName, Length

      # ============================================================
      # 7. TESTE REAL DE INICIALIZAÇÃO
      #
      # --background permite que a aplicação inicialize sem
      # depender de uma janela interativa.
      #
      # A aplicação deve permanecer viva. Depois de alguns segundos
      # matamos o processo propositalmente.
      # ============================================================
      - name: Test ArmorPaint startup
        shell: powershell
        working-directory: paint\build\out
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "TESTING ARMORPAINT STARTUP"
          Write-Host "=========================================="

          $exe = Join-Path (Get-Location) "ArmorPaint.exe"

          if (-not (Test-Path $exe)) {
              throw "ArmorPaint.exe not found."
          }

          Write-Host "Launching:"
          Write-Host $exe

          $process = Start-Process `
              -FilePath $exe `
              -ArgumentList "--background" `
              -WorkingDirectory (Get-Location) `
              -PassThru `
              -WindowStyle Hidden

          Write-Host ""
          Write-Host "Process ID: $($process.Id)"

          Start-Sleep -Seconds 15

          $running = Get-Process -Id $process.Id -ErrorAction SilentlyContinue

          if ($running) {
              Write-Host ""
              Write-Host "ArmorPaint remained running for 15 seconds."
              Write-Host "Startup test passed."

              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
          else {
              $process.Refresh()

              Write-Host ""
              Write-Host "ArmorPaint exited during startup."

              if ($null -ne $process.ExitCode) {
                  Write-Host "Exit code: $($process.ExitCode)"
              }

              throw "ArmorPaint failed to stay running."
          }

      # ============================================================
      # 8. Criar pacote portátil
      #
      # NÃO reconstruímos o conteúdo.
      # Copiamos literalmente paint/build/out inteiro.
      # ============================================================
      - name: Create portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING PORTABLE PACKAGE"
          Write-Host "=========================================="

          $source = Join-Path $env:GITHUB_WORKSPACE "paint\build\out"
          $artifact = Join-Path $env:GITHUB_WORKSPACE "artifact"

          if (-not (Test-Path $source)) {
              throw "Source output does not exist: $source"
          }

          if (Test-Path $artifact) {
              Remove-Item $artifact -Recurse -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $artifact `
              -Force |
              Out-Null

          Write-Host "Copying:"
          Write-Host $source
          Write-Host ""
          Write-Host "To:"
          Write-Host $artifact

          Copy-Item `
              -Path (Join-Path $source "*") `
              -Destination $artifact `
              -Recurse `
              -Force

          $finalExe = Join-Path $artifact "ArmorPaint.exe"

          if (-not (Test-Path $finalExe)) {
              throw "Final artifact does not contain ArmorPaint.exe."
          }

          # Testar novamente usando exatamente o diretório final
          Write-Host ""
          Write-Host "Testing final package..."

          Push-Location $artifact

          try {
              $process = Start-Process `
                  -FilePath ".\ArmorPaint.exe" `
                  -ArgumentList "--background" `
                  -WorkingDirectory $artifact `
                  -PassThru `
                  -WindowStyle Hidden

              Start-Sleep -Seconds 10

              $running = Get-Process `
                  -Id $process.Id `
                  -ErrorAction SilentlyContinue

              if (-not $running) {
                  $process.Refresh()

                  Write-Host "Final packaged application exited."
                  Write-Host "Exit code: $($process.ExitCode)"

                  throw "Final package failed startup test."
              }

              Write-Host "Final package startup test passed."

              Stop-Process `
                  -Id $process.Id `
                  -Force `
                  -ErrorAction SilentlyContinue
          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FINAL PACKAGE CONTENT"
          Write-Host "=========================================="

          Get-ChildItem $artifact -Recurse |
              Select-Object FullName, Length

      # ============================================================
      # 9. Criar ZIP
      #
      # O ZIP fica mais conveniente para baixar e extrair.
      # ============================================================
      - name: Create ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $artifact = Join-Path $env:GITHUB_WORKSPACE "artifact"
          $zip = Join-Path $env:GITHUB_WORKSPACE "ArmorPaint-Windows-x64.zip"

          if (Test-Path $zip) {
              Remove-Item $zip -Force
          }

          Compress-Archive `
              -Path (Join-Path $artifact "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "ZIP was not created."
          }

          Write-Host "ZIP created:"
          Write-Host $zip

      # ============================================================
      # 10. Upload diretório
      # ============================================================
      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: artifact
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 11. Upload ZIP
      # ============================================================
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-ZIP
          path: ArmorPaint-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
