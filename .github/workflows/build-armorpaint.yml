steps:
  - name: Checkout ArmorPaint
    uses: actions/checkout@v4
    with:
      repository: armory3d/armorpaint
      ref: main
      submodules: recursive
      fetch-depth: 0

  - name: Initialize submodules
    run: |
      git submodule sync --recursive
      git submodule update --init --recursive

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17' # JDK 17 é o padrão moderno para builds Android

  - name: Build ArmorPaint Android
    working-directory: paint
    run: |
      # Os runners do GitHub Actions 'ubuntu-latest' já têm o Android SDK e NDK instalados nas variáveis de ambiente.
      node ../base/tools/make.js --target android --compile

  - name: Package Android Build
    run: |
      mkdir -p artifact
      
      # Projetos Android/Gradle podem colocar o .apk final dentro de várias subpastas (ex: app/build/outputs/apk).
      # Nós buscamos qualquer APK gerado e copiamos para nossa pasta de artefatos.
      find paint/build -type f -name "*.apk" -exec cp {} artifact/ \;
      
      # Como precaução, copiamos a pasta de saída base
      if [ -d "paint/build/out" ]; then
        cp -r paint/build/out/* artifact/ || true
      fi
      
      cd artifact
      zip -r ../ArmorPaint-Android.zip .

  - name: Upload ArmorPaint Android
    uses: actions/upload-artifact@v4
    with:
      name: ArmorPaint-Android
      path: artifact
      if-no-files-found: error
      compression-level: 0

  - name: Upload ArmorPaint Android ZIP
    uses: actions/upload-artifact@v4
    with:
      name: ArmorPaint-Android-ZIP
      path: ArmorPaint-Android.zip
      if-no-files-found: error
      compression-level: 0
