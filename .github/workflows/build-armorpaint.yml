name: Build ArmorPaint for Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout ArmorPaint
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Initialize Visual Studio developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check compiler tools
        shell: pwsh
        run: |
          Write-Host "MSBuild:"
          msbuild -version
          Write-Host "Clang:"
          clang-cl --version
          Write-Host "Git:"
          git --version
          Write-Host "Node:"
          node --version

      - name: Generate Visual Studio project
        shell: bash
        working-directory: paint
        run: |
          set -euxo pipefail
          chmod +x ../base/make
          ../base/make

      - name: Locate generated Visual Studio project
        shell: pwsh
        working-directory: paint
        run: |
          Write-Host "Generated files:"
          Get-ChildItem -Recurse -File build | Select-Object FullName

          $projects = @(
            "build\ArmorPaint.slnx",
            "build\ArmorPaint.sln",
            "build\ArmorPaint.vcxproj"
          )

          $project = $null
          foreach ($p in $projects) {
            if (Test-Path $p) {
              $project = $p
              break
            }
          }

          if (-not $project) {
            $project = Get-ChildItem build -Recurse -File |
              Where-Object { $_.Name -in @("ArmorPaint.slnx","ArmorPaint.sln","ArmorPaint.vcxproj") } |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $project) {
            throw "Could not find the generated ArmorPaint Visual Studio project."
          }

          "ARMORPAINT_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using project: $project"

      - name: Compile ArmorPaint Release x64
        shell: pwsh
        working-directory: paint
        run: |
          msbuild "$env:ARMORPAINT_PROJECT" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

      - name: Find executable
        shell: pwsh
        working-directory: paint
        run: |
          $exe = Get-ChildItem -Recurse -File -Filter ArmorPaint.exe |
            Where-Object { $_.FullName -match "\\build\\" } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "Build directory:"
            Get-ChildItem -Recurse -File build | Select-Object FullName
            throw "ArmorPaint.exe was not found."
          }

          Write-Host "Found: $($exe.FullName)"
          "ARMORPAINT_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Assemble portable package
        shell: pwsh
        working-directory: paint
        run: |
          $exe = Get-Item $env:ARMORPAINT_EXE
          $root = $exe.Directory.FullName
          $package = Join-Path $env:GITHUB_WORKSPACE "ArmorPaint-Windows-x64"

          if (Test-Path $package) {
            Remove-Item $package -Recurse -Force
          }
          New-Item -ItemType Directory -Path $package | Out-Null

          # Prefer the generated portable runtime/data directory when present.
          $krom = Join-Path $exe.Directory.FullName ""
          Copy-Item $exe.FullName (Join-Path $package "ArmorPaint.exe") -Force

          # Copy the data directory from the nearest build output.
          $data = Get-ChildItem -Recurse -Directory -Filter data |
            Where-Object { $_.FullName -like "*\build\*" } |
            Sort-Object { $_.FullName.Length } |
            Select-Object -First 1

          if ($data) {
            Copy-Item $data.FullName (Join-Path $package "data") -Recurse -Force
          }

          # Copy DLLs that were emitted beside the executable.
          Get-ChildItem $exe.Directory.FullName -File -Filter *.dll -ErrorAction SilentlyContinue |
            Copy-Item -Destination $package -Force

          # Copy common runtime files if they exist beside the executable.
          foreach ($name in @("ArmorPaint.pdb", "v8_context_snapshot.bin")) {
            $src = Join-Path $exe.Directory.FullName $name
            if (Test-Path $src) {
              Copy-Item $src $package -Force
            }
          }

          $readme = @"
          ArmorPaint Windows x64 - self-built from armory3d/armorpaint main

          This is a development build. It is not an official binary release.
          "@
          Set-Content -Path (Join-Path $package "BUILD-INFO.txt") -Value $readme

          Compress-Archive -Path "$package\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\ArmorPaint-Windows-x64.zip" `
            -Force

          Write-Host "Package contents:"
          Get-ChildItem $package -Recurse | Select-Object FullName, Length

      - name: Upload ArmorPaint ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: ArmorPaint-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
