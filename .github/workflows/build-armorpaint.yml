name: ArmorPaint 0.9 Windows x64 D3D11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ArmorPaint 0.9 / 23.08 / Windows x64 / D3D11
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. VERIFICAR A RELEASE/SOURCE OFICIAL
      # ============================================================
      - name: Checkout ArmorPaint 23.08 source
        uses: actions/checkout@v5
        with:
          repository: armory3d/armorpaint
          ref: 23.08
          fetch-depth: 1
          submodules: false

      # ============================================================
      # 2. MOSTRAR A REVISÃO
      # ============================================================
      - name: Verify source revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ARMORPAINT 0.9 SOURCE"
          Write-Host "=========================================="

          $commit = git rev-parse HEAD

          Write-Host ""
          Write-Host "Commit:"
          Write-Host $commit

          if ($commit -ne "600d7c7f6f1bcb2b2f6d4d6f16a8b7a4f0f8a7f2") {
              Write-Warning "Commit differs from the abbreviated release commit shown by GitHub."
          }

          Write-Host ""
          Write-Host "Git describe:"
          git describe --tags --always

      # ============================================================
      # 3. VERIFICAR GITHUB CLI
      # ============================================================
      - name: Verify GitHub CLI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING GH CLI"
          Write-Host "=========================================="

          $gh = Get-Command gh.exe -ErrorAction SilentlyContinue

          if (-not $gh) {
              throw "GitHub CLI (gh) is not installed on the runner."
          }

          Write-Host "GitHub CLI:"
          gh --version

      # ============================================================
      # 4. LISTAR OS ASSETS OFICIAIS DA RELEASE
      # ============================================================
      - name: List 23.08 release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "23.08 RELEASE ASSETS"
          Write-Host "=========================================="

          gh release view 23.08 `
              --repo armory3d/armorpaint `
              --json tagName,name,publishedAt,assets `
              --jq '
                "Tag: \(.tagName)",
                "Name: \(.name)",
                "Published: \(.publishedAt)",
                "",
                "Assets:",
                (.assets[] | " - " + .name)
              '

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to read ArmorPaint 23.08 release."
          }

      # ============================================================
      # 5. ENCONTRAR O ASSET WINDOWS
      #
      # Preferimos ZIP/7Z contendo "Windows" ou "Win".
      # ============================================================
      - name: Select Windows release asset
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SELECTING WINDOWS ASSET"
          Write-Host "=========================================="

          $json = gh release view 23.08 `
              --repo armory3d/armorpaint `
              --json assets

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to query release assets."
          }

          $release = $json | ConvertFrom-Json

          $assets = @(
              $release.assets |
              Where-Object {
                  $_.name -match '(?i)(windows|win)' -and
                  $_.name -match '(?i)\.(zip|7z)$'
              }
          )

          if ($assets.Count -eq 0) {

              Write-Host ""
              Write-Host "No asset explicitly containing Windows/Win was found."

              Write-Host ""
              Write-Host "Available archive assets:"

              $assets = @(
                  $release.assets |
                  Where-Object {
                      $_.name -match '(?i)\.(zip|7z)$'
                  }
              )
          }

          if ($assets.Count -eq 0) {
              throw "No downloadable archive asset was found in release 23.08."
          }

          if ($assets.Count -gt 1) {

              Write-Host ""
              Write-Host "Candidate archives:"

              foreach ($asset in $assets) {
                  Write-Host "$($asset.name) [$($asset.size) bytes]"
              }

              # Prefer explicit Windows naming.
              $windows = $assets |
                  Where-Object {
                      $_.name -match '(?i)(windows|win)'
                  } |
                  Select-Object -First 1

              if ($windows) {
                  $selected = $windows
              }
              else {
                  $selected = $assets | Select-Object -First 1
              }
          }
          else {
              $selected = $assets[0]
          }

          Write-Host ""
          Write-Host "Selected asset:"
          Write-Host $selected.name

          Write-Host ""
          Write-Host "Download URL:"
          Write-Host $selected.url

          "RELEASE_ASSET=$($selected.name)" >> $env:GITHUB_ENV

      # ============================================================
      # 6. DOWNLOAD DO ASSET OFICIAL
      # ============================================================
      - name: Download official ArmorPaint 23.08
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DOWNLOADING OFFICIAL ARMORPAINT 23.08"
          Write-Host "=========================================="

          if (-not $env:RELEASE_ASSET) {
              throw "RELEASE_ASSET is not set."
          }

          $downloadDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "release_download"

          if (Test-Path $downloadDir) {
              Remove-Item `
                  $downloadDir `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $downloadDir `
              -Force |
              Out-Null

          Push-Location $downloadDir

          try {

              gh release download 23.08 `
                  --repo armory3d/armorpaint `
                  --pattern $env:RELEASE_ASSET `
                  --clobber

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to download official ArmorPaint release asset."
              }

          }
          finally {
              Pop-Location
          }

          $downloaded = Get-ChildItem `
              $downloadDir `
              -File

          if (-not $downloaded) {
              throw "No release file was downloaded."
          }

          Write-Host ""
          Write-Host "Downloaded file:"

          foreach ($file in $downloaded) {
              Write-Host "$($file.FullName) [$($file.Length) bytes]"
          }

      # ============================================================
      # 7. LOCALIZAR 7-ZIP
      # ============================================================
      - name: Locate 7-Zip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "LOCATING 7-ZIP"
          Write-Host "=========================================="

          $candidatePaths = @(
              "${env:ProgramFiles}\7-Zip\7z.exe",
              "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          )

          $sevenZip = $null

          foreach ($path in $candidatePaths) {
              if (Test-Path $path) {
                  $sevenZip = $path
                  break
              }
          }

          if (-not $sevenZip) {

              $command = Get-Command 7z.exe -ErrorAction SilentlyContinue

              if ($command) {
                  $sevenZip = $command.Source
              }
          }

          if (-not $sevenZip) {
              throw "7-Zip was not found."
          }

          Write-Host "7-Zip:"
          Write-Host $sevenZip

          "SEVEN_ZIP=$sevenZip" >> $env:GITHUB_ENV

      # ============================================================
      # 8. EXTRAIR RELEASE
      # ============================================================
      - name: Extract official release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "EXTRACTING OFFICIAL RELEASE"
          Write-Host "=========================================="

          $downloadDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "release_download"

          $extractDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "release_extract"

          if (Test-Path $extractDir) {
              Remove-Item `
                  $extractDir `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $extractDir `
              -Force |
              Out-Null

          $archive = Get-ChildItem `
              $downloadDir `
              -File |
              Select-Object -First 1

          if (-not $archive) {
              throw "Downloaded release archive not found."
          }

          Write-Host ""
          Write-Host "Archive:"
          Write-Host $archive.FullName

          $extension = $archive.Extension.ToLowerInvariant()

          if ($extension -eq ".zip") {

              Expand-Archive `
                  -Path $archive.FullName `
                  -DestinationPath $extractDir `
                  -Force

          }
          elseif ($extension -eq ".7z") {

              & $env:SEVEN_ZIP `
                  x `
                  $archive.FullName `
                  "-o$extractDir" `
                  "-y" `
                  "-aoa"

              if ($LASTEXITCODE -ne 0) {
                  throw "7-Zip failed to extract the ArmorPaint release."
              }

          }
          else {
              throw "Unsupported release archive format: $extension"
          }

          Write-Host ""
          Write-Host "Extraction completed."

          Write-Host ""
          Write-Host "Extracted files:"

          Get-ChildItem `
              $extractDir `
              -Recurse `
              -File |
              Select-Object FullName, Length

      # ============================================================
      # 9. LOCALIZAR ARMORPAINT.EXE
      # ============================================================
      - name: Locate ArmorPaint executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "LOCATING ARMORPAINT.EXE"
          Write-Host "=========================================="

          $extractDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "release_extract"

          $executables = Get-ChildItem `
              $extractDir `
              -Filter "ArmorPaint.exe" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue

          if (-not $executables) {
              Write-Host ""
              Write-Host "Available executables:"

              Get-ChildItem `
                  $extractDir `
                  -Include "*.exe" `
                  -Recurse `
                  -File |
                  Select-Object FullName, Length

              throw "ArmorPaint.exe was not found in the official release archive."
          }

          Write-Host ""
          Write-Host "Found executable(s):"

          foreach ($exe in $executables) {
              Write-Host "$($exe.FullName) [$($exe.Length) bytes]"
          }

          $selected = $executables |
              Select-Object -First 1

          Write-Host ""
          Write-Host "Selected:"
          Write-Host $selected.FullName

          "OFFICIAL_EXE=$($selected.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 10. VERIFICAR ESTRUTURA PORTÁTIL
      # ============================================================
      - name: Verify official package structure
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING OFFICIAL PACKAGE"
          Write-Host "=========================================="

          $exe = Get-Item $env:OFFICIAL_EXE

          Write-Host ""
          Write-Host "ArmorPaint.exe:"
          Write-Host $exe.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($exe.Length) bytes"

          if ($exe.Length -lt 1000000) {
              throw "ArmorPaint.exe is suspiciously small."
          }

          $root = $exe.Directory.FullName

          Write-Host ""
          Write-Host "Package root:"
          Write-Host $root

          $files = Get-ChildItem `
              $root `
              -Recurse `
              -File

          if (-not $files) {
              throw "The extracted package contains no files."
          }

          Write-Host ""
          Write-Host "Total files:"
          Write-Host $files.Count

      # ============================================================
      # 11. CRIAR PACOTE FINAL
      #
      # Copiamos exatamente o diretório que contém o executável
      # oficial e todo o seu runtime.
      # ============================================================
      - name: Create portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING PORTABLE PACKAGE"
          Write-Host "=========================================="

          $sourceRoot = (Get-Item $env:OFFICIAL_EXE).Directory.FullName

          $artifact = Join-Path `
              $env:GITHUB_WORKSPACE `
              "artifact"

          if (Test-Path $artifact) {
              Remove-Item `
                  $artifact `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $artifact `
              -Force |
              Out-Null

          Copy-Item `
              -Path (Join-Path $sourceRoot "*") `
              -Destination $artifact `
              -Recurse `
              -Force

          $finalExe = Join-Path `
              $artifact `
              "ArmorPaint.exe"

          if (-not (Test-Path $finalExe)) {
              throw "ArmorPaint.exe is missing from the final package."
          }

          Write-Host ""
          Write-Host "Final ArmorPaint.exe:"
          Write-Host $finalExe

          Write-Host ""
          Write-Host "Final package contents:"

          Get-ChildItem `
              $artifact `
              -Recurse `
              -File |
              ForEach-Object {
                  $relative = $_.FullName.Substring($artifact.Length).TrimStart("\")
                  Write-Host "$relative [$($_.Length) bytes]"
              }

      # ============================================================
      # 12. CRIAR ZIP FINAL
      # ============================================================
      - name: Create final ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING FINAL ZIP"
          Write-Host "=========================================="

          $artifact = Join-Path `
              $env:GITHUB_WORKSPACE `
              "artifact"

          $zip = Join-Path `
              $env:GITHUB_WORKSPACE `
              "ArmorPaint-0.9-23.08-Windows-x64-D3D11.zip"

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          Compress-Archive `
              -Path (Join-Path $artifact "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "Final ZIP was not created."
          }

          $info = Get-Item $zip

          Write-Host ""
          Write-Host "ZIP:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 13. UPLOAD DO PACOTE
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11
          path: artifact
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 14. UPLOAD DO ZIP
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11 ZIP
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11-ZIP
          path: ArmorPaint-0.9-23.08-Windows-x64-D3D11.zip
          if-no-files-found: error
          compression-level: 0
