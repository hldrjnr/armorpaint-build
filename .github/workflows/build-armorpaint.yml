name: Build ArmorPaint for Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout ArmorPaint
        uses: actions/checkout@v5
        with:
          repository: armory3d/armorpaint
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check environment
        shell: pwsh
        run: |
          Write-Host "=== MSBuild ==="
          msbuild -version

          Write-Host "=== Clang ==="
          clang-cl --version

          Write-Host "=== Git ==="
          git --version

          Write-Host "=== Repository ==="
          Get-ChildItem "$env:GITHUB_WORKSPACE" -Force

      - name: Check ArmorPaint build tools
        shell: pwsh
        working-directory: paint
        run: |
          Write-Host "=== base ==="
          Get-ChildItem ..\base -Force

          Write-Host "=== Windows tools ==="

          if (Test-Path "..\base\tools\bin\windows_x64") {
            Get-ChildItem ..\base\tools\bin\windows_x64 -Force
          }
          else {
            Write-Host "windows_x64 tool directory does not exist."
          }

          Write-Host "=== amake ==="

          $amake = "..\base\tools\bin\windows_x64\amake.exe"

          if (Test-Path $amake) {
            Write-Host "amake.exe found:"
            Get-Item $amake
          }
          else {
            throw "amake.exe was not found."
          }

      - name: Generate ArmorPaint project
        shell: cmd
        working-directory: paint
        run: |
          echo ===== Running make.bat =====
          call ..\base\make.bat
          echo ===== make.bat finished =====
          echo ERRORLEVEL=%ERRORLEVEL%
          exit /b %ERRORLEVEL%

      - name: Inspect generated files
        if: always()
        shell: pwsh
        working-directory: paint
        run: |
          Write-Host "======================================"
          Write-Host "ARMORPAINT BUILD DIRECTORY"
          Write-Host "======================================"

          if (Test-Path "build") {
            Get-ChildItem "build" -Recurse -Force |
              Select-Object FullName, Length, LastWriteTime
          }
          else {
            Write-Host "NO build DIRECTORY EXISTS."
          }

          Write-Host "======================================"
          Write-Host "SEARCHING FOR SOLUTIONS"
          Write-Host "======================================"

          Get-ChildItem . -Recurse -Include *.sln,*.slnx,*.vcxproj -File -ErrorAction SilentlyContinue |
            Select-Object FullName

          Write-Host "======================================"
          Write-Host "SEARCHING FOR EXECUTABLES"
          Write-Host "======================================"

          Get-ChildItem . -Recurse -Filter *.exe -File -ErrorAction SilentlyContinue |
            Select-Object FullName, Length

      - name: Locate generated Visual Studio project
        shell: pwsh
        working-directory: paint
        run: |
          $projects = Get-ChildItem . -Recurse -File |
            Where-Object {
              $_.Extension -in @(".sln", ".slnx", ".vcxproj") -and
              $_.Name -match "ArmorPaint"
            }

          if (-not $projects) {
            throw "No ArmorPaint Visual Studio project was generated. Check the previous diagnostic step."
          }

          Write-Host "Found project(s):"

          $projects | ForEach-Object {
            Write-Host $_.FullName
          }

          $project = $projects | Select-Object -First 1

          "ARMORPAINT_PROJECT=$($project.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build ArmorPaint
        shell: pwsh
        working-directory: paint
        run: |
          Write-Host "Building:"
          Write-Host $env:ARMORPAINT_PROJECT

          msbuild "$env:ARMORPAINT_PROJECT" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

      - name: Find ArmorPaint.exe
        shell: pwsh
        working-directory: paint
        run: |
          $exe = Get-ChildItem . -Recurse -Filter "ArmorPaint.exe" -File |
            Select-Object -First 1

          if (-not $exe) {
            throw "ArmorPaint.exe was not found after compilation."
          }

          Write-Host "Found:"
          Write-Host $exe.FullName

          "ARMORPAINT_EXE=$($exe.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package build
        shell: pwsh
        working-directory: paint
        run: |
          $exe = Get-Item $env:ARMORPAINT_EXE

          $package = Join-Path `
            $env:GITHUB_WORKSPACE `
            "ArmorPaint-Windows-x64"

          New-Item `
            -ItemType Directory `
            -Path $package `
            -Force | Out-Null

          Copy-Item `
            $exe.FullName `
            (Join-Path $package "ArmorPaint.exe") `
            -Force

          Get-ChildItem `
            $exe.Directory.FullName `
            -Filter "*.dll" `
            -File `
            -ErrorAction SilentlyContinue |
            Copy-Item `
              -Destination $package `
              -Force

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\ArmorPaint-Windows-x64.zip" `
            -Force

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: ArmorPaint-Windows-x64.zip
          retention-days: 7
