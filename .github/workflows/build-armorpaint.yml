name: Build ArmorPaint Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout ArmorPaint
        uses: actions/checkout@v5
        with:
          repository: armory3d/armorpaint
          ref: main
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate Visual Studio project
        shell: cmd
        working-directory: paint
        run: |
          call ..\base\make.bat
          if errorlevel 1 exit /b 1

      - name: Build ArmorPaint
        shell: cmd
        working-directory: paint
        run: |
          msbuild build\ArmorPaint.sln /m /p:Configuration=Release /p:Platform=x64
          if errorlevel 1 exit /b 1

      - name: Prepare complete package
        shell: powershell
        working-directory: paint
        run: |
          $ErrorActionPreference = "Stop"

          $build = Join-Path $PWD "build"
          $krom = Join-Path $build "krom"

          if (-not (Test-Path $build)) {
            throw "build directory not found"
          }

          if (-not (Test-Path $krom)) {
            throw "build\krom directory not found"
          }

          $exe = Get-ChildItem `
            -Path $build `
            -Filter "ArmorPaint.exe" `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -notlike "*\krom\ArmorPaint.exe"
            } |
            Select-Object -First 1

          if (-not $exe) {
            throw "Compiled ArmorPaint.exe was not found"
          }

          Write-Host "Compiled executable:"
          Write-Host $exe.FullName

          Copy-Item `
            $exe.FullName `
            (Join-Path $krom "ArmorPaint.exe") `
            -Force

          $artifact = Join-Path $PWD "..\artifact"

          if (Test-Path $artifact) {
            Remove-Item $artifact -Recurse -Force
          }

          New-Item `
            $artifact `
            -ItemType Directory `
            -Force |
            Out-Null

          Copy-Item `
            (Join-Path $krom "*") `
            $artifact `
            -Recurse `
            -Force

          $files = Get-ChildItem `
            $artifact `
            -Recurse `
            -File

          $size = (
            $files |
            Measure-Object Length -Sum
          ).Sum

          Write-Host ""
          Write-Host "Package size:"
          Write-Host "$([math]::Round($size / 1MB, 2)) MB"

          if (-not (Test-Path (Join-Path $artifact "ArmorPaint.exe"))) {
            throw "ArmorPaint.exe missing from artifact"
          }

      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-complete
          path: artifact
          compression-level: 0
          if-no-files-found: error Write-Host "=========================================="
          Write-Host "COMPLETE ARMORPAINT PACKAGE"
          Write-Host "=========================================="


          Get-ChildItem `
              $krom.FullName `
              -Recurse `
              -Force |
              Select-Object FullName, Length


          $files = Get-ChildItem `
              $krom.FullName `
              -Recurse `
              -File


          $size = (
              $files |
              Measure-Object Length -Sum
          ).Sum


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "TOTAL SIZE"
          Write-Host "=========================================="


          Write-Host (
              "Total: {0:N2} MB" -f ($size / 1MB)
          )


      # ============================================================
      # 11. CRIAR ARTIFACT
      # ============================================================

      - name: Create artifact
        shell: powershell
        run: |

          $krom = Get-ChildItem `
              -Path . `
              -Directory `
              -Filter "krom" `
              -Recurse |
              Where-Object {
                  Test-Path (Join-Path $_.FullName "krom.js")
              } |
              Select-Object -First 1


          if (Test-Path ".\artifact") {
              Remove-Item `
                  ".\artifact" `
                  -Recurse `
                  -Force
          }


          New-Item `
              -ItemType Directory `
              -Path ".\artifact" `
              -Force |
              Out-Null


          Copy-Item `
              (Join-Path $krom.FullName "*") `
              ".\artifact\" `
              -Recurse `
              -Force


          Write-Host ""
          Write-Host "Artifact criado."


      # ============================================================
      # 12. VERIFICAÇÃO FINAL
      # ============================================================

      - name: Verify final artifact
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "FINAL ARTIFACT"
          Write-Host "=========================================="


          if (-not (Test-Path ".\artifact\ArmorPaint.exe")) {
              Write-Error "ArmorPaint.exe não está no artifact."
              exit 1
          }


          if (-not (Test-Path ".\artifact\krom.js")) {
              Write-Error "krom.js não está no artifact."
              exit 1
          }


          $files = Get-ChildItem `
              ".\artifact" `
              -Recurse `
              -File


          $size = (
              $files |
              Measure-Object Length -Sum
          ).Sum


          Write-Host ""
          Write-Host "ArmorPaint.exe:"
          Write-Host (
              "{0:N2} MB" -f (
                  (Get-Item ".\artifact\ArmorPaint.exe").Length / 1MB
              )
          )


          Write-Host ""
          Write-Host "Package:"
          Write-Host (
              "{0:N2} MB" -f ($size / 1MB)
          )


          Write-Host ""
          Write-Host "Files:"
          Write-Host $files.Count


      # ============================================================
      # 13. UPLOAD
      # ============================================================

      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-complete
          path: artifact
          compression-level: 0
          if-no-files-found: error          Select-Object FullName

            exit 1

          }


          foreach ($krom in $kroms) {

            Write-Host ""
            Write-Host "Krom:"
            Write-Host $krom.FullName

          }


      # ============================================================
      # 9. Montar pacote completo
      # ============================================================

      - name: Create complete package
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "CREATING COMPLETE PACKAGE"
          Write-Host "=========================================="


          # ----------------------------------------------------------
          # Procurar krom
          # ----------------------------------------------------------

          $krom = Get-ChildItem `
            -Path $PWD `
            -Directory `
            -Filter "krom" `
            -Recurse |
            Where-Object {
              Test-Path (Join-Path $_.FullName "krom.js")
            } |
            Select-Object -First 1


          if (-not $krom) {

            Write-Error `
              "Pasta krom contendo krom.js não encontrada."

            exit 1

          }


          Write-Host ""
          Write-Host "Krom selecionado:"
          Write-Host $krom.FullName


          # ----------------------------------------------------------
          # Procurar executável Release
          # ----------------------------------------------------------

          $exe = Get-ChildItem `
            -Path $PWD `
            -Filter "ArmorPaint.exe" `
            -Recurse |
            Where-Object {
              $_.FullName -notlike "*\krom\ArmorPaint.exe"
            } |
            Sort-Object FullName |
            Select-Object -First 1


          if (-not $exe) {

            Write-Error "ArmorPaint.exe compilado não encontrado."
            exit 1

          }


          Write-Host ""
          Write-Host "Executável:"
          Write-Host $exe.FullName


          # ----------------------------------------------------------
          # Copiar para krom
          # ----------------------------------------------------------

          Copy-Item `
            $exe.FullName `
            (Join-Path $krom.FullName "ArmorPaint.exe") `
            -Force


          # ----------------------------------------------------------
          # Criar artifact
          # ----------------------------------------------------------

          if (Test-Path ".\artifact") {

            Remove-Item `
              ".\artifact" `
              -Recurse `
              -Force

          }


          New-Item `
            -ItemType Directory `
            -Path ".\artifact" `
            -Force |
            Out-Null


          # ----------------------------------------------------------
          # Copiar TODO krom
          # ----------------------------------------------------------

          Copy-Item `
            (Join-Path $krom.FullName "*") `
            ".\artifact\" `
            -Recurse `
            -Force


      # ============================================================
      # 10. Verificar tamanho
      # ============================================================

      - name: Verify package
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "FINAL PACKAGE"
          Write-Host "=========================================="


          $files = Get-ChildItem `
            ".\artifact" `
            -Recurse `
            -File


          foreach ($file in $files) {

            Write-Host $file.FullName

          }


          $size = (
            $files |
            Measure-Object Length -Sum
          ).Sum


          Write-Host ""
          Write-Host (
            "TOTAL SIZE: {0:N2} MB" -f ($size / 1MB)
          )


          if (-not (Test-Path ".\artifact\ArmorPaint.exe")) {

            Write-Error `
              "ArmorPaint.exe não está no pacote."

            exit 1

          }


          if (-not (Test-Path ".\artifact\krom.js")) {

            Write-Error `
              "krom.js não está no pacote."

            exit 1

          }


      # ============================================================
      # 11. Upload
      # ============================================================

      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-complete
          path: artifact
          compression-level: 0
          if-no-files-found: error
