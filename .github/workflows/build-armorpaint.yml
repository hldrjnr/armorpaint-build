name: Build ArmorPaint Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # ============================================================
      # 1. Baixar o Repositório Oficial do ArmorPaint
      # ============================================================
      - name: Checkout Official ArmorPaint
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          submodules: recursive
          # fetch-depth removido: garante que todos os commits dos submódulos sejam baixados

      # ============================================================
      # 2. Configurar Ferramentas
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 3. Gerar Arquivos da Solution (.sln)
      # ============================================================
      - name: Generate ArmorPaint project
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "GENERATING PROJECT VIA NODE.JS"
          Write-Host "=========================================="
          
          if (Test-Path "armorcore\make.js") {
              Write-Host "ArmorCore detectado. Gerando projeto..."
              node armorcore/make -g direct3d11
          } elseif (Test-Path "Kinc\make.js") {
              Write-Host "Kinc detectado. Gerando projeto..."
              node Kinc/make -g direct3d11
          } else {
              Write-Host "ERRO: O make.js não foi encontrado. Conteúdo atual da raiz:"
              Get-ChildItem -Force
              Write-Error "O download dos submódulos falhou ou a estrutura do repositório mudou."
              exit 1
          }

      # ============================================================
      # 4. Compilar
      # ============================================================
      - name: Build ArmorPaint Release x64
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "BUILDING SOLUTION"
          Write-Host "=========================================="
          
          if (-not (Test-Path "build\ArmorPaint.sln")) {
              Write-Host "ERRO: ArmorPaint.sln não foi gerado. Conteúdo da pasta build:"
              if (Test-Path "build") { Get-ChildItem "build" -Force }
              Write-Error "Falha na geração do projeto."
              exit 1
          }
          
          Write-Host "Compilando build\ArmorPaint.sln..."
          msbuild build\ArmorPaint.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      # ============================================================
      # 5. Montar Pacote Final
      # ============================================================
      - name: Create complete package
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "ASSEMBLING ARTIFACT"
          Write-Host "=========================================="
          
          New-Item -ItemType Directory -Path ".\artifact" -Force | Out-Null
          
          # A) Localizar e copiar a pasta Krom correta (a que contém os shaders e dados)
          if (-not (Test-Path "build\krom\krom.js")) {
              Write-Error "Arquivos essenciais (build\krom\krom.js) não encontrados."
              exit 1
          }
          
          Write-Host "Copiando pasta krom..."
          Copy-Item "build\krom\*" ".\artifact\" -Recurse -Force
          
          # B) Localizar o executável compilado ignorando pastas indesejadas
          $exe = Get-ChildItem -Path ".\build" -Filter "ArmorPaint.exe" -Recurse -ErrorAction SilentlyContinue | 
                 Where-Object { $_.Directory.Name -ne "krom" } | 
                 Select-Object -First 1
                 
          if (-not $exe) {
              Write-Error "ArmorPaint.exe compilado não encontrado."
              exit 1
          }
          
          Write-Host "Copiando executável compilado ($($exe.Name))..."
          Copy-Item $exe.FullName ".\artifact\ArmorPaint.exe" -Force
          
          Write-Host "=========================================="
          Write-Host "FINAL PACKAGE CONTENT"
          Write-Host "=========================================="
          Get-ChildItem ".\artifact" | Select-Object Name

      # ============================================================
      # 6. Upload do Artefato
      # ============================================================
      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: artifact
          compression-level: 0
          if-no-files-found: error
          
