name: Build ArmorPaint Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # ============================================================
      # 1. Baixar o Repositório Oficial do ArmorPaint
      # ============================================================
      - name: Checkout Official ArmorPaint
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          submodules: recursive

      # ============================================================
      # 2. Configurar Ferramentas 
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 3. Gerar Arquivos da Solution (.sln)
      # ============================================================
      - name: Generate ArmorPaint project
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "GENERATING PROJECT VIA MAKE.BAT"
          Write-Host "=========================================="
          
          if (-not (Test-Path "paint")) {
              Write-Error "A pasta 'paint' não existe no repositório."
              exit 1
          }
          
          # Entra na pasta do aplicativo
          cd paint
          Write-Host "Diretório atual: $(Get-Location)"
          
          # Validação de segurança: verificar se make.bat existe em base
          if (-not (Test-Path "..\base\make.bat")) {
              Write-Host "ERRO CRÍTICO: make.bat não foi encontrado na pasta 'base'."
              Write-Host "Listando TODO o conteúdo de 'base' para depuração:"
              Get-ChildItem "..\base" -Force
              exit 1
          }
          
          Write-Host "Executando ..\base\make.bat -g direct3d11 ..."
          
          # Executa de forma isolada no CMD para não dar conflito com utilitários GNU do GitHub Actions
          & cmd.exe /c "..\base\make.bat -g direct3d11"
          
          if ($LASTEXITCODE -ne 0) {
              Write-Error "A execução de make.bat falhou com código $LASTEXITCODE."
              exit $LASTEXITCODE
          }
          
          cd ..

      # ============================================================
      # 4. Compilar
      # ============================================================
      - name: Build ArmorPaint Release x64
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "BUILDING SOLUTION"
          Write-Host "=========================================="
          
          # Procura a solution em todo o repositório
          $sln = Get-ChildItem -Path . -Filter "ArmorPaint.sln" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if (-not $sln) {
              Write-Error "ArmorPaint.sln não foi gerado!"
              Write-Host "Listando conteúdo de paint\build para debugar o erro silencioso:"
              if (Test-Path "paint\build") {
                  Get-ChildItem "paint\build" -Recurse
              } else {
                  Write-Host "A pasta paint\build não foi criada."
              }
              exit 1
          }
          
          Write-Host "Solution encontrada em: $($sln.FullName)"
          Write-Host "Iniciando compilação no MSBuild..."
          
          msbuild $sln.FullName /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      # ============================================================
      # 5. Montar Pacote Final
      # ============================================================
      - name: Create complete package
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "ASSEMBLING ARTIFACT"
          Write-Host "=========================================="
          
          New-Item -ItemType Directory -Path ".\artifact" -Force | Out-Null
          
          # A) Localizar e copiar a pasta krom (Dados, Shaders)
          $krom = Get-ChildItem -Path . -Directory -Filter "krom" -Recurse -ErrorAction SilentlyContinue | 
                  Where-Object { $_.FullName -match "build[\\/]krom" } | Select-Object -First 1
                  
          if (-not $krom) {
              $krom = Get-ChildItem -Path . -Directory -Filter "krom" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          
          if (-not $krom) {
              Write-Error "Pasta krom não encontrada."
              exit 1
          }
          Write-Host "Copiando pasta krom de: $($krom.FullName)"
          Copy-Item "$($krom.FullName)\*" ".\artifact\" -Recurse -Force
          
          # B) Localizar o executável (.exe)
          $exe = Get-ChildItem -Path . -Filter "ArmorPaint.exe" -Recurse -ErrorAction SilentlyContinue | 
                 Where-Object { $_.Directory.Name -ne "krom" } | Select-Object -First 1
                 
          if (-not $exe) {
              Write-Error "ArmorPaint.exe compilado não encontrado."
              exit 1
          }
          Write-Host "Copiando executável de: $($exe.FullName)"
          Copy-Item $exe.FullName ".\artifact\ArmorPaint.exe" -Force
          
          Write-Host "=========================================="
          Write-Host "FINAL PACKAGE CONTENT"
          Write-Host "=========================================="
          Get-ChildItem ".\artifact" | Select-Object Name

      # ============================================================
      # 6. Upload do Artefato
      # ============================================================
      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: artifact
          compression-level: 0
          if-no-files-found: error
          
