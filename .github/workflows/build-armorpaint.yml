name: Download ArmorPaint 0.9 Windows x64 D3D11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ArmorPaint 0.9 - Windows x64 - Official Release
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. CHECKOUT DO CÓDIGO-FONTE DA RELEASE 23.08
      # ============================================================
      - name: Checkout ArmorPaint 23.08
        uses: actions/checkout@v5
        with:
          repository: armory3d/armorpaint
          ref: 23.08
          fetch-depth: 1
          submodules: false

      # ============================================================
      # 2. CONSULTAR API DO GITHUB
      #
      # Não usamos gh release view.
      # A API REST pública é mais simples e previsível.
      # ============================================================
      - name: Get ArmorPaint 23.08 release information
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ARMORPAINT 23.08 RELEASE"
          Write-Host "=========================================="

          $apiUrl = "https://api.github.com/repos/armory3d/armorpaint/releases/tags/23.08"

          Write-Host ""
          Write-Host "API:"
          Write-Host $apiUrl

          $headers = @{
              "Accept" = "application/vnd.github+json"
              "User-Agent" = "ArmorPaint-GitHub-Actions"
          }

          try {
              $release = Invoke-RestMethod `
                  -Uri $apiUrl `
                  -Headers $headers `
                  -Method Get
          }
          catch {
              throw "Failed to query GitHub release API: $($_.Exception.Message)"
          }

          if (-not $release) {
              throw "GitHub returned an empty release response."
          }

          Write-Host ""
          Write-Host "Release name:"
          Write-Host $release.name

          Write-Host ""
          Write-Host "Tag:"
          Write-Host $release.tag_name

          Write-Host ""
          Write-Host "Commit:"
          Write-Host $release.target_commitish

          Write-Host ""
          Write-Host "Published:"
          Write-Host $release.published_at

          Write-Host ""
          Write-Host "Assets:"

          if (-not $release.assets) {
              throw "Release 23.08 contains no downloadable assets."
          }

          foreach ($asset in $release.assets) {
              Write-Host ""
              Write-Host "Name: $($asset.name)"
              Write-Host "Size: $($asset.size) bytes"
              Write-Host "URL:  $($asset.browser_download_url)"
          }

      # ============================================================
      # 3. SELECIONAR ASSET WINDOWS
      #
      # A release tem poucos assets. Escolhemos o arquivo Windows
      # através do nome e verificamos que existe antes de continuar.
      # ============================================================
      - name: Select Windows release asset
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SELECTING WINDOWS ASSET"
          Write-Host "=========================================="

          $apiUrl = "https://api.github.com/repos/armory3d/armorpaint/releases/tags/23.08"

          $headers = @{
              "Accept" = "application/vnd.github+json"
              "User-Agent" = "ArmorPaint-GitHub-Actions"
          }

          $release = Invoke-RestMethod `
              -Uri $apiUrl `
              -Headers $headers `
              -Method Get

          $archives = @(
              $release.assets |
              Where-Object {
                  $_.name -match '(?i)\.(zip|7z)$'
              }
          )

          if ($archives.Count -eq 0) {
              throw "No ZIP or 7Z release asset exists in ArmorPaint 23.08."
          }

          Write-Host ""
          Write-Host "Available archives:"

          foreach ($asset in $archives) {
              Write-Host " - $($asset.name)"
          }

          # Primeiro procurar nomes explicitamente relacionados com Windows.
          $windowsAssets = @(
              $archives |
              Where-Object {
                  $_.name -match '(?i)(windows|win64|win-x64|win_x64)'
              }
          )

          if ($windowsAssets.Count -gt 1) {
              throw "Multiple Windows assets were found. Refusing to guess."
          }

          if ($windowsAssets.Count -eq 1) {
              $selected = $windowsAssets[0]
          }
          else {
              # Se a release só tiver um arquivo binário além do source,
              # usamos a informação estrutural para evitar adivinhar.
              if ($archives.Count -eq 1) {
                  $selected = $archives[0]
              }
              else {
                  Write-Host ""
                  Write-Host "Could not uniquely identify the Windows asset."

                  foreach ($asset in $archives) {
                      Write-Host ""
                      Write-Host "Candidate:"
                      Write-Host $asset.name
                      Write-Host $asset.browser_download_url
                  }

                  throw "Unable to uniquely identify ArmorPaint Windows 23.08 asset."
              }
          }

          Write-Host ""
          Write-Host "Selected asset:"
          Write-Host $selected.name

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($selected.size) bytes"

          Write-Host ""
          Write-Host "Download URL:"
          Write-Host $selected.browser_download_url

          "RELEASE_ASSET_NAME=$($selected.name)" >> $env:GITHUB_ENV
          "RELEASE_ASSET_URL=$($selected.browser_download_url)" >> $env:GITHUB_ENV
          "RELEASE_ASSET_SIZE=$($selected.size)" >> $env:GITHUB_ENV

      # ============================================================
      # 4. BAIXAR ASSET
      # ============================================================
      - name: Download official Windows asset
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DOWNLOADING OFFICIAL ARMORPAINT"
          Write-Host "=========================================="

          if (-not $env:RELEASE_ASSET_URL) {
              throw "RELEASE_ASSET_URL is not set."
          }

          $downloadDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "release_download"

          if (Test-Path $downloadDir) {
              Remove-Item `
                  $downloadDir `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $downloadDir `
              -Force |
              Out-Null

          $filePath = Join-Path `
              $downloadDir `
              $env:RELEASE_ASSET_NAME

          Write-Host ""
          Write-Host "Downloading:"
          Write-Host $env:RELEASE_ASSET_URL

          Invoke-WebRequest `
              -Uri $env:RELEASE_ASSET_URL `
              -OutFile $filePath `
              -UseBasicParsing

          if (-not (Test-Path $filePath)) {
              throw "Release asset was not downloaded."
          }

          $file = Get-Item $filePath

          Write-Host ""
          Write-Host "Downloaded:"
          Write-Host $file.FullName

          Write-Host ""
          Write-Host "Downloaded size:"
          Write-Host "$($file.Length) bytes"

          if ($file.Length -ne [int64]$env:RELEASE_ASSET_SIZE) {
              throw "Downloaded file size differs from GitHub release metadata."
          }

      # ============================================================
      # 5. 7-ZIP
      # ============================================================
      - name: Locate 7-Zip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "LOCATING 7-ZIP"
          Write-Host "=========================================="

          $candidates = @(
              "${env:ProgramFiles}\7-Zip\7z.exe",
              "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          )

          $sevenZip = $null

          foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                  $sevenZip = $candidate
                  break
              }
          }

          if (-not $sevenZip) {
              throw "7-Zip is not installed on this runner."
          }

          Write-Host ""
          Write-Host "7-Zip:"
          Write-Host $sevenZip

          "SEVEN_ZIP=$sevenZip" >> $env:GITHUB_ENV

      # ============================================================
      # 6. EXTRAIR
      # ============================================================
      - name: Extract official ArmorPaint package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "EXTRACTING ARMORPAINT"
          Write-Host "=========================================="

          $downloadDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "release_download"

          $extractDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "release_extract"

          if (Test-Path $extractDir) {
              Remove-Item `
                  $extractDir `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $extractDir `
              -Force |
              Out-Null

          $archive = Join-Path `
              $downloadDir `
              $env:RELEASE_ASSET_NAME

          if (-not (Test-Path $archive)) {
              throw "Downloaded archive not found: $archive"
          }

          $extension = [IO.Path]::GetExtension($archive).ToLowerInvariant()

          Write-Host ""
          Write-Host "Archive:"
          Write-Host $archive

          Write-Host ""
          Write-Host "Extension:"
          Write-Host $extension

          if ($extension -eq ".zip") {

              Expand-Archive `
                  -Path $archive `
                  -DestinationPath $extractDir `
                  -Force

          }
          elseif ($extension -eq ".7z") {

              & $env:SEVEN_ZIP `
                  x `
                  $archive `
                  "-o$extractDir" `
                  "-y" `
                  "-aoa"

              if ($LASTEXITCODE -ne 0) {
                  throw "7-Zip failed to extract the release archive."
              }

          }
          else {
              throw "Unsupported archive format: $extension"
          }

          Write-Host ""
          Write-Host "Extraction completed."

      # ============================================================
      # 7. LOCALIZAR ARMORPAINT.EXE
      # ============================================================
      - name: Locate ArmorPaint executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "LOCATING ARMORPAINT.EXE"
          Write-Host "=========================================="

          $extractDir = Join-Path `
              $env:GITHUB_WORKSPACE `
              "release_extract"

          $executables = @(
              Get-ChildItem `
                  -Path $extractDir `
                  -Filter "ArmorPaint.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue
          )

          if ($executables.Count -eq 0) {

              Write-Host ""
              Write-Host "Executable files found:"

              Get-ChildItem `
                  -Path $extractDir `
                  -Filter "*.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  ForEach-Object {
                      Write-Host "$($_.FullName) [$($_.Length) bytes]"
                  }

              throw "ArmorPaint.exe was not found in the official release."
          }

          if ($executables.Count -gt 1) {
              Write-Host ""
              Write-Host "Multiple ArmorPaint.exe files found:"

              foreach ($exe in $executables) {
                  Write-Host $exe.FullName
              }

              throw "Multiple ArmorPaint.exe files found."
          }

          $selected = $executables[0]

          Write-Host ""
          Write-Host "ArmorPaint.exe:"
          Write-Host $selected.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($selected.Length) bytes"

          "OFFICIAL_EXE=$($selected.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 8. CRIAR PACOTE FINAL
      #
      # Copiar literalmente toda a pasta que contém o executável.
      # ============================================================
      - name: Create portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING PORTABLE PACKAGE"
          Write-Host "=========================================="

          $sourceRoot = (Get-Item $env:OFFICIAL_EXE).Directory.FullName

          $artifact = Join-Path `
              $env:GITHUB_WORKSPACE `
              "artifact"

          if (Test-Path $artifact) {
              Remove-Item `
                  $artifact `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $artifact `
              -Force |
              Out-Null

          Write-Host ""
          Write-Host "Source:"
          Write-Host $sourceRoot

          Write-Host ""
          Write-Host "Destination:"
          Write-Host $artifact

          Copy-Item `
              -Path (Join-Path $sourceRoot "*") `
              -Destination $artifact `
              -Recurse `
              -Force

          $finalExe = Join-Path `
              $artifact `
              "ArmorPaint.exe"

          if (-not (Test-Path $finalExe)) {
              throw "ArmorPaint.exe is missing from final package."
          }

          Write-Host ""
          Write-Host "Final executable:"
          Write-Host $finalExe

      # ============================================================
      # 9. ZIP
      # ============================================================
      - name: Create ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING ZIP"
          Write-Host "=========================================="

          $artifact = Join-Path `
              $env:GITHUB_WORKSPACE `
              "artifact"

          $zip = Join-Path `
              $env:GITHUB_WORKSPACE `
              "ArmorPaint-0.9-23.08-Windows-x64.zip"

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          Compress-Archive `
              -Path (Join-Path $artifact "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "ZIP was not created."
          }

          $info = Get-Item $zip

          Write-Host ""
          Write-Host "ZIP:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 10. UPLOAD
      # ============================================================
      - name: Upload ArmorPaint 0.9 Windows x64
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11
          path: artifact
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 11. UPLOAD ZIP
      # ============================================================
      - name: Upload ArmorPaint 0.9 Windows x64 ZIP
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11-ZIP
          path: ArmorPaint-0.9-23.08-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
