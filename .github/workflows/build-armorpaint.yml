name: Build ArmorPaint 0.9 Windows x64 D3D11

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_TERMINAL_PROMPT: "0"
  GCM_INTERACTIVE: "Never"

jobs:
  build:
    name: ArmorPaint 0.9 / 23.08 / Windows x64 / D3D11
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. CHECKOUT ARMORPAINT 23.08
      #
      # 23.08 = release 0.9-armorpaint
      # ============================================================
      - name: Checkout ArmorPaint 23.08
        uses: actions/checkout@v5
        with:
          repository: armory3d/armorpaint
          ref: 23.08
          fetch-depth: 1
          submodules: false

      # ============================================================
      # 2. NODE.JS
      # ============================================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      # ============================================================
      # 3. MSBUILD
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 4. MSVC X64
      # ============================================================
      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 5. 7-ZIP
      # ============================================================
      - name: Ensure 7-Zip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING 7-ZIP"
          Write-Host "=========================================="

          $paths = @(
              "${env:ProgramFiles}\7-Zip\7z.exe",
              "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          )

          $sevenZip = $null

          foreach ($path in $paths) {
              if (Test-Path $path) {
                  $sevenZip = $path
                  break
              }
          }

          if (-not $sevenZip) {
              $command = Get-Command 7z.exe -ErrorAction SilentlyContinue

              if ($command) {
                  $sevenZip = $command.Source
              }
          }

          if (-not $sevenZip) {
              Write-Host "7-Zip not found. Installing..."
              choco install 7zip -y --no-progress

              foreach ($path in $paths) {
                  if (Test-Path $path) {
                      $sevenZip = $path
                      break
                  }
              }
          }

          if (-not $sevenZip) {
              throw "7-Zip could not be located."
          }

          Write-Host "Using 7-Zip:"
          Write-Host $sevenZip

          "SEVEN_ZIP=$sevenZip" >> $env:GITHUB_ENV

      # ============================================================
      # 6. VERIFICAR VERSÃO
      # ============================================================
      - name: Verify ArmorPaint revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ARMORPAINT REVISION"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Commit:"
          git rev-parse HEAD

          Write-Host ""
          Write-Host "Tag:"
          git describe --tags --always

          Write-Host ""
          Write-Host "ArmorCore gitlink:"
          git ls-tree HEAD armorcore

      # ============================================================
      # 7. ARMORCORE
      #
      # O SHA é obtido do gitlink do ArmorPaint enquanto o repo
      # principal ainda é um repositório Git válido.
      # ============================================================
      - name: Determine ArmorCore revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $entry = git ls-tree HEAD armorcore

          if (-not $entry) {
              throw "ArmorCore gitlink was not found."
          }

          $armorcoreSha = $entry.Split("`t")[0].Split(" ")[2]

          if (-not $armorcoreSha) {
              throw "Could not determine ArmorCore SHA."
          }

          Write-Host "ArmorCore SHA:"
          Write-Host $armorcoreSha

          "ARMORCORE_SHA=$armorcoreSha" >> $env:GITHUB_ENV

      # ============================================================
      # 8. CHECKOUT ARMORCORE
      #
      # IMPORTANTE:
      # Mantemos ArmorCore como repositório Git.
      # Isso permite acessar os gitlinks históricos de Kinc/V8.
      # ============================================================
      - name: Checkout exact ArmorCore
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING OUT ARMORCORE"
          Write-Host "=========================================="

          $path = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          if (Test-Path $path) {
              Remove-Item `
                  $path `
                  -Recurse `
                  -Force
          }

          git clone `
              --filter=blob:none `
              --no-checkout `
              https://github.com/armory3d/armorcore.git `
              $path

          if ($LASTEXITCODE -ne 0) {
              throw "ArmorCore clone failed."
          }

          Push-Location $path

          try {
              git checkout $env:ARMORCORE_SHA

              if ($LASTEXITCODE -ne 0) {
                  throw "ArmorCore checkout failed."
              }
          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "ArmorCore revision:"
          git -C $path rev-parse HEAD

      # ============================================================
      # 9. KINC
      #
      # O ArmorCore 0.9 registra exatamente:
      #
      # 60e0062139e027a59774155bdb03731beac579e7
      #
      # Esse commit está no histórico Kode/Kore.
      # ============================================================
      - name: Checkout historical Kinc
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING HISTORICAL KINC"
          Write-Host "=========================================="

          $kincPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc"

          # Valor confirmado pelo gitlink histórico do ArmorCore 0.9.
          $kincSha = "60e0062139e027a59774155bdb03731beac579e7"

          Write-Host ""
          Write-Host "Kinc SHA:"
          Write-Host $kincSha

          if (Test-Path $kincPath) {
              Remove-Item `
                  $kincPath `
                  -Recurse `
                  -Force
          }

          git clone `
              --filter=blob:none `
              --no-checkout `
              https://github.com/Kode/Kore.git `
              $kincPath

          if ($LASTEXITCODE -ne 0) {
              throw "Historical Kinc repository could not be cloned."
          }

          Push-Location $kincPath

          try {

              git fetch `
                  origin `
                  $kincSha

              if ($LASTEXITCODE -ne 0) {
                  throw "Could not fetch Kinc commit $kincSha."
              }

              git checkout $kincSha

              if ($LASTEXITCODE -ne 0) {
                  throw "Could not checkout Kinc commit $kincSha."
              }

          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "Kinc checkout:"
          git -C $kincPath rev-parse HEAD

          if ((git -C $kincPath rev-parse HEAD) -ne $kincSha) {
              throw "Kinc SHA verification failed."
          }

      # ============================================================
      # 10. VERIFICAR KINC TOOLS GITLINK
      #
      # Agora podemos usar ls-tree porque Kinc continua sendo
      # um repositório Git.
      #
      # Não vamos baixar o repositório histórico morto.
      # O SHA é usado apenas para diagnóstico.
      # ============================================================
      - name: Inspect historical Kinc tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INSPECTING KINC TOOLS"
          Write-Host "=========================================="

          $kincPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc"

          $entry = git -C $kincPath ls-tree HEAD Tools/windows_x64

          if ($entry) {
              Write-Host ""
              Write-Host "Historical Tools/windows_x64 gitlink:"
              Write-Host $entry

              $toolsSha = $entry.Split("`t")[0].Split(" ")[2]

              if ($toolsSha) {
                  Write-Host ""
                  Write-Host "Historical tools SHA:"
                  Write-Host $toolsSha

                  "HISTORICAL_TOOLS_SHA=$toolsSha" >> $env:GITHUB_ENV
              }
          }
          else {
              Write-Warning "Historical Kinc does not expose Tools/windows_x64 as a gitlink."
              Write-Warning "Continuing with the current Kode tool package."
          }

      # ============================================================
      # 11. KINC TOOLS ATUAIS
      #
      # O repositório histórico armory3d/KincTools_windows_x64
      # não está mais disponível pelo URL antigo.
      #
      # Kode/KoreTools_windows_x64 é o sucessor atual.
      # ============================================================
      - name: Download Kinc Windows tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DOWNLOADING KINC WINDOWS TOOLS"
          Write-Host "=========================================="

          $tools = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc\Tools\windows_x64"

          $archive = Join-Path `
              $env:RUNNER_TEMP `
              "KoreTools_windows_x64.zip"

          $extract = Join-Path `
              $env:RUNNER_TEMP `
              "KoreTools_extract"

          $url = "https://github.com/Kode/KoreTools_windows_x64/archive/refs/heads/main.zip"

          if (Test-Path $tools) {
              Remove-Item `
                  $tools `
                  -Recurse `
                  -Force
          }

          if (Test-Path $archive) {
              Remove-Item `
                  $archive `
                  -Force
          }

          if (Test-Path $extract) {
              Remove-Item `
                  $extract `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $extract `
              -Force |
              Out-Null

          Write-Host ""
          Write-Host "Download URL:"
          Write-Host $url

          Invoke-WebRequest `
              -Uri $url `
              -OutFile $archive `
              -UseBasicParsing

          if (-not (Test-Path $archive)) {
              throw "KoreTools archive was not downloaded."
          }

          Write-Host ""
          Write-Host "Archive size:"
          Write-Host "$((Get-Item $archive).Length) bytes"

          Expand-Archive `
              -Path $archive `
              -DestinationPath $extract `
              -Force

          $root = Get-ChildItem `
              $extract `
              -Directory |
              Select-Object -First 1

          if (-not $root) {
              throw "KoreTools extraction failed."
          }

          New-Item `
              -ItemType Directory `
              -Path $tools `
              -Force |
              Out-Null

          Copy-Item `
              -Path (Join-Path $root.FullName "*") `
              -Destination $tools `
              -Recurse `
              -Force

          Write-Host ""
          Write-Host "Tools installed at:"
          Write-Host $tools

      # ============================================================
      # 12. VALIDAR KINC TOOLS
      # ============================================================
      - name: Verify Kinc Windows tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING KINC TOOLS"
          Write-Host "=========================================="

          $tools = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc\Tools\windows_x64"

          if (-not (Test-Path $tools)) {
              throw "KincTools directory was not created."
          }

          $required = @(
              "kmake.exe",
              "kraffiti.exe",
              "krafix.exe",
              "D3DCompiler_47.dll",
              "dxcompiler.dll",
              "dxil.dll"
          )

          foreach ($name in $required) {

              $file = Join-Path `
                  $tools `
                  $name

              if (-not (Test-Path $file)) {
                  throw "Required Kinc tool is missing: $name"
              }

              $info = Get-Item $file

              if ($info.Length -eq 0) {
                  throw "Required Kinc tool is empty: $name"
              }

              Write-Host "OK: $name [$($info.Length) bytes]"
          }

      # ============================================================
      # 13. V8
      #
      # ArmorCore também referencia V8 como gitlink.
      # Mantemos o repositório Git para fazer checkout exato.
      # ============================================================
      - name: Determine V8 revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "V8 REVISION"
          Write-Host "=========================================="

          $armorcore = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $entry = git -C $armorcore ls-tree HEAD v8

          if (-not $entry) {
              throw "V8 gitlink not found in ArmorCore."
          }

          $v8Sha = $entry.Split("`t")[0].Split(" ")[2]

          if (-not $v8Sha) {
              throw "Could not determine V8 SHA."
          }

          Write-Host ""
          Write-Host "V8 SHA:"
          Write-Host $v8Sha

          "V8_SHA=$v8Sha" >> $env:GITHUB_ENV

      # ============================================================
      # 14. CHECKOUT V8
      # ============================================================
      - name: Checkout exact V8
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING OUT V8"
          Write-Host "=========================================="

          $v8Path = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8"

          if (Test-Path $v8Path) {
              Remove-Item `
                  $v8Path `
                  -Recurse `
                  -Force
          }

          git clone `
              --filter=blob:none `
              --no-checkout `
              https://github.com/armory3d/v8_bin.git `
              $v8Path

          if ($LASTEXITCODE -ne 0) {
              throw "V8 clone failed."
          }

          Push-Location $v8Path

          try {

              git fetch `
                  origin `
                  $env:V8_SHA

              if ($LASTEXITCODE -ne 0) {
                  throw "Could not fetch V8 revision."
              }

              git checkout $env:V8_SHA

              if ($LASTEXITCODE -ne 0) {
                  throw "Could not checkout V8 revision."
              }

          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "V8 revision:"
          git -C $v8Path rev-parse HEAD

          if ((git -C $v8Path rev-parse HEAD) -ne $env:V8_SHA) {
              throw "V8 SHA verification failed."
          }

      # ============================================================
      # 15. VERIFICAR V8 MONOLITH
      # ============================================================
      - name: Verify V8 monolith
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING V8 MONOLITH"
          Write-Host "=========================================="

          $release = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release"

          $archive = Join-Path `
              $release `
              "v8_monolith.7z"

          if (-not (Test-Path $archive)) {

              Write-Host ""
              Write-Host "Available V8 files:"

              if (Test-Path $release) {
                  Get-ChildItem `
                      $release `
                      -Recurse |
                      Select-Object FullName, Length
              }

              throw "v8_monolith.7z was not found."
          }

          Write-Host ""
          Write-Host "Found:"
          Write-Host $archive

      # ============================================================
      # 16. EXTRAIR V8 MONOLITH
      # ============================================================
      - name: Extract V8 monolith
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "EXTRACTING V8 MONOLITH"
          Write-Host "=========================================="

          $release = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release"

          $archive = Join-Path `
              $release `
              "v8_monolith.7z"

          $lib = Join-Path `
              $release `
              "v8_monolith.lib"

          if (-not (Test-Path $lib)) {

              & $env:SEVEN_ZIP `
                  x `
                  $archive `
                  "-o$release" `
                  "-y" `
                  "-aoa"

              if ($LASTEXITCODE -ne 0) {
                  throw "V8 extraction failed."
              }
          }

          if (-not (Test-Path $lib)) {
              throw "v8_monolith.lib was not extracted."
          }

          $info = Get-Item $lib

          Write-Host ""
          Write-Host "v8_monolith.lib:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 17. VERIFICAR ARMORCORE
      # ============================================================
      - name: Verify complete source tree
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING COMPLETE BUILD TREE"
          Write-Host "=========================================="

          $required = @(
              "armorcore\make",
              "armorcore\Kinc",
              "armorcore\Kinc\make",
              "armorcore\Kinc\Tools\windows_x64\kmake.exe",
              "armorcore\Kinc\Tools\windows_x64\kraffiti.exe",
              "armorcore\Kinc\Tools\windows_x64\krafix.exe",
              "armorcore\v8\include",
              "armorcore\v8\libraries\win32\release\v8_monolith.lib",
              "paint"
          )

          foreach ($path in $required) {

              if (-not (Test-Path $path)) {
                  throw "Required build path missing: $path"
              }

              Write-Host "OK: $path"
          }

      # ============================================================
      # 18. PATCH WINDOW HANDLING
      # ============================================================
      - name: Apply window handling patch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "APPLYING WINDOW HANDLING PATCH"
          Write-Host "=========================================="

          $armorcore = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $patch = Join-Path `
              $armorcore `
              "patch\window_handling.diff"

          if (-not (Test-Path $patch)) {
              throw "window_handling.diff not found."
          }

          Push-Location $armorcore

          try {

              git apply `
                  --check `
                  "patch/window_handling.diff" `
                  --directory=Kinc

              if ($LASTEXITCODE -ne 0) {
                  throw "window_handling.diff does not apply cleanly to this Kinc revision."
              }

              git apply `
                  "patch/window_handling.diff" `
                  --directory=Kinc

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to apply window_handling.diff."
              }

          }
          finally {
              Pop-Location
          }

          Write-Host "Patch applied successfully."

      # ============================================================
      # 19. GERAR PROJETO D3D11
      #
      # Fluxo histórico do ArmorPaint 0.9.
      # ============================================================
      - name: Generate ArmorPaint D3D11 project
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          echo ==========================================
          echo GENERATING ARMORPAINT D3D11 PROJECT
          echo ==========================================

          armorcore\Kinc\make --from armorcore -g direct3d11

          if errorlevel 1 (
              echo.
              echo ==========================================
              echo KINC MAKE FAILED
              echo ==========================================
              exit /b 1
          )

          echo.
          echo Kinc make completed successfully.

      # ============================================================
      # 20. VERIFICAR SOLUTION
      # ============================================================
      - name: Verify generated Visual Studio solution
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING GENERATED SOLUTION"
          Write-Host "=========================================="

          $expected = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\ArmorPaint.sln"

          if (Test-Path $expected) {

              Write-Host ""
              Write-Host "Found:"
              Write-Host $expected

              "ARMORPAINT_SOLUTION=$expected" >> $env:GITHUB_ENV
              exit 0
          }

          Write-Host ""
          Write-Host "Searching for solutions..."

          $solutions = Get-ChildItem `
              $env:GITHUB_WORKSPACE `
              -Include "*.sln","*.slnx" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

          if (-not $solutions) {

              Write-Host ""
              Write-Host "Generated build tree:"

              if (Test-Path (Join-Path $env:GITHUB_WORKSPACE "build")) {
                  Get-ChildItem `
                      (Join-Path $env:GITHUB_WORKSPACE "build") `
                      -Recurse |
                      Select-Object FullName
              }

              throw "No Visual Studio solution was generated."
          }

          foreach ($solution in $solutions) {
              Write-Host $solution.FullName
          }

          $selected = $solutions |
              Where-Object {
                  $_.Name -eq "ArmorPaint.sln"
              } |
              Select-Object -First 1

          if (-not $selected) {
              $selected = $solutions | Select-Object -First 1
          }

          Write-Host ""
          Write-Host "Selected:"
          Write-Host $selected.FullName

          "ARMORPAINT_SOLUTION=$($selected.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 21. COMPILAR RELEASE X64
      # ============================================================
      - name: Build ArmorPaint Release x64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILDING ARMORPAINT RELEASE X64"
          Write-Host "=========================================="

          if (-not $env:ARMORPAINT_SOLUTION) {
              throw "ARMORPAINT_SOLUTION is not defined."
          }

          Write-Host ""
          Write-Host "Solution:"
          Write-Host $env:ARMORPAINT_SOLUTION

          & msbuild.exe `
              $env:ARMORPAINT_SOLUTION `
              /m `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE."
          }

          Write-Host ""
          Write-Host "MSBuild completed successfully."

      # ============================================================
      # 22. LOCALIZAR EXE
      # ============================================================
      - name: Find ArmorPaint executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SEARCHING ARMORPAINT.EXE"
          Write-Host "=========================================="

          $build = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build"

          $matches = @(
              Get-ChildItem `
                  $build `
                  -Filter "ArmorPaint.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue
          )

          if ($matches.Count -eq 0) {

              Write-Host ""
              Write-Host "Available executables:"

              Get-ChildItem `
                  $build `
                  -Include "*.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object FullName, Length

              throw "ArmorPaint.exe was not generated."
          }

          Write-Host ""
          Write-Host "Candidates:"

          foreach ($match in $matches) {
              Write-Host "$($match.FullName) [$($match.Length) bytes]"
          }

          $selected = $matches |
              Where-Object {
                  $_.FullName -match "\\x64\\Release\\ArmorPaint\.exe$"
              } |
              Select-Object -First 1

          if (-not $selected) {
              $selected = $matches | Select-Object -First 1
          }

          if ($selected.Length -lt 1000000) {
              throw "ArmorPaint.exe is suspiciously small."
          }

          Write-Host ""
          Write-Host "Selected:"
          Write-Host $selected.FullName

          "ARMORPAINT_EXE=$($selected.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 23. MONTAR BUILD/KROM
      # ============================================================
      - name: Assemble portable ArmorPaint package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ASSEMBLING PORTABLE PACKAGE"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $release = Split-Path `
              $env:ARMORPAINT_EXE `
              -Parent

          if (-not (Test-Path $krom)) {
              throw "build\krom does not exist."
          }

          if (-not (Test-Path $release)) {
              throw "Release directory does not exist."
          }

          Write-Host ""
          Write-Host "Release:"
          Write-Host $release

          Write-Host ""
          Write-Host "Runtime:"
          Write-Host $krom

          Copy-Item `
              -Path (Join-Path $release "*") `
              -Destination $krom `
              -Recurse `
              -Force

          $finalExe = Join-Path `
              $krom `
              "ArmorPaint.exe"

          if (-not (Test-Path $finalExe)) {
              Copy-Item `
                  $env:ARMORPAINT_EXE `
                  $finalExe `
                  -Force
          }

          if (-not (Test-Path $finalExe)) {
              throw "ArmorPaint.exe was not copied into build\krom."
          }

          Write-Host ""
          Write-Host "Final executable:"
          Write-Host $finalExe

      # ============================================================
      # 24. VERIFICAÇÃO FINAL
      # ============================================================
      - name: Verify final package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "FINAL PACKAGE VERIFICATION"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $exe = Join-Path `
              $krom `
              "ArmorPaint.exe"

          if (-not (Test-Path $krom)) {
              throw "build\krom does not exist."
          }

          if (-not (Test-Path $exe)) {
              throw "ArmorPaint.exe does not exist."
          }

          $info = Get-Item $exe

          if ($info.Length -lt 1000000) {
              throw "Final ArmorPaint.exe is suspiciously small."
          }

          $files = @(
              Get-ChildItem `
                  $krom `
                  -Recurse `
                  -File
          )

          if ($files.Count -eq 0) {
              throw "Final package is empty."
          }

          Write-Host ""
          Write-Host "ArmorPaint.exe:"
          Write-Host $exe

          Write-Host ""
          Write-Host "Executable size:"
          Write-Host "$($info.Length) bytes"

          Write-Host ""
          Write-Host "Files:"
          Write-Host $files.Count

      # ============================================================
      # 25. ZIP
      # ============================================================
      - name: Create ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING ZIP"
          Write-Host "=========================================="

          $source = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $zip = Join-Path `
              $env:GITHUB_WORKSPACE `
              "ArmorPaint-0.9-23.08-Windows-x64-D3D11.zip"

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          Compress-Archive `
              -Path (Join-Path $source "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "ZIP creation failed."
          }

          $info = Get-Item $zip

          Write-Host ""
          Write-Host "ZIP:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "ZIP size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 26. UPLOAD DIRETÓRIO
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11
          path: build/krom
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 27. UPLOAD ZIP
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11 ZIP
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11-ZIP
          path: ArmorPaint-0.9-23.08-Windows-x64-D3D11.zip
          if-no-files-found: error
          compression-level: 0
