name: Build ArmorPaint Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout ArmorPaint
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1


      # ============================================================
      # 2. Visual Studio
      # ============================================================

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      # ============================================================
      # 3. Descobrir a estrutura REAL do repositório
      # ============================================================

      - name: Inspect repository
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "CURRENT DIRECTORY"
          Write-Host "=========================================="

          Get-Location

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "ROOT CONTENT"
          Write-Host "=========================================="

          Get-ChildItem -Force


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "ALL MAKE.BAT FILES"
          Write-Host "=========================================="

          $makes = Get-ChildItem `
            -Path $PWD `
            -Filter "make.bat" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if ($makes.Count -eq 0) {
            Write-Error "Nenhum make.bat encontrado."
            exit 1
          }

          foreach ($make in $makes) {
            Write-Host $make.FullName
          }


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "ALL MAKE FILES"
          Write-Host "=========================================="

          Get-ChildItem `
            -Path $PWD `
            -Include "make","make.sh","Makefile","make.bat" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object FullName


      # ============================================================
      # 4. Encontrar e executar o make.bat correto
      # ============================================================

      - name: Generate ArmorPaint project
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "SEARCHING FOR ARMORPAINT MAKE.BAT"
          Write-Host "=========================================="


          $repo = $PWD


          # Procurar todos os make.bat
          $makes = @(
            Get-ChildItem `
              -Path $repo `
              -Filter "make.bat" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue
          )


          if ($makes.Count -eq 0) {
            Write-Error "Nenhum make.bat encontrado."
            exit 1
          }


          Write-Host ""
          Write-Host "Encontrados:"

          foreach ($make in $makes) {
            Write-Host $make.FullName
          }


          # ----------------------------------------------------------
          # Preferir um make.bat localizado em uma pasta chamada base
          # ----------------------------------------------------------

          $make = $makes |
            Where-Object {
              $_.Directory.Name -eq "base"
            } |
            Select-Object -First 1


          # ----------------------------------------------------------
          # Se não encontrou, procurar um make.bat que tenha
          # ArmorPaint relacionado na estrutura.
          # ----------------------------------------------------------

          if (-not $make) {

            $make = $makes |
              Where-Object {
                $_.FullName -match "armorpaint"
              } |
              Select-Object -First 1

          }


          # ----------------------------------------------------------
          # Último recurso: primeiro make.bat encontrado
          # ----------------------------------------------------------

          if (-not $make) {

            Write-Host ""
            Write-Host "Não foi possível identificar automaticamente."
            Write-Host "Usando o primeiro make.bat."

            $make = $makes | Select-Object -First 1

          }


          Write-Host ""
          Write-Host "=========================================="
          Write-Host "MAKE.BAT SELECIONADO"
          Write-Host "=========================================="

          Write-Host $make.FullName


          # ----------------------------------------------------------
          # Executar no diretório do próprio make.bat
          # ----------------------------------------------------------

          Set-Location $make.Directory.FullName


          Write-Host ""
          Write-Host "Working directory:"
          Get-Location


          Write-Host ""
          Write-Host "Executando make.bat..."


          & $make.FullName


          if ($LASTEXITCODE -ne 0) {

            Write-Error `
              "make.bat terminou com código $LASTEXITCODE."

            exit $LASTEXITCODE

          }


      # ============================================================
      # 5. Procurar ArmorPaint.sln
      # ============================================================

      - name: Find ArmorPaint solution
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "SEARCHING FOR ARMORPAINT.SLN"
          Write-Host "=========================================="


          $solutions = @(
            Get-ChildItem `
              -Path $PWD `
              -Filter "ArmorPaint.sln" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue
          )


          if ($solutions.Count -eq 0) {

            Write-Error "ArmorPaint.sln não foi encontrado."

            Write-Host ""
            Write-Host "Solutions disponíveis:"

            Get-ChildItem `
              -Path $PWD `
              -Filter "*.sln" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName

            exit 1

          }


          foreach ($solution in $solutions) {

            Write-Host ""
            Write-Host "Solution:"
            Write-Host $solution.FullName

          }


      # ============================================================
      # 6. Compilar
      # ============================================================

      - name: Build ArmorPaint Release x64
        shell: powershell
        run: |

          $solution = Get-ChildItem `
            -Path $PWD `
            -Filter "ArmorPaint.sln" `
            -Recurse `
            -File |
            Select-Object -First 1


          if (-not $solution) {

            Write-Error "ArmorPaint.sln não encontrado."
            exit 1

          }


          Write-Host "=========================================="
          Write-Host "BUILDING ARMORPAINT"
          Write-Host "=========================================="


          Write-Host "Solution:"
          Write-Host $solution.FullName


          & msbuild `
            $solution.FullName `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal


          if ($LASTEXITCODE -ne 0) {

            Write-Error "MSBuild falhou."
            exit $LASTEXITCODE

          }


      # ============================================================
      # 7. Procurar executável
      # ============================================================

      - name: Find ArmorPaint executable
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "SEARCHING FOR ARMORPAINT.EXE"
          Write-Host "=========================================="


          $executables = @(
            Get-ChildItem `
              -Path $PWD `
              -Filter "ArmorPaint.exe" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue
          )


          if ($executables.Count -eq 0) {

            Write-Error "ArmorPaint.exe não encontrado."
            exit 1

          }


          foreach ($exe in $executables) {

            Write-Host ""
            Write-Host $exe.FullName

            Write-Host (
              "Size: {0:N2} MB" -f ($exe.Length / 1MB)
            )

          }


      # ============================================================
      # 8. Encontrar build/krom
      # ============================================================

      - name: Locate krom directory
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "SEARCHING FOR KROM DIRECTORY"
          Write-Host "=========================================="


          $kroms = @(
            Get-ChildItem `
              -Path $PWD `
              -Directory `
              -Filter "krom" `
              -Recurse `
              -ErrorAction SilentlyContinue
          )


          if ($kroms.Count -eq 0) {

            Write-Error "Nenhuma pasta krom encontrada."

            Write-Host ""
            Write-Host "Pastas build encontradas:"

            Get-ChildItem `
              -Path $PWD `
              -Directory `
              -Filter "build" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object FullName

            exit 1

          }


          foreach ($krom in $kroms) {

            Write-Host ""
            Write-Host "Krom:"
            Write-Host $krom.FullName

          }


      # ============================================================
      # 9. Montar pacote completo
      # ============================================================

      - name: Create complete package
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "CREATING COMPLETE PACKAGE"
          Write-Host "=========================================="


          # ----------------------------------------------------------
          # Procurar krom
          # ----------------------------------------------------------

          $krom = Get-ChildItem `
            -Path $PWD `
            -Directory `
            -Filter "krom" `
            -Recurse |
            Where-Object {
              Test-Path (Join-Path $_.FullName "krom.js")
            } |
            Select-Object -First 1


          if (-not $krom) {

            Write-Error `
              "Pasta krom contendo krom.js não encontrada."

            exit 1

          }


          Write-Host ""
          Write-Host "Krom selecionado:"
          Write-Host $krom.FullName


          # ----------------------------------------------------------
          # Procurar executável Release
          # ----------------------------------------------------------

          $exe = Get-ChildItem `
            -Path $PWD `
            -Filter "ArmorPaint.exe" `
            -Recurse |
            Where-Object {
              $_.FullName -notlike "*\krom\ArmorPaint.exe"
            } |
            Sort-Object FullName |
            Select-Object -First 1


          if (-not $exe) {

            Write-Error "ArmorPaint.exe compilado não encontrado."
            exit 1

          }


          Write-Host ""
          Write-Host "Executável:"
          Write-Host $exe.FullName


          # ----------------------------------------------------------
          # Copiar para krom
          # ----------------------------------------------------------

          Copy-Item `
            $exe.FullName `
            (Join-Path $krom.FullName "ArmorPaint.exe") `
            -Force


          # ----------------------------------------------------------
          # Criar artifact
          # ----------------------------------------------------------

          if (Test-Path ".\artifact") {

            Remove-Item `
              ".\artifact" `
              -Recurse `
              -Force

          }


          New-Item `
            -ItemType Directory `
            -Path ".\artifact" `
            -Force |
            Out-Null


          # ----------------------------------------------------------
          # Copiar TODO krom
          # ----------------------------------------------------------

          Copy-Item `
            (Join-Path $krom.FullName "*") `
            ".\artifact\" `
            -Recurse `
            -Force


      # ============================================================
      # 10. Verificar tamanho
      # ============================================================

      - name: Verify package
        shell: powershell
        run: |

          Write-Host "=========================================="
          Write-Host "FINAL PACKAGE"
          Write-Host "=========================================="


          $files = Get-ChildItem `
            ".\artifact" `
            -Recurse `
            -File


          foreach ($file in $files) {

            Write-Host $file.FullName

          }


          $size = (
            $files |
            Measure-Object Length -Sum
          ).Sum


          Write-Host ""
          Write-Host (
            "TOTAL SIZE: {0:N2} MB" -f ($size / 1MB)
          )


          if (-not (Test-Path ".\artifact\ArmorPaint.exe")) {

            Write-Error `
              "ArmorPaint.exe não está no pacote."

            exit 1

          }


          if (-not (Test-Path ".\artifact\krom.js")) {

            Write-Error `
              "krom.js não está no pacote."

            exit 1

          }


      # ============================================================
      # 11. Upload
      # ============================================================

      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-complete
          path: artifact
          compression-level: 0
          if-no-files-found: error
