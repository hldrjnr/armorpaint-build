name: Build ArmorPaint Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout ArmorPaint
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate ArmorPaint project
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "GENERATING PROJECT VIA NODE.JS"
          Write-Host "=========================================="
          
          if (Test-Path "armorcore\make.js") {
              Write-Host "Usando gerador ArmorCore..."
              node armorcore/make -g direct3d11
          } elseif (Test-Path "Kinc\make.js") {
              Write-Host "Usando gerador Kinc..."
              node Kinc/make -g direct3d11
          } else {
              Write-Error "Sistema de build (make.js) não encontrado."
              exit 1
          }

      - name: Build ArmorPaint Release x64
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "BUILDING SOLUTION"
          Write-Host "=========================================="
          
          if (-not (Test-Path "build/ArmorPaint.sln")) {
              Write-Error "ArmorPaint.sln não foi gerado."
              exit 1
          }
          
          msbuild build/ArmorPaint.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Create complete package
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "ASSEMBLING ARTIFACT"
          Write-Host "=========================================="
          
          New-Item -ItemType Directory -Path ".\artifact" -Force | Out-Null
          
          # A) Localizar e copiar a pasta Krom
          $krom = Get-ChildItem -Path ".\build" -Directory -Filter "krom" -Recurse | Select-Object -First 1
          if (-not $krom) {
              Write-Error "Pasta krom não encontrada."
              exit 1
          }
          Write-Host "Copiando arquivos krom..."
          Copy-Item "$($krom.FullName)\*" ".\artifact\" -Recurse -Force
          
          # B) Localizar e copiar o executável
          $exe = Get-ChildItem -Path ".\build" -Filter "ArmorPaint.exe" -Recurse | Where-Object { $_.Directory.Name -ne "krom" } | Select-Object -First 1
          if (-not $exe) {
              Write-Error "ArmorPaint.exe não encontrado."
              exit 1
          }
          Write-Host "Copiando executável: $($exe.FullName)"
          Copy-Item $exe.FullName ".\artifact\ArmorPaint.exe" -Force
          
          Write-Host "=========================================="
          Write-Host "FINAL PACKAGE CONTENT"
          Write-Host "=========================================="
          Get-ChildItem ".\artifact" | Select-Object Name

      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-complete
          path: artifact
          compression-level: 0
          if-no-files-found: error
          
