name: Build ArmorPaint Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # ============================================================
      # 1. Baixar o Repositório Oficial do ArmorPaint
      # ============================================================
      - name: Checkout Official ArmorPaint
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # 2. Configurar Ferramentas
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 3. Gerar Arquivos da Solution (.sln)
      # ============================================================
      - name: Generate ArmorPaint project
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "SEARCHING FOR BUILD SYSTEM"
          Write-Host "=========================================="
          
          # Procura o make.js recursivamente na pasta armorcore ou Kinc
          $makeJs = Get-ChildItem -Path . -Filter "make.js" -Recurse -ErrorAction SilentlyContinue | 
                    Where-Object { $_.Directory.Name -match '^(armorcore|Kinc)$' } | 
                    Select-Object -First 1
          
          if (-not $makeJs) {
              Write-Error "make.js não encontrado. O clone oficial falhou."
              exit 1
          }
          
          $engineDir = $makeJs.Directory.Name
          $projectRoot = $makeJs.Directory.Parent.FullName
          
          Write-Host "Projeto base encontrado em: $projectRoot"
          Write-Host "Usando engine: $engineDir"
          
          # Vai até a raiz do código oficial e roda o node
          Set-Location $projectRoot
          node "$engineDir/make" -g direct3d11

      # ============================================================
      # 4. Compilar
      # ============================================================
      - name: Build ArmorPaint Release x64
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "BUILDING SOLUTION"
          Write-Host "=========================================="
          
          # Procura a solution gerada
          $sln = Get-ChildItem -Path . -Filter "ArmorPaint.sln" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if (-not $sln) {
              Write-Error "ArmorPaint.sln não foi gerado."
              exit 1
          }
          
          Write-Host "Compilando: $($sln.FullName)"
          msbuild $sln.FullName /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      # ============================================================
      # 5. Montar Pacote Final
      # ============================================================
      - name: Create complete package
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "ASSEMBLING ARTIFACT"
          Write-Host "=========================================="
          
          New-Item -ItemType Directory -Path ".\artifact" -Force | Out-Null
          
          # A) Localizar e copiar a pasta Krom correta (a que contém o krom.js)
          $krom = Get-ChildItem -Path . -Directory -Filter "krom" -Recurse -ErrorAction SilentlyContinue | 
                  Where-Object { Test-Path (Join-Path $_.FullName "krom.js") } | 
                  Select-Object -First 1
                  
          if (-not $krom) {
              Write-Error "Pasta krom (contendo krom.js) não encontrada."
              exit 1
          }
          Write-Host "Copiando arquivos krom de: $($krom.FullName)"
          Copy-Item "$($krom.FullName)\*" ".\artifact\" -Recurse -Force
          
          # B) Localizar o executável compilado ignorando pastas indesejadas
          $exe = Get-ChildItem -Path . -Filter "ArmorPaint.exe" -Recurse -ErrorAction SilentlyContinue | 
                 Where-Object { $_.FullName -notmatch "krom[\\/]ArmorPaint\.exe" } | 
                 Select-Object -First 1
                 
          if (-not $exe) {
              Write-Error "ArmorPaint.exe compilado não encontrado."
              exit 1
          }
          Write-Host "Copiando executável de: $($exe.FullName)"
          Copy-Item $exe.FullName ".\artifact\ArmorPaint.exe" -Force
          
          Write-Host "=========================================="
          Write-Host "FINAL PACKAGE CONTENT"
          Write-Host "=========================================="
          Get-ChildItem ".\artifact" | Select-Object Name

      # ============================================================
      # 6. Upload do Artefato
      # ============================================================
      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: artifact
          compression-level: 0
          if-no-files-found: error
          
