name: Build ArmorPaint 0.9 Windows x64 D3D11

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_TERMINAL_PROMPT: "0"
  GCM_INTERACTIVE: "Never"

jobs:
  build:
    name: ArmorPaint 0.9 - Windows x64 - Direct3D11
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. CHECKOUT ARMORPAINT 0.9
      #
      # 0.9-armorpaint = tag 23.08
      # ============================================================
      - name: Checkout ArmorPaint 23.08
        uses: actions/checkout@v5
        with:
          repository: armory3d/armorpaint
          ref: 23.08
          fetch-depth: 1
          submodules: false

      # ============================================================
      # 2. NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      # ============================================================
      # 3. MSBUILD
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 4. MSVC X64
      # ============================================================
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 5. VERIFICAR FERRAMENTAS BASE
      # ============================================================
      - name: Verify build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILD ENVIRONMENT"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Node:"
          node --version

          Write-Host ""
          Write-Host "npm:"
          npm --version

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "MSBuild:"
          msbuild.exe -version

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

      # ============================================================
      # 6. VERIFICAR ARMORPAINT
      # ============================================================
      - name: Verify ArmorPaint revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ARMORPAINT REVISION"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Commit:"
          git rev-parse HEAD

          Write-Host ""
          Write-Host "Tag:"
          git describe --tags --always

          Write-Host ""
          Write-Host "ArmorCore gitlink:"
          git ls-tree HEAD armorcore

      # ============================================================
      # 7. OBTER SHA DO ARMORCORE
      # ============================================================
      - name: Determine ArmorCore revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ARMORCORE REVISION"
          Write-Host "=========================================="

          $entry = git ls-tree HEAD armorcore

          if (-not $entry) {
              throw "ArmorCore gitlink was not found."
          }

          $sha = $entry.Split("`t")[0].Split(" ")[2]

          if (-not $sha) {
              throw "Could not determine ArmorCore SHA."
          }

          Write-Host ""
          Write-Host "ArmorCore SHA:"
          Write-Host $sha

          "ARMORCORE_SHA=$sha" >> $env:GITHUB_ENV

      # ============================================================
      # 8. DOWNLOAD ARMORCORE EXATO
      # ============================================================
      - name: Download ArmorCore exact revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DOWNLOADING ARMORCORE"
          Write-Host "=========================================="

          $destination = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $archive = Join-Path `
              $env:RUNNER_TEMP `
              "armorcore.zip"

          $extract = Join-Path `
              $env:RUNNER_TEMP `
              "armorcore_extract"

          $url = "https://github.com/armory3d/armorcore/archive/$env:ARMORCORE_SHA.zip"

          if (Test-Path $destination) {
              Remove-Item $destination -Recurse -Force
          }

          if (Test-Path $archive) {
              Remove-Item $archive -Force
          }

          if (Test-Path $extract) {
              Remove-Item $extract -Recurse -Force
          }

          Write-Host ""
          Write-Host "URL:"
          Write-Host $url

          Invoke-WebRequest `
              -Uri $url `
              -OutFile $archive `
              -UseBasicParsing

          if (-not (Test-Path $archive)) {
              throw "ArmorCore archive was not downloaded."
          }

          New-Item `
              -ItemType Directory `
              -Path $extract `
              -Force |
              Out-Null

          Expand-Archive `
              -Path $archive `
              -DestinationPath $extract `
              -Force

          $root = Get-ChildItem `
              $extract `
              -Directory |
              Select-Object -First 1

          if (-not $root) {
              throw "ArmorCore archive extraction failed."
          }

          New-Item `
              -ItemType Directory `
              -Path $destination `
              -Force |
              Out-Null

          Copy-Item `
              -Path (Join-Path $root.FullName "*") `
              -Destination $destination `
              -Recurse `
              -Force

          Write-Host ""
          Write-Host "ArmorCore installed at:"
          Write-Host $destination

      # ============================================================
      # 9. DEFINIR KINC HISTÓRICO
      #
      # O ArmorCore 0.9 referencia este commit:
      #
      # 60e0062139e027a59774155bdb03731beac579e7
      #
      # Esse histórico está atualmente no Kode/Kore.
      # ============================================================
      - name: Set historical Kinc revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $kincSha = (
              git -C "$env:GITHUB_WORKSPACE\armorcore" `
                  ls-tree HEAD Kinc
          ).Split("`t")[0].Split(" ")[2]

          if (-not $kincSha) {
              throw "Could not determine Kinc revision from ArmorCore."
          }

          Write-Host "Kinc SHA:"
          Write-Host $kincSha

          "KINC_SHA=$kincSha" >> $env:GITHUB_ENV

      # ============================================================
      # 10. DOWNLOAD KINC/KORE HISTÓRICO
      # ============================================================
      - name: Download historical Kinc
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DOWNLOADING HISTORICAL KINC"
          Write-Host "=========================================="

          $destination = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc"

          $archive = Join-Path `
              $env:RUNNER_TEMP `
              "kinc.zip"

          $extract = Join-Path `
              $env:RUNNER_TEMP `
              "kinc_extract"

          $url = "https://github.com/Kode/Kore/archive/$env:KINC_SHA.zip"

          if (Test-Path $destination) {
              Remove-Item $destination -Recurse -Force
          }

          if (Test-Path $archive) {
              Remove-Item $archive -Force
          }

          if (Test-Path $extract) {
              Remove-Item $extract -Recurse -Force
          }

          Write-Host ""
          Write-Host "Kinc SHA:"
          Write-Host $env:KINC_SHA

          Write-Host ""
          Write-Host "URL:"
          Write-Host $url

          Invoke-WebRequest `
              -Uri $url `
              -OutFile $archive `
              -UseBasicParsing

          if (-not (Test-Path $archive)) {
              throw "Kinc archive was not downloaded."
          }

          New-Item `
              -ItemType Directory `
              -Path $extract `
              -Force |
              Out-Null

          Expand-Archive `
              -Path $archive `
              -DestinationPath $extract `
              -Force

          $root = Get-ChildItem `
              $extract `
              -Directory |
              Select-Object -First 1

          if (-not $root) {
              throw "Kinc extraction failed."
          }

          New-Item `
              -ItemType Directory `
              -Path $destination `
              -Force |
              Out-Null

          Copy-Item `
              -Path (Join-Path $root.FullName "*") `
              -Destination $destination `
              -Recurse `
              -Force

          Write-Host ""
          Write-Host "Kinc installed:"
          Write-Host $destination

      # ============================================================
      # 11. BAIXAR KINC TOOLS
      #
      # NÃO usamos submodule.
      #
      # O repositório antigo:
      #   armory3d/KincTools_windows_x64
      #
      # deixou de estar acessível pela URL histórica.
      #
      # O sucessor atual:
      #   Kode/KoreTools_windows_x64
      #
      # contém:
      #   kmake.exe
      #   kraffiti.exe
      #   krafix.exe
      #   D3DCompiler_47.dll
      #   dxcompiler.dll
      #   dxil.dll
      #
      # O Kinc histórico procura esses executáveis em
      # Tools/windows_x64.
      # ============================================================
      - name: Download Kinc Windows tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DOWNLOADING KINC WINDOWS TOOLS"
          Write-Host "=========================================="

          $tools = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc\Tools\windows_x64"

          if (Test-Path $tools) {
              Remove-Item `
                  $tools `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $tools `
              -Force |
              Out-Null

          $baseUrl = "https://github.com/Kode/KoreTools_windows_x64/raw/refs/heads/main"

          $files = @(
              "kmake.exe",
              "kraffiti.exe",
              "krafix.exe",
              "D3DCompiler_47.dll",
              "dxcompiler.dll",
              "dxil.dll"
          )

          foreach ($file in $files) {

              $url = "$baseUrl/$file"

              $destination = Join-Path `
                  $tools `
                  $file

              Write-Host ""
              Write-Host "Downloading:"
              Write-Host $file

              Write-Host "URL:"
              Write-Host $url

              Invoke-WebRequest `
                  -Uri $url `
                  -OutFile $destination `
                  -UseBasicParsing

              if (-not (Test-Path $destination)) {
                  throw "Failed to download $file."
              }

              $info = Get-Item $destination

              if ($info.Length -eq 0) {
                  throw "$file is empty."
              }

              Write-Host "Downloaded: $($info.Length) bytes"
          }

      # ============================================================
      # 12. VALIDAR KINC TOOLS
      # ============================================================
      - name: Verify Kinc Windows tools
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING KINC WINDOWS TOOLS"
          Write-Host "=========================================="

          $tools = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc\Tools\windows_x64"

          $required = @(
              "kmake.exe",
              "kraffiti.exe",
              "krafix.exe",
              "D3DCompiler_47.dll",
              "dxcompiler.dll",
              "dxil.dll"
          )

          foreach ($file in $required) {

              $path = Join-Path `
                  $tools `
                  $file

              if (-not (Test-Path $path)) {
                  throw "Required Kinc tool missing: $file"
              }

              $info = Get-Item $path

              if ($info.Length -eq 0) {
                  throw "Required Kinc tool is empty: $file"
              }

              Write-Host "OK: $file [$($info.Length) bytes]"
          }

          Write-Host ""
          Write-Host "kmake:"
          & "$tools\kmake.exe" --help 2>&1 |
              Select-Object -First 5

      # ============================================================
      # 13. V8
      # ============================================================
      - name: Determine V8 revision
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "V8 REVISION"
          Write-Host "=========================================="

          $armorcore = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $entry = git -C $armorcore ls-tree HEAD v8

          if (-not $entry) {
              throw "V8 gitlink not found."
          }

          $sha = $entry.Split("`t")[0].Split(" ")[2]

          if (-not $sha) {
              throw "Could not determine V8 SHA."
          }

          Write-Host ""
          Write-Host "V8 SHA:"
          Write-Host $sha

          "V8_SHA=$sha" >> $env:GITHUB_ENV

      # ============================================================
      # 14. DOWNLOAD V8
      # ============================================================
      - name: Download exact V8
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "DOWNLOADING V8"
          Write-Host "=========================================="

          $destination = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8"

          $archive = Join-Path `
              $env:RUNNER_TEMP `
              "v8.zip"

          $extract = Join-Path `
              $env:RUNNER_TEMP `
              "v8_extract"

          $url = "https://github.com/armory3d/v8_bin/archive/$env:V8_SHA.zip"

          if (Test-Path $destination) {
              Remove-Item `
                  $destination `
                  -Recurse `
                  -Force
          }

          if (Test-Path $archive) {
              Remove-Item `
                  $archive `
                  -Force
          }

          if (Test-Path $extract) {
              Remove-Item `
                  $extract `
                  -Recurse `
                  -Force
          }

          Write-Host ""
          Write-Host "URL:"
          Write-Host $url

          Invoke-WebRequest `
              -Uri $url `
              -OutFile $archive `
              -UseBasicParsing

          if (-not (Test-Path $archive)) {
              throw "V8 archive was not downloaded."
          }

          New-Item `
              -ItemType Directory `
              -Path $extract `
              -Force |
              Out-Null

          Expand-Archive `
              -Path $archive `
              -DestinationPath $extract `
              -Force

          $root = Get-ChildItem `
              $extract `
              -Directory |
              Select-Object -First 1

          if (-not $root) {
              throw "V8 extraction failed."
          }

          New-Item `
              -ItemType Directory `
              -Path $destination `
              -Force |
              Out-Null

          Copy-Item `
              -Path (Join-Path $root.FullName "*") `
              -Destination $destination `
              -Recurse `
              -Force

          Write-Host ""
          Write-Host "V8 installed."

      # ============================================================
      # 15. VALIDAR V8
      # ============================================================
      - name: Verify V8 monolith
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING V8"
          Write-Host "=========================================="

          $release = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release"

          $archive = Join-Path `
              $release `
              "v8_monolith.7z"

          if (-not (Test-Path $archive)) {

              Write-Host ""
              Write-Host "Available files:"

              if (Test-Path $release) {
                  Get-ChildItem `
                      $release `
                      -Recurse |
                      Select-Object FullName, Length
              }

              throw "v8_monolith.7z not found."
          }

          Write-Host ""
          Write-Host "Found:"
          Write-Host $archive

      # ============================================================
      # 16. EXTRAIR V8 MONOLITH
      # ============================================================
      - name: Extract V8 monolith
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "EXTRACTING V8 MONOLITH"
          Write-Host "=========================================="

          $release = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release"

          $archive = Join-Path `
              $release `
              "v8_monolith.7z"

          $lib = Join-Path `
              $release `
              "v8_monolith.lib"

          if (-not (Test-Path $lib)) {

              & $env:SEVEN_ZIP `
                  x `
                  $archive `
                  "-o$release" `
                  "-y" `
                  "-aoa"

              if ($LASTEXITCODE -ne 0) {
                  throw "7-Zip failed to extract V8 monolith."
              }
          }

          if (-not (Test-Path $lib)) {
              throw "v8_monolith.lib was not extracted."
          }

          $info = Get-Item $lib

          Write-Host ""
          Write-Host "v8_monolith.lib:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 17. 7-ZIP
      # ============================================================
      - name: Locate 7-Zip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "LOCATING 7-ZIP"
          Write-Host "=========================================="

          $paths = @(
              "${env:ProgramFiles}\7-Zip\7z.exe",
              "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          )

          $sevenZip = $null

          foreach ($path in $paths) {

              if (Test-Path $path) {
                  $sevenZip = $path
                  break
              }
          }

          if (-not $sevenZip) {

              $cmd = Get-Command 7z.exe `
                  -ErrorAction SilentlyContinue

              if ($cmd) {
                  $sevenZip = $cmd.Source
              }
          }

          if (-not $sevenZip) {
              Write-Host "7-Zip not found. Installing..."
              choco install 7zip -y --no-progress

              foreach ($path in $paths) {

                  if (Test-Path $path) {
                      $sevenZip = $path
                      break
                  }
              }
          }

          if (-not $sevenZip) {
              throw "7-Zip could not be located."
          }

          Write-Host ""
          Write-Host "7-Zip:"
          Write-Host $sevenZip

          "SEVEN_ZIP=$sevenZip" >> $env:GITHUB_ENV

      # ============================================================
      # 18. REVALIDAR V8 APÓS 7-ZIP
      # ============================================================
      - name: Verify V8 library
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $lib = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\v8\libraries\win32\release\v8_monolith.lib"

          if (-not (Test-Path $lib)) {
              throw "v8_monolith.lib was not found."
          }

          $info = Get-Item $lib

          Write-Host "V8 library:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 19. WINDOW HANDLING PATCH
      # ============================================================
      - name: Apply window handling patch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "APPLYING WINDOW HANDLING PATCH"
          Write-Host "=========================================="

          $armorcore = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore"

          $patch = Join-Path `
              $armorcore `
              "patch\window_handling.diff"

          if (-not (Test-Path $patch)) {
              throw "window_handling.diff not found."
          }

          Push-Location $armorcore

          try {

              git apply `
                  --check `
                  "patch/window_handling.diff" `
                  --directory=Kinc

              if ($LASTEXITCODE -ne 0) {
                  throw "window_handling.diff does not apply to this Kinc revision."
              }

              git apply `
                  "patch/window_handling.diff" `
                  --directory=Kinc

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to apply window_handling.diff."
              }

          }
          finally {
              Pop-Location
          }

          Write-Host ""
          Write-Host "Patch applied successfully."

      # ============================================================
      # 20. VERIFICAR MAKE
      # ============================================================
      - name: Verify legacy Kinc build command
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING KINC BUILD"
          Write-Host "=========================================="

          $make = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc\make"

          if (-not (Test-Path $make)) {
              throw "Kinc make script was not found."
          }

          Write-Host ""
          Write-Host "Kinc make:"
          Write-Host $make

          $tools = Join-Path `
              $env:GITHUB_WORKSPACE `
              "armorcore\Kinc\Tools\windows_x64"

          $kmake = Join-Path `
              $tools `
              "kmake.exe"

          $krafix = Join-Path `
              $tools `
              "krafix.exe"

          $kraffiti = Join-Path `
              $tools `
              "kraffiti.exe"

          foreach ($file in @($kmake, $krafix, $kraffiti)) {

              if (-not (Test-Path $file)) {
                  throw "Required Kinc executable missing: $file"
              }

              Write-Host "OK: $file"
          }

      # ============================================================
      # 21. GERAR PROJETO D3D11
      #
      # Fluxo oficial da geração ArmorPaint 0.9.
      # ============================================================
      - name: Generate ArmorPaint D3D11 project
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          echo ==========================================
          echo GENERATING ARMORPAINT D3D11 PROJECT
          echo ==========================================

          armorcore\Kinc\make --from armorcore -g direct3d11

          if errorlevel 1 (
              echo.
              echo ==========================================
              echo KINC MAKE FAILED
              echo ==========================================
              exit /b 1
          )

          echo.
          echo Kinc make completed successfully.

      # ============================================================
      # 22. VERIFICAR SOLUTION
      # ============================================================
      - name: Verify Visual Studio solution
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING VISUAL STUDIO SOLUTION"
          Write-Host "=========================================="

          $expected = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\ArmorPaint.sln"

          if (Test-Path $expected) {

              Write-Host ""
              Write-Host "Found:"
              Write-Host $expected

              "ARMORPAINT_SOLUTION=$expected" >> $env:GITHUB_ENV
              exit 0
          }

          Write-Host ""
          Write-Host "ArmorPaint.sln not found."
          Write-Host ""
          Write-Host "Searching for .sln / .slnx..."

          $solutions = Get-ChildItem `
              -Path $env:GITHUB_WORKSPACE `
              -Include "*.sln","*.slnx" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

          if (-not $solutions) {

              Write-Host ""
              Write-Host "Build tree:"

              $build = Join-Path `
                  $env:GITHUB_WORKSPACE `
                  "build"

              if (Test-Path $build) {
                  Get-ChildItem `
                      $build `
                      -Recurse |
                      Select-Object FullName
              }

              throw "No Visual Studio solution was generated."
          }

          Write-Host ""
          Write-Host "Solutions found:"

          foreach ($solution in $solutions) {
              Write-Host $solution.FullName
          }

          $selected = $solutions |
              Where-Object {
                  $_.Name -eq "ArmorPaint.sln"
              } |
              Select-Object -First 1

          if (-not $selected) {
              $selected = $solutions |
                  Select-Object -First 1
          }

          Write-Host ""
          Write-Host "Using:"
          Write-Host $selected.FullName

          "ARMORPAINT_SOLUTION=$($selected.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 23. COMPILAR RELEASE X64
      # ============================================================
      - name: Build ArmorPaint Release x64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "BUILDING RELEASE X64"
          Write-Host "=========================================="

          if (-not $env:ARMORPAINT_SOLUTION) {
              throw "ARMORPAINT_SOLUTION is not defined."
          }

          Write-Host ""
          Write-Host "Solution:"
          Write-Host $env:ARMORPAINT_SOLUTION

          Write-Host ""
          Write-Host "Configuration: Release"
          Write-Host "Platform: x64"

          & msbuild.exe `
              $env:ARMORPAINT_SOLUTION `
              /m `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed with exit code $LASTEXITCODE."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "MSBUILD SUCCEEDED"
          Write-Host "=========================================="

      # ============================================================
      # 24. LOCALIZAR EXECUTÁVEL
      # ============================================================
      - name: Find ArmorPaint executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SEARCHING ARMORPAINT.EXE"
          Write-Host "=========================================="

          $build = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build"

          $matches = @(
              Get-ChildItem `
                  $build `
                  -Filter "ArmorPaint.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue
          )

          if ($matches.Count -eq 0) {

              Write-Host ""
              Write-Host "Executable files:"

              Get-ChildItem `
                  $build `
                  -Filter "*.exe" `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object FullName, Length

              throw "ArmorPaint.exe was not produced."
          }

          Write-Host ""
          Write-Host "Found:"

          foreach ($match in $matches) {
              Write-Host "$($match.FullName) [$($match.Length) bytes]"
          }

          $selected = $matches |
              Where-Object {
                  $_.FullName -match "\\x64\\Release\\ArmorPaint\.exe$"
              } |
              Select-Object -First 1

          if (-not $selected) {
              $selected = $matches | Select-Object -First 1
          }

          if ($selected.Length -lt 1000000) {
              throw "ArmorPaint.exe appears suspiciously small."
          }

          Write-Host ""
          Write-Host "Selected:"
          Write-Host $selected.FullName

          "ARMORPAINT_EXE=$($selected.FullName)" >> $env:GITHUB_ENV

      # ============================================================
      # 25. MONTAR BUILD/KROM
      # ============================================================
      - name: Assemble portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "ASSEMBLING PORTABLE PACKAGE"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $release = Split-Path `
              $env:ARMORPAINT_EXE `
              -Parent

          if (-not (Test-Path $krom)) {
              throw "build\krom does not exist."
          }

          if (-not (Test-Path $release)) {
              throw "Release directory does not exist."
          }

          Write-Host ""
          Write-Host "Release:"
          Write-Host $release

          Write-Host ""
          Write-Host "Runtime:"
          Write-Host $krom

          Copy-Item `
              -Path (Join-Path $release "*") `
              -Destination $krom `
              -Recurse `
              -Force

          $finalExe = Join-Path `
              $krom `
              "ArmorPaint.exe"

          if (-not (Test-Path $finalExe)) {

              Copy-Item `
                  $env:ARMORPAINT_EXE `
                  $finalExe `
                  -Force
          }

          if (-not (Test-Path $finalExe)) {
              throw "ArmorPaint.exe was not copied to build\krom."
          }

          Write-Host ""
          Write-Host "Final executable:"
          Write-Host $finalExe

      # ============================================================
      # 26. VERIFICAÇÃO FINAL
      # ============================================================
      - name: Verify final package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "FINAL PACKAGE VERIFICATION"
          Write-Host "=========================================="

          $krom = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $exe = Join-Path `
              $krom `
              "ArmorPaint.exe"

          if (-not (Test-Path $krom)) {
              throw "build\krom does not exist."
          }

          if (-not (Test-Path $exe)) {
              throw "ArmorPaint.exe does not exist."
          }

          $info = Get-Item $exe

          if ($info.Length -lt 1000000) {
              throw "Final ArmorPaint.exe is suspiciously small."
          }

          $files = @(
              Get-ChildItem `
                  $krom `
                  -Recurse `
                  -File
          )

          if ($files.Count -eq 0) {
              throw "Final package is empty."
          }

          Write-Host ""
          Write-Host "ArmorPaint.exe:"
          Write-Host $exe

          Write-Host ""
          Write-Host "Executable size:"
          Write-Host "$($info.Length) bytes"

          Write-Host ""
          Write-Host "Files:"
          Write-Host $files.Count

      # ============================================================
      # 27. ZIP
      # ============================================================
      - name: Create portable ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING ZIP"
          Write-Host "=========================================="

          $source = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\krom"

          $zip = Join-Path `
              $env:GITHUB_WORKSPACE `
              "ArmorPaint-0.9-23.08-Windows-x64-D3D11.zip"

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          Compress-Archive `
              -Path (Join-Path $source "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "ZIP creation failed."
          }

          $info = Get-Item $zip

          Write-Host ""
          Write-Host "ZIP:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

      # ============================================================
      # 28. UPLOAD DIRETÓRIO
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11
          path: build/krom
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 29. UPLOAD ZIP
      # ============================================================
      - name: Upload ArmorPaint 0.9 D3D11 ZIP
        uses: actions/upload-artifact@v5
        with:
          name: ArmorPaint-0.9-23.08-Windows-x64-D3D11-ZIP
          path: ArmorPaint-0.9-23.08-Windows-x64-D3D11.zip
          if-no-files-found: error
          compression-level: 0
