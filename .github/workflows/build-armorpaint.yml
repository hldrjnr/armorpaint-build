name: Build ArmorPaint Windows x64 - Vulkan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ArmorPaint Windows x64 Vulkan
    runs-on: windows-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout ArmorPaint
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: main
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 2. SUBMODULES
      # ============================================================
      - name: Initialize submodules
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "INITIALIZING SUBMODULES"
          Write-Host "=========================================="

          git submodule sync --recursive

          if ($LASTEXITCODE -ne 0) {
              throw "git submodule sync failed."
          }

          git submodule update --init --recursive

          if ($LASTEXITCODE -ne 0) {
              throw "git submodule update failed."
          }

          Write-Host ""
          Write-Host "Submodule status:"
          git submodule status --recursive

      # ============================================================
      # 3. VULKAN SDK
      #
      # ArmorPaint precisa gerar SPIR-V quando compilado com Vulkan.
      # ============================================================
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
          quiet: true

      # ============================================================
      # 4. VERIFICAR VULKAN SDK
      # ============================================================
      - name: Verify Vulkan SDK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING VULKAN SDK"
          Write-Host "=========================================="

          if (-not $env:VULKAN_SDK) {
              throw "VULKAN_SDK environment variable was not set."
          }

          Write-Host "VULKAN_SDK:"
          Write-Host $env:VULKAN_SDK

          if (-not (Test-Path $env:VULKAN_SDK)) {
              throw "VULKAN_SDK path does not exist."
          }

          Write-Host ""
          Write-Host "Vulkan SDK contents:"
          Get-ChildItem $env:VULKAN_SDK |
              Select-Object Name

      # ============================================================
      # 5. VISUAL STUDIO / CLANG
      # ============================================================
      - name: Verify Visual Studio toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING VISUAL STUDIO TOOLCHAIN"
          Write-Host "=========================================="

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
              throw "vswhere.exe not found."
          }

          $vsInstall = & $vswhere `
              -latest `
              -products "*" `
              -property installationPath

          if (-not $vsInstall) {
              throw "Visual Studio installation not found."
          }

          Write-Host "Visual Studio:"
          Write-Host $vsInstall

          $vcvars = & $vswhere `
              -latest `
              -products "*" `
              -find "VC\Auxiliary\Build\vcvars64.bat"

          if (-not $vcvars) {
              throw "vcvars64.bat not found."
          }

          Write-Host ""
          Write-Host "vcvars64:"
          Write-Host $vcvars

          $clang = & $vswhere `
              -latest `
              -products "*" `
              -find "VC\Tools\Llvm\x64\bin\clang-cl.exe"

          if (-not $clang) {
              throw "clang-cl.exe not found."
          }

          Write-Host ""
          Write-Host "clang-cl:"
          Write-Host $clang

          & $clang --version

      # ============================================================
      # 6. VERIFY ARMORPAINT SOURCE
      # ============================================================
      - name: Verify ArmorPaint source tree
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING SOURCE TREE"
          Write-Host "=========================================="

          $required = @(
              "base\make.bat",
              "base\tools\make.js",
              "base\tools\bin\windows_x64\amake.exe",
              "paint"
          )

          foreach ($item in $required) {

              if (-not (Test-Path $item)) {
                  throw "Required path not found: $item"
              }

              Write-Host "OK: $item"
          }

      # ============================================================
      # 7. CLEAN BUILD
      # ============================================================
      - name: Clean build directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CLEANING BUILD DIRECTORY"
          Write-Host "=========================================="

          $buildPath = Join-Path `
              $env:GITHUB_WORKSPACE `
              "paint\build"

          if (Test-Path $buildPath) {
              Remove-Item `
                  $buildPath `
                  -Recurse `
                  -Force
          }

          Write-Host "Build directory cleaned."

      # ============================================================
      # 8. BUILD VULKAN
      #
      # Explicitamente usamos:
      #
      #   --graphics vulkan
      #
      # Em vez do default:
      #
      #   direct3d12
      # ============================================================
      - name: Build ArmorPaint Vulkan Release x64
        shell: cmd
        working-directory: paint
        run: |
          echo ==========================================
          echo BUILDING ARMORPAINT VULKAN
          echo ==========================================

          echo VULKAN_SDK=%VULKAN_SDK%

          ..\base\make.bat --target windows --graphics vulkan --compile

          if errorlevel 1 (
            echo.
            echo ==========================================
            echo ARMORPAINT VULKAN BUILD FAILED
            echo ==========================================
            exit /b 1
          )

          echo.
          echo ==========================================
          echo ARMORPAINT VULKAN BUILD COMPLETED
          echo ==========================================

      # ============================================================
      # 9. VERIFICAR OUTPUT
      # ============================================================
      - name: Verify build output
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VERIFYING BUILD OUTPUT"
          Write-Host "=========================================="

          $out = Join-Path `
              $env:GITHUB_WORKSPACE `
              "paint\build\out"

          $exe = Join-Path `
              $out `
              "ArmorPaint.exe"

          if (-not (Test-Path $out)) {
              throw "paint\build\out does not exist."
          }

          if (-not (Test-Path $exe)) {
              throw "ArmorPaint.exe was not generated."
          }

          $info = Get-Item $exe

          Write-Host ""
          Write-Host "Executable:"
          Write-Host $info.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($info.Length) bytes"

          Write-Host ""
          Write-Host "Output contents:"

          Get-ChildItem `
              -Path $out `
              -Recurse `
              -File |
              ForEach-Object {
                  $relative = $_.FullName.Substring($out.Length).TrimStart("\")
                  Write-Host "$relative [$($_.Length) bytes]"
              }

      # ============================================================
      # 10. DIAGNÓSTICO --HELP
      #
      # NÃO falha a build.
      # ArmorPaint retorna 1 propositalmente ao mostrar --help.
      # ============================================================
      - name: Diagnostic executable loading
        shell: powershell
        working-directory: paint\build\out
        continue-on-error: true
        run: |
          Write-Host "=========================================="
          Write-Host "DIAGNOSTIC EXECUTABLE LOADING"
          Write-Host "=========================================="

          $exe = ".\ArmorPaint.exe"

          if (-not (Test-Path $exe)) {
              Write-Warning "ArmorPaint.exe not found."
              exit 0
          }

          $stdout = Join-Path `
              $env:RUNNER_TEMP `
              "armorpaint_stdout.txt"

          $stderr = Join-Path `
              $env:RUNNER_TEMP `
              "armorpaint_stderr.txt"

          $process = Start-Process `
              -FilePath $exe `
              -ArgumentList "--help" `
              -WorkingDirectory (Get-Location) `
              -PassThru `
              -Wait `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr

          Write-Host ""
          Write-Host "Exit code: $($process.ExitCode)"

          Write-Host ""
          Write-Host "========== STDOUT =========="

          if (Test-Path $stdout) {
              Get-Content $stdout
          }

          Write-Host ""
          Write-Host "========== STDERR =========="

          if (Test-Path $stderr) {
              Get-Content $stderr
          }

          Write-Host ""
          Write-Host "Diagnostic complete."

      # ============================================================
      # 11. CRIAR PACOTE PORTÁTIL
      # ============================================================
      - name: Create portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING PORTABLE PACKAGE"
          Write-Host "=========================================="

          $source = Join-Path `
              $env:GITHUB_WORKSPACE `
              "paint\build\out"

          $artifact = Join-Path `
              $env:GITHUB_WORKSPACE `
              "artifact"

          if (-not (Test-Path $source)) {
              throw "Build output not found."
          }

          if (Test-Path $artifact) {
              Remove-Item `
                  $artifact `
                  -Recurse `
                  -Force
          }

          New-Item `
              -ItemType Directory `
              -Path $artifact `
              -Force |
              Out-Null

          Copy-Item `
              -Path (Join-Path $source "*") `
              -Destination $artifact `
              -Recurse `
              -Force

          $finalExe = Join-Path `
              $artifact `
              "ArmorPaint.exe"

          if (-not (Test-Path $finalExe)) {
              throw "ArmorPaint.exe missing from final package."
          }

          Write-Host ""
          Write-Host "Portable package created."

          Write-Host ""
          Write-Host "Package contents:"

          Get-ChildItem `
              $artifact `
              -Recurse `
              -File |
              ForEach-Object {
                  $relative = $_.FullName.Substring($artifact.Length).TrimStart("\")
                  Write-Host "$relative [$($_.Length) bytes]"
              }

      # ============================================================
      # 12. ZIP
      # ============================================================
      - name: Create ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CREATING ZIP"
          Write-Host "=========================================="

          $artifact = Join-Path `
              $env:GITHUB_WORKSPACE `
              "artifact"

          $zip = Join-Path `
              $env:GITHUB_WORKSPACE `
              "ArmorPaint-Windows-x64-Vulkan.zip"

          if (Test-Path $zip) {
              Remove-Item `
                  $zip `
                  -Force
          }

          Compress-Archive `
              -Path (Join-Path $artifact "*") `
              -DestinationPath $zip `
              -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
              throw "ZIP creation failed."
          }

          Write-Host ""
          Write-Host "ZIP created:"
          Write-Host $zip

      # ============================================================
      # 13. UPLOAD DIRETÓRIO
      # ============================================================
      - name: Upload ArmorPaint Vulkan package
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-Vulkan
          path: artifact
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 14. UPLOAD ZIP
      # ============================================================
      - name: Upload ArmorPaint Vulkan ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64-Vulkan-ZIP
          path: ArmorPaint-Windows-x64-Vulkan.zip
          if-no-files-found: error
          compression-level: 0
